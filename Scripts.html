<script>
/* ============================================================
   Scripts.html
   Validacion documental de docentes - Auditoria SNIES - UNIMETA

   Tres vistas: la bandeja, la ficha del docente y el informe.

   IDEA CENTRAL: la pantalla muestra TRABAJO, no estados. Todo lo
   visual (barra de fases, pestanas, tarjeta, cabecera de la ficha,
   bloque "que pasa", informe y CSV) se deriva de una sola funcion,
   situacion(), definida en la seccion MODELO. Asi un estado tiene un
   solo nombre en todo el sistema.

   Nunca se usa alert(), confirm() ni prompt(): todos los mensajes se
   dibujan dentro de la interfaz. Todo texto que viene de las hojas se
   inserta con textContent, nunca con innerHTML.
   ============================================================ */

'use strict';

/* ------------------------------------------------------------
   CODIGOS QUE MANDA EL SERVIDOR
   ------------------------------------------------------------ */

var COINCIDE    = 'COINCIDE';
var NO_COINCIDE = 'NO_COINCIDE';

var ESTADO_PENDIENTE  = 'PENDIENTE';
var ESTADO_VALIDADO   = 'VALIDADO';
var ESTADO_CORRECCION = 'REQUIERE_CORRECCION';

var ROL_TALENTO_HUMANO = 'TALENTO_HUMANO';
var ROL_REVISOR = 'REVISOR';
var ROL_CONSULTA = 'CONSULTA';

var REV_POR_ENVIAR = 'POR_ENVIAR';
var REV_EN_REVISION = 'EN_REVISION';
var REV_DEVUELTO = 'DEVUELTO';
var REV_APROBADO = 'APROBADO';
var REV_CONFORME = 'CONFORME';
var REV_NO_CONFORME = 'NO_CONFORME';

var MEN_PENDIENTE = 'PENDIENTE';
var MEN_SUBSANACION = 'SUBSANACION';
var MEN_LISTO = 'LISTO_RADICAR';
var MEN_RADICADO = 'RADICADO';
var MEN_SINCRONIZADO = 'SINCRONIZADO';
var MEN_SIN_NOVEDAD = 'SIN_NOVEDAD';

/** Version del contrato de datos que esta pagina espera del servidor. */
var CONTRATO_ESPERADO = 2;

var MAX_BYTES_PDF = 10 * 1024 * 1024;

var SIN_CONEXION = 'No fue posible comunicarse con el servidor. ' +
  'Verifique su conexión e intente de nuevo.';

/* MODELO:INICIO
   ------------------------------------------------------------
   MODELO: situacion(expediente, rol)

   Funciones puras, sin DOM: se pueden probar desde node con
   probar_situacion.mjs. Aceptan tanto un docente de obtenerDocentes
   como un registro de obtenerInformeGestion.

   Diez estados, cinco fases. Un nombre por estado en todo el sistema.
   ------------------------------------------------------------ */

var FASES = [
  { clave: 'CAPTURA',  nombre: 'Captura' },
  { clave: 'REVISION', nombre: 'Revisión' },
  { clave: 'MEN',      nombre: 'MEN' },
  { clave: 'SNIES',    nombre: 'SNIES' },
  { clave: 'CERRADO',  nombre: 'Cerrado' }
];

var SITUACIONES = {
  SIN_CARGAR:     { fase: 'CAPTURA',  etiqueta: 'Sin cargar',          actor: 'TALENTO_HUMANO' },
  BORRADOR:       { fase: 'CAPTURA',  etiqueta: 'Borrador',            actor: 'TALENTO_HUMANO' },
  DEVUELTO:       { fase: 'CAPTURA',  etiqueta: 'Devuelto',            actor: 'TALENTO_HUMANO' },
  EN_REVISION:    { fase: 'REVISION', etiqueta: 'En revisión',         actor: 'REVISOR' },
  POR_RADICAR:    { fase: 'MEN',      etiqueta: 'Por radicar',         actor: 'REVISOR' },
  EN_SUBSANACION: { fase: 'MEN',      etiqueta: 'En subsanación',      actor: 'NADIE' },
  LISTO_RADICAR:  { fase: 'MEN',      etiqueta: 'Listo para radicar',  actor: 'REVISOR' },
  RADICADO:       { fase: 'SNIES',    etiqueta: 'Radicado',            actor: 'REVISOR' },
  CONFIRMADO:     { fase: 'CERRADO',  etiqueta: 'Confirmado en SNIES', actor: 'NADIE' },
  SIN_NOVEDAD:    { fase: 'CERRADO',  etiqueta: 'Cerrado sin novedad', actor: 'NADIE' }
};

/** Orden del ciclo de vida: sirve para listar y para las tablas. */
var ORDEN_SITUACION = ['SIN_CARGAR', 'BORRADOR', 'DEVUELTO', 'EN_REVISION', 'POR_RADICAR',
  'EN_SUBSANACION', 'LISTO_RADICAR', 'RADICADO', 'CONFIRMADO', 'SIN_NOVEDAD'];

/**
 * La accion que cada estado le pide a cada rol. Una principal y, como
 * mucho, una secundaria. `accion` es una clave de texto: la interfaz la
 * traduce a un manejador (ACCIONES_UI), asi el modelo no toca el DOM.
 */
var ACCIONES_SITUACION = {
  SIN_CARGAR:    { TALENTO_HUMANO: { texto: 'Validar', accion: 'abrir' } },
  BORRADOR:      { TALENTO_HUMANO: { texto: 'Enviar al revisor', accion: 'enviar' } },
  DEVUELTO:      { TALENTO_HUMANO: { texto: 'Corregir', accion: 'abrir' } },
  EN_REVISION:   { REVISOR: { texto: 'Revisar', accion: 'abrir' } },
  POR_RADICAR:   { REVISOR: { texto: 'Marcar como radicado', accion: 'radicar',
                              secundaria: { texto: 'Poner en subsanación', accion: 'subsanar' } } },
  LISTO_RADICAR: { REVISOR: { texto: 'Marcar como radicado', accion: 'radicar',
                              secundaria: { texto: 'Volver a subsanación', accion: 'subsanar' } } },
  RADICADO:      { REVISOR: { texto: 'Confirmar en SNIES', accion: 'confirmarSnies' } }
};

/**
 * Orden dentro de "Por gestionar": lo mas urgente primero. Radicado va
 * al final a proposito: son muchos y no deben tapar lo que espera decision.
 */
var PRIORIDAD_BANDEJA = {
  TALENTO_HUMANO: ['DEVUELTO', 'BORRADOR', 'SIN_CARGAR'],
  REVISOR: ['EN_REVISION', 'LISTO_RADICAR', 'POR_RADICAR', 'RADICADO']
};

/**
 * Reduce cualquier forma de expediente a lo que decide su situacion.
 * El servidor manda estadoMen='PENDIENTE' tambien para no aprobados, asi
 * que el estado MEN solo cuenta si la revision esta aprobada.
 */
function normalizarExpediente(obj) {
  var o = obj || {};
  var tieneValidacion = o.tieneValidacion !== undefined ? !!o.tieneValidacion : !!o.revisado;
  var estadoRevision = String(o.estadoRevision || '').toUpperCase();
  var aprobado = estadoRevision === REV_APROBADO;
  var men = aprobado ? String(o.estadoMen || '').toUpperCase() : '';
  return {
    tieneValidacion: tieneValidacion,
    estadoRevision: estadoRevision,
    aprobado: aprobado,
    men: men,
    sincronizado: aprobado && (o.sincronizadoSnies === true || men === MEN_SINCRONIZADO),
    radicado: aprobado && (o.radicadoMen === true || men === MEN_RADICADO || men === MEN_SINCRONIZADO)
  };
}

function claveSituacion(obj) {
  var n = normalizarExpediente(obj);
  if (!n.tieneValidacion) return 'SIN_CARGAR';
  if (n.estadoRevision === REV_EN_REVISION) return 'EN_REVISION';
  if (n.estadoRevision === REV_DEVUELTO) return 'DEVUELTO';
  if (!n.aprobado) return 'BORRADOR';
  if (n.sincronizado) return 'CONFIRMADO';
  if (n.radicado) return 'RADICADO';
  if (n.men === MEN_SIN_NOVEDAD) return 'SIN_NOVEDAD';
  if (n.men === MEN_SUBSANACION) return 'EN_SUBSANACION';
  if (n.men === MEN_LISTO) return 'LISTO_RADICAR';
  return 'POR_RADICAR';
}

/** Fecha en que el expediente entro a su estado actual. */
function fechaEntradaDe(clave, o) {
  switch (clave) {
    case 'BORRADOR':       return o.fechaModificacion || '';
    case 'DEVUELTO':       return o.fechaRevision || '';
    case 'EN_REVISION':    return o.fechaEnvio || '';
    case 'POR_RADICAR':    return o.fechaRevision || '';
    case 'EN_SUBSANACION': return o.fechaSubsanacion || '';
    case 'LISTO_RADICAR':  return o.fechaDisponibleRadicacion || '';
    case 'RADICADO':       return o.fechaRadicacionMen || '';
    case 'CONFIRMADO':     return o.fechaSincronizacion || '';
    case 'SIN_NOVEDAD':    return o.fechaRevision || '';
    default:               return '';
  }
}

/** 'dd/MM/yyyy HH:mm' -> numero ordenable. Sin fecha: Infinity (al final). */
function fechaOrdenable(texto) {
  var m = /^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/.exec(String(texto || ''));
  if (!m) return Infinity;
  return Number(m[3] + m[2] + m[1] + (m[4] || '00') + (m[5] || '00'));
}

function situacion(obj, rol) {
  var o = obj || {};
  var clave = claveSituacion(o);
  var base = SITUACIONES[clave];
  var acciones = rol === ROL_CONSULTA ? null
    : ((ACCIONES_SITUACION[clave] || {})[rol] || null);
  var prioridadRol = PRIORIDAD_BANDEJA[rol] || [];
  var enBandeja = prioridadRol.indexOf(clave);

  return {
    clave: clave,
    fase: base.fase,
    etiqueta: base.etiqueta,
    actor: base.actor,
    leTocaA: function (r) { return r !== ROL_CONSULTA && base.actor === r; },
    accionPrincipal: acciones ? { texto: acciones.texto, accion: acciones.accion } : null,
    accionSecundaria: acciones && acciones.secundaria ? acciones.secundaria : null,
    fechaEntrada: fechaEntradaDe(clave, o),
    fechaLimite: clave === 'EN_SUBSANACION' ? (o.fechaDisponibleRadicacion || '') : '',
    prioridad: enBandeja !== -1 ? enBandeja : 10 + ORDEN_SITUACION.indexOf(clave)
  };
}

/** Pestana de la bandeja donde va un expediente para un rol. */
function pestanaDe(sit, rol) {
  if (sit.fase === 'CERRADO') return 'CERRADOS';
  if (sit.leTocaA(rol)) return 'MIA';
  return 'OTRAS';
}

function contarFases(situaciones) {
  var conteo = {};
  FASES.forEach(function (f) { conteo[f.clave] = 0; });
  situaciones.forEach(function (s) { conteo[s.fase]++; });
  return conteo;
}

function contarSituaciones(situaciones) {
  var conteo = {};
  ORDEN_SITUACION.forEach(function (c) { conteo[c] = 0; });
  situaciones.forEach(function (s) { conteo[s.clave]++; });
  return conteo;
}

function nombreActor(actor) {
  if (actor === 'TALENTO_HUMANO') return 'Talento Humano';
  if (actor === 'REVISOR') return 'Revisor';
  return 'Nadie: en espera';
}

/* MODELO:FIN */

/* ------------------------------------------------------------
   NOMBRES DE ROLES Y DE EVENTOS

   Los estados NO tienen mapa propio: su nombre sale de SITUACIONES.
   ------------------------------------------------------------ */

var NOMBRES_ROL = {
  TALENTO_HUMANO: 'Talento Humano',
  REVISOR: 'Revisor',
  CONSULTA: 'Solo consulta'
};

/**
 * Los eventos del historial en lenguaje llano. La hoja HistorialRevisiones
 * nunca se borra y guarda eventos que el codigo de hoy ya no emite (por
 * ejemplo AJUSTE_A_SUBSANACION_MEN): nombreEvento() tiene respaldo.
 */
var NOMBRES_EVENTO = {
  GUARDADO: 'Guardados',
  ENVIADO_A_REVISION: 'Enviados al revisor',
  APROBADO: 'Aprobados',
  APROBADO_CON_CORRECCION_REVISOR: 'Aprobados con corrección',
  DEVUELTO: 'Devueltos',
  SUBSANACION_MEN: 'Puestos en subsanación',
  AJUSTE_A_SUBSANACION_MEN: 'Ajustes de subsanación',
  RADICADO_MEN: 'Radicados',
  SINCRONIZADO_SNIES: 'Confirmados en SNIES',
  MIGRADO_A_REVISION: 'Migrados a revisión'
};

/** Orden de las columnas de eventos en la actividad por persona. */
var ORDEN_EVENTOS = ['GUARDADO', 'ENVIADO_A_REVISION', 'APROBADO',
  'APROBADO_CON_CORRECCION_REVISOR', 'DEVUELTO', 'SUBSANACION_MEN',
  'AJUSTE_A_SUBSANACION_MEN', 'RADICADO_MEN', 'SINCRONIZADO_SNIES', 'MIGRADO_A_REVISION'];

/** Nombre legible de un evento, conocido o no. */
function nombreEvento(clave) {
  if (NOMBRES_EVENTO[clave]) return NOMBRES_EVENTO[clave];
  // ALGO_QUE_NO_CONOZCO -> "Algo que no conozco"
  var texto = String(clave || '').replace(/_/g, ' ').toLowerCase().trim();
  return texto ? texto.charAt(0).toUpperCase() + texto.slice(1) : '—';
}

/** Nombre legible de un rol, incluido el seudo-rol de las migraciones. */
function nombreRol(clave) {
  if (NOMBRES_ROL[clave]) return NOMBRES_ROL[clave];
  if (clave === 'ADMINISTRADOR') return 'Administrador';
  var texto = String(clave || '').replace(/_/g, ' ').toLowerCase().trim();
  return texto ? texto.charAt(0).toUpperCase() + texto.slice(1) : '—';
}

/* ------------------------------------------------------------
   ESTADO DE LA PAGINA
   ------------------------------------------------------------ */

/** Datos de la auditoria, tal como los entrega obtenerDocentes(). */
var APP = {
  auditoria: '',
  criterios: [],
  perfil: { correo: '', nombre: '', rol: '', roles: [] },
  requisitos: { actaObligatoria: true, diplomaObligatorio: false },
  docentes: []
};

/**
 * Ficha abierta en este momento.
 *
 *   modo 'nueva'    -> Talento Humano, sin validacion guardada
 *   modo 'edicion'  -> Talento Humano, borrador o devuelto: editable
 *   modo 'consulta' -> cualquier otro caso (el revisor decide aparte)
 *
 * guardado conserva SIEMPRE la ultima version confirmada por el
 * servidor: es lo que permite descartar cambios sin volver a consultar.
 */
var FICHA = null;

/** Pestana activa de la bandeja: 'MIA', 'OTRAS' o 'CERRADOS'. */
var PESTANA = 'MIA';

/** Periodo del informe. Solo afecta a la actividad por persona. */
var PERIODO = { desde: '', hasta: '' };

var DOCUMENTO_SUBSANACION = '';

/* ------------------------------------------------------------
   UTILIDADES
   ------------------------------------------------------------ */

function $(id) { return document.getElementById(id); }

function crear(etiqueta, clase, texto) {
  var nodo = document.createElement(etiqueta);
  if (clase) nodo.className = clase;
  if (texto !== undefined && texto !== null) nodo.textContent = texto;
  return nodo;
}

function vaciar(nodo) {
  while (nodo.firstChild) nodo.removeChild(nodo.firstChild);
}

/** Quita tildes y pasa a minusculas, para comparar en el buscador. */
function plano(texto) {
  return String(texto == null ? '' : texto)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase();
}

/** Convierte dd/mm/aaaa al valor aaaa-mm-dd que exige input[type=date]. */
function fechaParaControl(valor) {
  var texto = String(valor || '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) return texto;

  var partes = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(texto);
  return partes ? partes[3] + '-' + partes[2] + '-' + partes[1] : '';
}

function fechaIsoLocal(fecha) {
  var dos = function (n) { return n < 10 ? '0' + n : String(n); };
  return fecha.getFullYear() + '-' + dos(fecha.getMonth() + 1) + '-' + dos(fecha.getDate());
}

function mananaIso() {
  var fecha = new Date();
  fecha.setDate(fecha.getDate() + 1);
  return fechaIsoLocal(fecha);
}

function estadoMenDe(docente) {
  if (docente && docente.sincronizadoSnies) return MEN_SINCRONIZADO;
  if (docente && docente.radicadoMen) return MEN_RADICADO;
  return docente && docente.estadoMen ? docente.estadoMen : MEN_PENDIENTE;
}

function anunciar(texto) { $('anuncio').textContent = texto; }

/**
 * Muestra un aviso dentro de la interfaz.
 *
 * Con `persistente` en true el aviso no se desvanece y gana un botón para
 * cerrarlo. Los mensajes que explican QUE FALTA HACER son siempre
 * persistentes: desaparecer solos era la causa de que la gente no supiera
 * cuál era su siguiente paso.
 */
function mostrarAviso(nodo, tipo, texto, persistente) {
  if (nodo._temporizadorAviso) clearTimeout(nodo._temporizadorAviso);
  nodo.className = 'aviso aviso-' + tipo;
  vaciar(nodo);
  nodo.appendChild(document.createTextNode(texto));
  nodo.hidden = false;

  if (persistente || tipo === 'error' || tipo === 'aviso') {
    nodo._temporizadorAviso = null;
    if (persistente || tipo === 'aviso') {
      var cerrar = crear('button', 'btn-mini aviso-cerrar', 'Cerrar');
      cerrar.type = 'button';
      cerrar.setAttribute('aria-label', 'Cerrar este mensaje');
      cerrar.addEventListener('click', function () { ocultarAviso(nodo); });
      nodo.appendChild(cerrar);
    }
    return;
  }

  nodo._temporizadorAviso = setTimeout(function () { ocultarAviso(nodo); }, 12000);
}

function confirmar(opciones) {
  var dialogo = $('dialogoConfirmar');
  var aceptar = $('btnAceptarConfirmar');
  var cancelar = $('btnCancelarConfirmar');

  $('tituloConfirmar').textContent = opciones.titulo;
  $('cuerpoConfirmar').textContent = opciones.cuerpo;
  aceptar.textContent = opciones.textoConfirmar || 'Confirmar';
  cancelar.textContent = opciones.textoCancelar || 'Cancelar';
  aceptar.className = opciones.peligro ? 'btn-primario' : 'btn-primario';

  var cerrar = function () {
    aceptar.removeEventListener('click', alAceptar);
    cancelar.removeEventListener('click', alCancelar);
    dialogo.removeEventListener('cancel', alCancelar);
    if (dialogo.open) dialogo.close();
  };

  function alAceptar() {
    cerrar();
    if (opciones.alConfirmar) opciones.alConfirmar();
  }

  function alCancelar(evento) {
    if (evento) evento.preventDefault();
    cerrar();
    if (opciones.alCancelar) opciones.alCancelar();
  }

  aceptar.addEventListener('click', alAceptar);
  cancelar.addEventListener('click', alCancelar);
  dialogo.addEventListener('cancel', alCancelar);   // tecla Escape

  if (typeof dialogo.showModal === 'function') dialogo.showModal();
  else dialogo.setAttribute('open', 'open');
  aceptar.focus();
}

function ocultarAviso(nodo) {
  if (nodo._temporizadorAviso) clearTimeout(nodo._temporizadorAviso);
  nodo._temporizadorAviso = null;
  nodo.hidden = true;
  nodo.textContent = '';
}

function mostrarCapa(texto) {
  $('textoCarga').textContent = texto;
  $('capaCarga').classList.add('visible');
  $('capaCarga').setAttribute('aria-hidden', 'false');
  anunciar(texto);
}

function ocultarCapa() {
  $('capaCarga').classList.remove('visible');
  $('capaCarga').setAttribute('aria-hidden', 'true');
}

function esTalentoHumano() { return APP.perfil.rol === ROL_TALENTO_HUMANO; }

function esRevisor() { return APP.perfil.rol === ROL_REVISOR; }

function esConsulta() { return APP.perfil.rol === ROL_CONSULTA; }

function puedeEditarValidacion() {
  if (!FICHA || !esTalentoHumano()) return false;
  var estado = FICHA.guardado ? FICHA.guardado.estadoRevision : REV_POR_ENVIAR;
  return estado === REV_POR_ENVIAR || estado === REV_DEVUELTO;
}

function docenteDe(documento) {
  for (var i = 0; i < APP.docentes.length; i++) {
    if (APP.docentes[i].documento === documento) return APP.docentes[i];
  }
  return null;
}

/** Version vigente de un expediente: la de la ficha si esta abierta. */
function versionActual(documento) {
  if (FICHA && FICHA.documento === documento && FICHA.guardado) return FICHA.guardado.version;
  var d = docenteDe(documento);
  return d ? d.version : 0;
}

/** Refleja en la lista lo que confirmo el servidor, sin volver a pedirla. */
function fusionarDocente(documento, parche) {
  var d = docenteDe(documento);
  if (!d || !parche) return;
  Object.keys(parche).forEach(function (k) {
    if (parche[k] !== undefined) d[k] = parche[k];
  });
}

/** Solo la fecha de un 'dd/MM/yyyy HH:mm'. */
function soloFecha(texto) {
  return String(texto || '').slice(0, 10);
}

/* ------------------------------------------------------------
   IDENTIDAD

   La pagina esta publicada en un sitio estatico, asi que quien
   autoriza no es el servidor de la pagina sino Google: al iniciar
   sesion entrega un token firmado que viaja en cada peticion y que
   Apps Script verifica. Sin token no se responde nada.

   El token NO se guarda en localStorage a proposito. Vive solo en
   memoria: cerrar la pestana cierra la sesion de la aplicacion.
   ------------------------------------------------------------ */

var SESION = { token: null, correo: '', rol: '' };
var INTENTOS_CARGA_GOOGLE = 50;
var ESPERA_CARGA_GOOGLE_MS = 200;

/**
 * Arranca el botón de Google y queda a la espera.
 *
 * La biblioteca de Google se descarga desde otro dominio. En conexiones
 * lentas puede terminar después de DOMContentLoaded, por lo que se espera
 * hasta diez segundos antes de mostrar un error real de carga.
 */
function iniciarPuerta(intento) {
  intento = intento || 0;

  if (!window.ID_CLIENTE_OAUTH) {
    mostrarAviso($('puertaError'), 'error',
      'La aplicación no está configurada: falta el identificador de cliente de Google. ' +
      'Avise al administrador.');
    return;
  }

  if (!window.google || !google.accounts || !google.accounts.id) {
    if (intento < INTENTOS_CARGA_GOOGLE) {
      setTimeout(function () {
        iniciarPuerta(intento + 1);
      }, ESPERA_CARGA_GOOGLE_MS);
      return;
    }

    mostrarAviso($('puertaError'), 'error',
      'No fue posible cargar el inicio de sesión de Google. ' +
      'Revise su conexión y actualice la página.');
    return;
  }

  google.accounts.id.initialize({
    client_id: window.ID_CLIENTE_OAUTH,
    callback: recibirCredencial,
    auto_select: true,
    cancel_on_tap_outside: false
  });

  google.accounts.id.renderButton($('botonGoogle'), {
    theme: 'outline',
    size: 'large',
    text: 'signin_with',
    shape: 'rectangular',
    locale: 'es',
    width: 280
  });

  // Si la persona ya tiene sesión de Google, entra sin pulsar nada.
  google.accounts.id.prompt();
}

/** Google entrega aquí el token de identidad. */
function recibirCredencial(respuesta) {
  if (!respuesta || !respuesta.credential) {
    mostrarAviso($('puertaError'), 'error', 'No se recibió la credencial de Google.');
    return;
  }

  SESION.token = respuesta.credential;
  SESION.correo = correoDelToken(respuesta.credential);

  ocultarAviso($('puertaError'));
  $('puertaTexto').textContent = 'Verificando su identidad...';

  // El servidor es quien decide de verdad: esta primera llamada sirve
  // tanto para cargar los datos como para validar la sesión.
  cargarDocentes();
}

/**
 * Lee el correo del token sin verificarlo, solo para mostrarlo en el
 * encabezado. La comprobación de verdad la hace el servidor: lo que se
 * lea aquí no autoriza nada.
 */
function correoDelToken(token) {
  try {
    var carga = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(carga)))).email || '';
  } catch (e) {
    return '';
  }
}

function abrirAplicacion() {
  $('puerta').hidden = true;
  if (SESION.correo) {
    $('sesionCorreo').textContent = SESION.correo;
    $('sesionRol').textContent = NOMBRES_ROL[APP.perfil.rol] || APP.perfil.rol || '';
    $('nombreRol').textContent = NOMBRES_ROL[APP.perfil.rol] || 'Acceso autorizado';
    actualizarSelectorRoles();
    $('sesion').hidden = false;
  }
}

/** Muestra el selector únicamente cuando la cuenta tiene más de un rol. */
function actualizarSelectorRoles() {
  var roles = Array.isArray(APP.perfil.roles) && APP.perfil.roles.length
    ? APP.perfil.roles
    : [APP.perfil.rol];
  var selector = $('selectorRol');
  selector.innerHTML = '';

  roles.forEach(function (rol) {
    var opcion = crear('option', '', NOMBRES_ROL[rol] || rol);
    opcion.value = rol;
    selector.appendChild(opcion);
  });

  selector.value = APP.perfil.rol;
  $('selectorRolContenedor').hidden = roles.length < 2;
}

/** Devuelve a la puerta de entrada, con un motivo. */
function cerrarSesion(motivo) {
  SESION.token = null;
  SESION.correo = '';
  SESION.rol = '';

  try {
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.disableAutoSelect();
    }
  } catch (e) { /* sin sesión de Google que cerrar */ }

  $('sesion').hidden = true;
  $('sesionRol').textContent = '';
  $('selectorRolContenedor').hidden = true;
  $('puerta').hidden = false;
  $('puertaTexto').textContent = 'Esta aplicación es de uso interno. ' +
    'Inicie sesión con su cuenta institucional para continuar.';

  if (motivo) mostrarAviso($('puertaError'), 'error', motivo);
  else ocultarAviso($('puertaError'));
}

/* ------------------------------------------------------------
   CONEXION CON EL SERVIDOR
   ------------------------------------------------------------ */

/**
 * Unica via hacia el servidor. Siempre lleva manejador de exito y de
 * fallo: ninguna operacion puede quedarse esperando para siempre.
 *
 * El cuerpo se manda como text/plain aunque sea JSON: asi el navegador
 * no hace la consulta previa de CORS (OPTIONS), que Apps Script no sabe
 * responder. Y sin cookies de Google, porque con varias cuentas abiertas
 * son ellas las que mandan la peticion a la sesion equivocada.
 */
function servidor(accion, argumento, exito, fallo) {
  // El simulador de la vista previa se anuncia así.
  if (window.SIMULADOR) {
    window.SIMULADOR(accion, argumento, exito, fallo);
    return;
  }

  if (!window.URL_SERVIDOR) {
    fallo('La aplicación no está configurada: falta la dirección del servidor.');
    return;
  }

  fetch(window.URL_SERVIDOR, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      token: SESION.token,
      rol: SESION.rol,
      accion: accion,
      argumento: argumento
    }),
    credentials: 'omit'
  })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (r) {
      if (r && r.ok) {
        try {
          exito(r.resultado);
        } catch (e) {
          console.error(e);
          fallo('Ocurrió un problema al mostrar la respuesta del servidor.');
        }
        return;
      }

      // El servidor rechazó la sesión: se vuelve a la puerta de entrada
      // en lugar de dejar a la persona ante un error que no puede resolver.
      if (r && r.sesion === 'INVALIDA') {
        cerrarSesion(r.error || 'Su sesión expiró. Vuelva a iniciar sesión.');
        return;
      }

      fallo((r && r.error) || SIN_CONEXION);
    }, function () {
      fallo(SIN_CONEXION);
    });
}

/* ------------------------------------------------------------
   ARRANQUE Y CARGA
   ------------------------------------------------------------ */

document.addEventListener('DOMContentLoaded', function () {
  conectarEventos();

  // En la vista previa no hay Google: se entra directo.
  if (window.SIMULADOR) {
    $('puerta').hidden = true;
    cargarDocentes();
    return;
  }

  iniciarPuerta();
});

function cargarDocentes() {
  $('listaCargando').hidden = false;
  $('listaVacia').hidden = true;
  vaciar($('listaDocentes'));
  ocultarAviso($('avisoGeneral'));
  mostrarVista('lista');

  servidor('obtenerDocentes', undefined, function (datos) {
    $('listaCargando').hidden = true;

    aplicarDatos(datos);
    titulosPorRol();
    aplicarRequisitos();
    PESTANA = esConsulta() ? 'OTRAS' : 'MIA';
    pintarBandeja();

    // El servidor respondió, luego la sesión es válida: se abre la app.
    abrirAplicacion();
    comprobarContrato(datos.contrato);
    anunciar('Bandeja cargada con ' + APP.docentes.length + ' docentes.');
  }, function (mensaje) {
    $('listaCargando').hidden = true;

    // Si aún no se ha entrado, el error va en la puerta: el aviso de
    // dentro quedaría tapado y la persona no vería nada.
    if (!$('puerta').hidden) {
      $('puertaTexto').textContent = 'Esta aplicación es de uso interno. ' +
        'Inicie sesión con su cuenta institucional para continuar.';
      mostrarAviso($('puertaError'), 'error', mensaje);
      return;
    }

    mostrarAviso($('avisoGeneral'), 'error',
      'No fue posible cargar la lista de docentes: ' + mensaje);
  });
}

function aplicarDatos(datos) {
  APP.auditoria  = datos.auditoria || '';
  APP.criterios  = datos.criterios || [];
  APP.requisitos = datos.requisitos || APP.requisitos;
  APP.perfil     = datos.perfil || APP.perfil;
  APP.docentes   = datos.docentes || [];
  SESION.rol     = APP.perfil.rol || '';
  if (APP.auditoria) $('nombreAuditoria').textContent = APP.auditoria;
}

/**
 * Tras cada escritura se vuelve a pedir la lista, sin capa de carga.
 * Con varias personas trabajando a la vez reduce los choques de version:
 * lo que ve cada una se parece mas a lo que hay de verdad.
 */
function refrescarEnSilencio() {
  servidor('obtenerDocentes', undefined, function (datos) {
    APP.docentes = datos.docentes || APP.docentes;
    pintarBandeja();
  }, function () {
    // Sin ruido: lo que se muestra ya refleja la respuesta de la escritura.
  });
}

/**
 * Avisa si el servidor publicado es anterior a esta pagina. Pasa si se
 * publica la pagina antes que el servidor, o si se revierte solo uno.
 */
function comprobarContrato(contrato) {
  if (Number(contrato) >= CONTRATO_ESPERADO) return;
  mostrarAviso($('avisoGeneral'), 'aviso',
    'El servidor publicado es anterior a esta página. Algunas funciones pueden fallar ' +
    'hasta que se publique la versión nueva en Apps Script.', true);
}

function titulosPorRol() {
  if (esTalentoHumano()) {
    $('tituloLista').textContent = 'Validación documental';
    $('descripcionLista').textContent =
      'Compare los datos reportados a SNIES con los soportes y envíe cada docente al ' +
      'revisor. La radicación ante el MEN la hace el revisor.';
  } else if (esRevisor()) {
    $('tituloLista').textContent = 'Revisión y radicación';
    $('descripcionLista').textContent =
      'Revise lo que envía Talento Humano, radique ante el MEN lo que tiene datos a ' +
      'corregir y confirme en SNIES cuando el dato ya aparezca.';
  } else {
    $('tituloLista').textContent = 'Avance de la auditoría';
    $('descripcionLista').textContent =
      'Vista de solo lectura del avance general. Esta cuenta no abre fichas ni ' +
      'modifica registros.';
  }

  $('btnAbrirTablero').hidden = !(esRevisor() || esConsulta());
  $('pestanaMia').hidden = esConsulta();
  $('pestanaOtras').querySelector('.pestana-rotulo').textContent =
    esConsulta() ? 'En curso' : 'En seguimiento';
}

/** Marca el acta y el diploma como obligatorios u opcionales. */
function aplicarRequisitos() {
  var acta = $('marcaActa');
  if (APP.requisitos.actaObligatoria) {
    acta.className = 'obligatorio';
    acta.textContent = '*';
  } else {
    acta.className = 'opcional';
    acta.textContent = 'Opcional';
  }

  var diploma = $('marcaDiploma');
  if (APP.requisitos.diplomaObligatorio) {
    diploma.className = 'obligatorio';
    diploma.textContent = '*';
  } else {
    diploma.className = 'opcional';
    diploma.textContent = 'Opcional';
  }
}

/* ------------------------------------------------------------
   EVENTOS
   ------------------------------------------------------------ */

function conectarEventos() {
  $('btnSalir').addEventListener('click', function () {
    protegerCambios(function () {
      FICHA = null;
      mostrarVista('lista');
      cerrarSesion('');
    });
  });

  $('selectorRol').addEventListener('change', function () {
    var selector = this;
    var nuevoRol = selector.value;
    var permitidos = APP.perfil.roles || [];
    if (permitidos.indexOf(nuevoRol) === -1 || nuevoRol === SESION.rol) return;

    protegerCambios(function () {
      SESION.rol = nuevoRol;
      FICHA = null;
      mostrarVista('lista');
      cargarDocentes();
    }, function () {
      // Si decide seguir editando, el desplegable vuelve a su rol real.
      selector.value = SESION.rol;
    });
  });

  $('buscador').addEventListener('input', pintarBandeja);

  $('pestanasBandeja').addEventListener('click', function (evento) {
    var boton = evento.target.closest('[data-pestana]');
    if (boton) elegirPestana(boton.getAttribute('data-pestana'));
  });

  // Pestañas con teclado: flechas izquierda y derecha.
  $('pestanasBandeja').addEventListener('keydown', function (evento) {
    if (evento.key !== 'ArrowRight' && evento.key !== 'ArrowLeft') return;
    var visibles = Array.prototype.filter.call(
      $('pestanasBandeja').querySelectorAll('[data-pestana]'),
      function (b) { return !b.hidden; });
    var actual = visibles.indexOf(document.activeElement);
    if (actual === -1) return;
    var paso = evento.key === 'ArrowRight' ? 1 : -1;
    var siguiente = visibles[(actual + paso + visibles.length) % visibles.length];
    siguiente.focus();
    elegirPestana(siguiente.getAttribute('data-pestana'));
    evento.preventDefault();
  });

  // Delegación: tarjetas y botones de la bandeja y de la ficha.
  $('listaDocentes').addEventListener('click', despacharAccion);
  $('panelSituacion').addEventListener('click', despacharAccion);
  $('listaVacia').addEventListener('click', function (evento) {
    var boton = evento.target.closest('[data-pestana]');
    if (boton) elegirPestana(boton.getAttribute('data-pestana'));
  });
  $('conteoResultados').addEventListener('click', function (evento) {
    var boton = evento.target.closest('[data-pestana]');
    if (boton) elegirPestana(boton.getAttribute('data-pestana'));
  });

  $('btnVolver').addEventListener('click', function () { volverAlListado(); });
  $('btnGuardar').addEventListener('click', function () { guardarRevision(false); });
  $('btnGuardarEnviar').addEventListener('click', accionEnviarFicha);
  $('btnCancelarEdicion').addEventListener('click', cancelarEdicion);
  $('btnDescargarInforme').addEventListener('click', descargarInformeGestion);
  $('btnAbrirTablero').addEventListener('click', abrirTablero);
  $('btnVolverTablero').addEventListener('click', function () {
    mostrarVista('lista');
    pintarBandeja();
  });
  $('btnImprimirTablero').addEventListener('click', function () { window.print(); });
  $('btnCancelarSubsanacion').addEventListener('click', cerrarDialogoSubsanacion);
  $('formSubsanacion').addEventListener('submit', confirmarSubsanacion);
  $('btnAprobar').addEventListener('click', function () { decidirRevision(REV_APROBADO); });
  $('btnDevolver').addEventListener('click', function () { decidirRevision(REV_DEVUELTO); });
  $('tabActa').addEventListener('click', function () { mostrarDocumento('acta'); });
  $('tabDiploma').addEventListener('click', function () { mostrarDocumento('diploma'); });

  // El formulario no envía nada por sí mismo: guardar es siempre un clic
  // deliberado en su botón. Así Enter dentro de un campo de corrección no
  // interrumpe la captura.
  $('formRevision').addEventListener('submit', function (evento) {
    evento.preventDefault();
  });

  // Última red: cerrar la pestaña con trabajo sin guardar.
  window.addEventListener('beforeunload', function (evento) {
    if (!hayCambiosPendientes()) return;
    evento.preventDefault();
    evento.returnValue = '';
  });

  $('listaCriterios').addEventListener('change', function (evento) {
    var opcion = evento.target.closest('.criterio');
    if (opcion && evento.target.type === 'radio') {
      refrescarCriterio(opcion);
      return;
    }

    var bloque = evento.target.closest('.correccion');
    if (bloque && evento.target.tagName === 'SELECT' && evento.target.value) {
      bloque.classList.remove('con-error');
    }
  });

  $('listaCriterios').addEventListener('input', function (evento) {
    if (evento.target.tagName !== 'INPUT' ||
        (evento.target.type !== 'text' && evento.target.type !== 'date')) return;
    var bloque = evento.target.closest('.correccion');
    if (bloque && evento.target.value.trim()) bloque.classList.remove('con-error');
  });

  $('archivoActa').addEventListener('change', function () {
    recibirArchivo('acta', this, 'acta de grado');
  });

  $('archivoDiploma').addEventListener('change', function () {
    recibirArchivo('diploma', this, 'diploma de grado');
  });
}

function mostrarVista(cual) {
  $('vistaLista').classList.toggle('activa', cual === 'lista');
  $('vistaFicha').classList.toggle('activa', cual === 'ficha');
  $('vistaTablero').classList.toggle('activa', cual === 'tablero');
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------
   BANDEJA
   ------------------------------------------------------------ */

function pintarBandeja() {
  var rol = APP.perfil.rol;
  var items = APP.docentes.map(function (d) {
    var sit = situacion(d, rol);
    return { d: d, sit: sit, pestana: pestanaDe(sit, rol) };
  });

  /* --- Avance --- */
  var conteo = contarFases(items.map(function (x) { return x.sit; }));
  pintarBarraFases($('barraFases'), $('barraFasesLeyenda'), conteo, items.length);
  pintarAvanceTotal($('avanceTotal'), conteo.CERRADO, items.length);

  /* --- Pestañas --- */
  if (esConsulta() && PESTANA === 'MIA') PESTANA = 'OTRAS';
  var porPestana = { MIA: [], OTRAS: [], CERRADOS: [] };
  items.forEach(function (x) { porPestana[x.pestana].push(x); });
  $('cifraMia').textContent = porPestana.MIA.length;
  $('cifraOtras').textContent = porPestana.OTRAS.length;
  $('cifraCerrados').textContent = porPestana.CERRADOS.length;
  marcarPestanas();

  /* --- Lista --- */
  var texto = plano($('buscador').value.trim());
  var coincide = function (x) {
    return !texto ||
      plano(x.d.nombreCompleto).indexOf(texto) !== -1 ||
      plano(x.d.documento).indexOf(texto) !== -1;
  };
  var visibles = porPestana[PESTANA].filter(coincide);
  ordenarBandeja(visibles);

  var contenedor = $('listaDocentes');
  vaciar(contenedor);
  visibles.forEach(function (x) { contenedor.appendChild(tarjetaDocente(x.d, x.sit)); });

  pintarVacio(visibles.length, texto);
  pintarConteo(visibles.length, texto, porPestana, coincide);
}

function ordenarBandeja(lista) {
  lista.sort(function (a, b) {
    if (a.sit.prioridad !== b.sit.prioridad) return a.sit.prioridad - b.sit.prioridad;
    var fa = fechaOrdenable(a.sit.fechaEntrada);
    var fb = fechaOrdenable(b.sit.fechaEntrada);
    if (fa !== fb) return fa < fb ? -1 : 1;
    return String(a.d.nombreCompleto || '').localeCompare(String(b.d.nombreCompleto || ''), 'es');
  });
}

/** Barra segmentada de 5 fases. La comparten la bandeja y el informe. */
function pintarBarraFases(barra, leyenda, conteo, total) {
  vaciar(barra);
  vaciar(leyenda);
  var descripcion = [];

  FASES.forEach(function (f) {
    var n = conteo[f.clave] || 0;
    if (n) {
      var segmento = crear('span', 'segmento fase-' + f.clave.toLowerCase());
      segmento.style.flexGrow = String(n);
      segmento.title = f.nombre + ': ' + n;
      barra.appendChild(segmento);
    }
    var item = crear('li', 'fase-' + f.clave.toLowerCase());
    item.appendChild(crear('span', 'muestra-fase'));
    item.appendChild(document.createTextNode(f.nombre + ' '));
    item.appendChild(crear('strong', null, String(n)));
    leyenda.appendChild(item);
    descripcion.push(f.nombre + ' ' + n);
  });

  barra.setAttribute('aria-label', 'Avance de ' + total + ' docentes: ' + descripcion.join(', '));
}

function pintarAvanceTotal(nodo, cerrados, total) {
  vaciar(nodo);
  nodo.appendChild(crear('strong', null, String(cerrados)));
  nodo.appendChild(document.createTextNode(' de ' + total + ' cerrados'));
}

function elegirPestana(pestana) {
  if (esConsulta() && pestana === 'MIA') return;
  PESTANA = pestana;
  pintarBandeja();
}

function marcarPestanas() {
  Array.prototype.forEach.call(
    $('pestanasBandeja').querySelectorAll('[data-pestana]'),
    function (boton) {
      var activa = boton.getAttribute('data-pestana') === PESTANA;
      boton.classList.toggle('activa', activa);
      boton.setAttribute('aria-selected', activa ? 'true' : 'false');
      boton.tabIndex = activa ? 0 : -1;
      if (activa) $('listaDocentes').setAttribute('aria-labelledby', boton.id);
    });
}

var NOMBRES_PESTANA = { MIA: 'Por gestionar', OTRAS: 'En seguimiento', CERRADOS: 'Finalizados' };

function nombrePestana(p) {
  if (p === 'OTRAS' && esConsulta()) return 'En curso';
  return NOMBRES_PESTANA[p];
}

function pintarVacio(cuantos, texto) {
  var nodo = $('listaVacia');
  vaciar(nodo);
  nodo.hidden = cuantos > 0 || !APP.docentes.length;
  if (!nodo.hidden) {
    if (texto) {
      nodo.appendChild(document.createTextNode('No hay docentes que coincidan con la búsqueda en esta pestaña.'));
    } else if (PESTANA === 'MIA') {
      nodo.appendChild(document.createTextNode('No tiene nada pendiente. '));
      var ir = crear('button', 'btn-mini', 'Ver expedientes en seguimiento');
      ir.type = 'button';
      ir.setAttribute('data-pestana', 'OTRAS');
      nodo.appendChild(ir);
    } else if (PESTANA === 'CERRADOS') {
      nodo.appendChild(document.createTextNode('Todavía no hay trámites cerrados.'));
    } else {
      nodo.appendChild(document.createTextNode('No hay docentes en esta pestaña.'));
    }
  }
}

/** Línea bajo el buscador. Si hay coincidencias en otra pestaña, lo dice. */
function pintarConteo(cuantos, texto, porPestana, coincide) {
  var nodo = $('conteoResultados');
  vaciar(nodo);
  if (!texto) return;

  nodo.appendChild(document.createTextNode(
    cuantos + (cuantos === 1 ? ' coincidencia' : ' coincidencias') + ' en esta pestaña.'));

  ['MIA', 'OTRAS', 'CERRADOS'].forEach(function (p) {
    if (p === PESTANA || (p === 'MIA' && esConsulta())) return;
    var n = porPestana[p].filter(coincide).length;
    if (!n) return;
    nodo.appendChild(document.createTextNode(' '));
    var ir = crear('button', 'btn-mini', n + ' más en ' + nombrePestana(p));
    ir.type = 'button';
    ir.setAttribute('data-pestana', p);
    nodo.appendChild(ir);
  });
}

/** Tarjeta mínima: un estado y una acción. */
function tarjetaDocente(d, sit) {
  var fila = crear('article', 'docente fase-' + sit.fase.toLowerCase());

  var datos = crear('div', 'docente-datos');
  var puedeAbrir = esTalentoHumano() || esRevisor();
  var nombre;
  if (puedeAbrir) {
    nombre = crear('button', 'docente-nombre', d.nombreCompleto || '(sin nombre)');
    nombre.type = 'button';
    nombre.setAttribute('data-accion', 'abrir');
    nombre.setAttribute('data-documento', d.documento);
    nombre.setAttribute('aria-label', 'Abrir la ficha de ' + (d.nombreCompleto || d.documento));
  } else {
    nombre = crear('p', 'docente-nombre', d.nombreCompleto || '(sin nombre)');
  }
  datos.appendChild(nombre);
  datos.appendChild(crear('p', 'docente-documento', (d.tipoDocumento || 'CC') + ' ' + d.documento));

  var meta = metaDe(sit);
  if (meta) datos.appendChild(crear('p', 'docente-meta', meta));

  // El motivo de una devolución, a la vista de quien debe corregir.
  if (sit.clave === 'DEVUELTO' && esTalentoHumano() && d.observacionRevision) {
    var motivo = String(d.observacionRevision);
    datos.appendChild(crear('blockquote', 'docente-motivo',
      motivo.length > 160 ? motivo.slice(0, 157).trim() + '…' : motivo));
  }
  fila.appendChild(datos);

  var acciones = crear('div', 'docente-acciones');
  acciones.appendChild(insigniaSituacion(sit));

  // Una ficha ya revisada o que no exige una accion inmediata seguia siendo
  // accesible desde el nombre, pero ese acceso era demasiado discreto. El
  // boton explicito permite consultar la revision y los soportes sin editar.
  var accionAbreFicha = sit.accionPrincipal && sit.accionPrincipal.accion === 'abrir';
  if (puedeAbrir && !accionAbreFicha) {
    acciones.appendChild(botonAccion(
      { texto: 'Ver revisión y soportes', accion: 'abrir' },
      d,
      'btn-secundario btn-compacto'
    ));
  }

  if (sit.accionSecundaria) {
    acciones.appendChild(botonAccion(sit.accionSecundaria, d, 'btn-mini'));
  }
  if (sit.accionPrincipal) {
    acciones.appendChild(botonAccion(sit.accionPrincipal, d, 'btn-compacto btn-primario'));
  }

  fila.appendChild(acciones);
  return fila;
}

function metaDe(sit) {
  var partes = [];
  if (sit.clave === 'EN_SUBSANACION' && sit.fechaLimite) {
    partes.push('Se libera el ' + sit.fechaLimite);
  } else if (sit.fechaEntrada) {
    partes.push('Desde el ' + soloFecha(sit.fechaEntrada));
  }
  if (!sit.leTocaA(APP.perfil.rol) && sit.fase !== 'CERRADO') {
    partes.push(sit.actor === 'NADIE' ? 'En espera' : 'En manos de ' + nombreActor(sit.actor));
  }
  return partes.join(' · ');
}

function insigniaSituacion(sit) {
  var insignia = crear('span', 'insignia insignia-fase fase-' + sit.fase.toLowerCase());
  insignia.appendChild(crear('span', 'muestra-fase'));
  insignia.appendChild(document.createTextNode(sit.etiqueta));
  return insignia;
}

function botonAccion(accion, d, clases) {
  var boton = crear('button', clases, accion.texto);
  boton.type = 'button';
  boton.setAttribute('data-accion', accion.accion);
  boton.setAttribute('data-documento', d.documento);
  boton.setAttribute('aria-label', accion.texto + ': ' + (d.nombreCompleto || d.documento));
  return boton;
}

/* ------------------------------------------------------------
   ACCIONES DEL EXPEDIENTE

   Se pueden lanzar desde la tarjeta de la bandeja o desde la ficha.
   Todas confirman antes: enviar bloquea el expediente, y radicar o
   confirmar en SNIES solo dejan constancia de un trámite externo.
   ------------------------------------------------------------ */

var ACCIONES_UI = {
  abrir:          function (documento) { abrirFicha(documento); },
  enviar:         function (documento, boton) { enviarDesdeLista(documento, boton); },
  radicar:        function (documento, boton) { radicarAnteMen(documento, boton); },
  subsanar:       function (documento) { abrirDialogoSubsanacion(documento); },
  confirmarSnies: function (documento, boton) { confirmarEnSnies(documento, boton); }
};

function despacharAccion(evento) {
  var boton = evento.target.closest('[data-accion]');
  if (!boton || boton.disabled) return;
  var accion = ACCIONES_UI[boton.getAttribute('data-accion')];
  if (accion) accion(boton.getAttribute('data-documento'), boton);
}

/** Tras una acción lanzada desde la ficha, se vuelve a la bandeja. */
function terminarAccion(documento, mensaje) {
  if (FICHA && FICHA.documento === documento) volverAlListado(true);
  else pintarBandeja();
  mostrarAviso($('avisoGeneral'), 'exito', mensaje, true);
  refrescarEnSilencio();
}

function enviarDesdeLista(documento, boton) {
  if (!esTalentoHumano()) return;
  var d = docenteDe(documento);
  var nombre = (d && d.nombreCompleto) || documento;

  confirmar({
    titulo: 'Enviar al revisor',
    cuerpo: nombre + ' pasará al revisor y quedará bloqueado para edición. ' +
            'No podrá modificarlo hasta que lo aprueben o se lo devuelvan.',
    textoConfirmar: 'Enviar al revisor',
    textoCancelar: 'Cancelar',
    alConfirmar: function () {
      if (boton) boton.disabled = true;
      mostrarCapa('Enviando al revisor...');
      servidor('enviarARevision', {
        documento: documento,
        version: versionActual(documento)
      }, function (respuesta) {
        ocultarCapa();
        fusionarDocente(respuesta.documento, {
          estadoRevision: respuesta.estadoRevision,
          version: respuesta.version
        });
        terminarAccion(documento, '✓ ' + nombre + ' fue enviado al revisor. La radicación ' +
          'ante el MEN la hará el revisor: usted ya terminó con este docente.');
      }, function (mensaje) {
        ocultarCapa();
        if (boton) boton.disabled = false;
        mostrarAviso($('avisoGeneral'), 'error', 'No fue posible enviarlo: ' + mensaje);
      });
    }
  });
}

function radicarAnteMen(documento, boton) {
  if (!esRevisor()) return;
  var d = docenteDe(documento);
  var nombre = (d && d.nombreCompleto) || documento;

  confirmar({
    titulo: 'Marcar como radicado',
    cuerpo: 'Confirme que ya cargó la plantilla corregida de ' + nombre + ' en la ' +
            'plataforma del Ministerio. Esta marca no radica nada por sí sola: deja ' +
            'constancia de que el trámite externo ya se hizo.',
    textoConfirmar: 'Sí, ya lo radiqué',
    textoCancelar: 'Todavía no',
    alConfirmar: function () {
      if (boton) boton.disabled = true;
      mostrarCapa('Registrando la radicación...');
      servidor('confirmarRadicadoMen', {
        documento: documento,
        version: versionActual(documento)
      }, function (respuesta) {
        ocultarCapa();
        fusionarDocente(respuesta.documento, {
          version: respuesta.version,
          estadoMen: respuesta.estadoMen || MEN_RADICADO,
          radicadoMen: true,
          radicadoPor: respuesta.radicadoPor,
          fechaRadicacionMen: respuesta.fechaRadicacionMen
        });
        terminarAccion(documento, '✓ ' + nombre + ' quedó radicado. Falta confirmarlo en SNIES ' +
          'cuando el dato aparezca corregido.');
      }, function (mensaje) {
        ocultarCapa();
        if (boton) boton.disabled = false;
        mostrarAviso($('avisoGeneral'), 'error', 'No fue posible registrar la radicación: ' + mensaje);
      });
    }
  });
}

function confirmarEnSnies(documento, boton) {
  if (!esRevisor()) return;
  var d = docenteDe(documento);
  var nombre = (d && d.nombreCompleto) || documento;

  confirmar({
    titulo: 'Confirmar en SNIES',
    cuerpo: 'Confirme que ya verificó en SNIES que la corrección de ' + nombre +
            ' aparece reflejada. Es el último paso: el trámite queda cerrado.',
    textoConfirmar: 'Sí, ya aparece en SNIES',
    textoCancelar: 'Todavía no',
    alConfirmar: function () {
      if (boton) boton.disabled = true;
      mostrarCapa('Registrando la confirmación...');
      servidor('confirmarSincronizacionSnies', {
        documento: documento,
        version: versionActual(documento)
      }, function (respuesta) {
        ocultarCapa();
        fusionarDocente(respuesta.documento, {
          version: respuesta.version,
          estadoMen: respuesta.estadoMen || MEN_SINCRONIZADO,
          sincronizadoSnies: true,
          fechaSincronizacion: respuesta.fechaSincronizacion
        });
        terminarAccion(documento, '✓ ' + nombre + ' confirmado en SNIES. Trámite cerrado.');
      }, function (mensaje) {
        ocultarCapa();
        if (boton) boton.disabled = false;
        mostrarAviso($('avisoGeneral'), 'error', 'No fue posible registrar la confirmación: ' + mensaje);
      });

function abrirDialogoSubsanacion(documento) {
  if (!esRevisor()) return;
  var docente = APP.docentes.filter(function (d) { return d.documento === documento; })[0];
  if (!docente) return;
  DOCUMENTO_SUBSANACION = documento;

  var vencida = estadoMenDe(docente) === MEN_LISTO;
  $('tituloSubsanacion').textContent = vencida
    ? 'Volver a subsanación'
    : 'Poner en subsanación';
  $('docenteSubsanacion').textContent = docente.nombreCompleto + ' · ' + documento +
    (vencida
      ? ' — ya estaba listo para radicar; indique la nueva fecha y el motivo.'
      : '');

  // Si vuelve a aplazarse, el motivo anterior se ofrece como punto de
  // partida: casi siempre es una continuación del mismo asunto.
  $('motivoSubsanacion').value = vencida ? (docente.motivoSubsanacion || '') : '';
  $('fechaDisponibleSubsanacion').value = mananaIso();
  $('fechaDisponibleSubsanacion').min = mananaIso();
  ocultarAviso($('errorSubsanacion'));
  $('dialogoSubsanacion').showModal();
  $('motivoSubsanacion').focus();
}

function cerrarDialogoSubsanacion() {
  DOCUMENTO_SUBSANACION = '';
  if ($('dialogoSubsanacion').open) $('dialogoSubsanacion').close();
}

function confirmarSubsanacion(evento) {
  evento.preventDefault();
  var documento = DOCUMENTO_SUBSANACION;
  var motivo = $('motivoSubsanacion').value.trim();
  var fecha = $('fechaDisponibleSubsanacion').value;
  var docente = docenteDe(documento);
  if (!documento || !docente) return;
  if (!motivo || !fecha) {
    mostrarAviso($('errorSubsanacion'), 'error', 'Indique el motivo y la fecha disponible.');
    return;
  }
  mostrarCapa('Registrando subsanación...');
  servidor('ponerEnSubsanacion', {
    documento: documento,
    version: versionActual(documento),
    motivo: motivo,
    fechaDisponible: fecha
  }, function (respuesta) {
    ocultarCapa();
    cerrarDialogoSubsanacion();
    fusionarDocente(documento, {
      version: respuesta.version,
      estadoMen: respuesta.estadoMen,
      motivoSubsanacion: respuesta.motivoSubsanacion,
      fechaSubsanacion: respuesta.fechaSubsanacion,
      fechaDisponibleRadicacion: respuesta.fechaDisponibleRadicacion,
      subsanacionPor: respuesta.subsanacionPor
    });
    terminarAccion(documento, '✓ ' + docente.nombreCompleto + ' quedó en subsanación hasta el ' +
      respuesta.fechaDisponibleRadicacion + '. Ese día pasa solo a «Listo para radicar».');
  }, function (mensaje) {
    ocultarCapa();
    mostrarAviso($('errorSubsanacion'), 'error', mensaje);
  });
}

/* ------------------------------------------------------------
   FICHA: APERTURA Y SALIDA
   ------------------------------------------------------------ */

function abrirFicha(documento) {
  var enLista = docenteDe(documento);
  var textoCarga = enLista && enLista.nombreCompleto
    ? 'Abriendo la ficha de ' + enLista.nombreCompleto + '...'
    : 'Abriendo ficha del docente...';

  mostrarVista('ficha');

  $('fichaCargando').querySelector('p').textContent = textoCarga;
  $('fichaCargando').hidden = false;
  $('fichaContenido').hidden = true;
  ocultarAviso($('fichaError'));
  ocultarAviso($('avisoGuardado'));
  anunciar(textoCarga);

  servidor('obtenerValidacion', documento, function (datos) {
    $('fichaCargando').hidden = true;

    if (!datos || !datos.docente) {
      mostrarAviso($('fichaError'), 'error',
        'El servidor no devolvió la información del docente. Vuelva a la bandeja e intente de nuevo.');
      return;
    }

    // Talento Humano abre directamente en edición lo que es suyo: un
    // borrador, un devuelto o un docente sin cargar. Ya no hay que pulsar
    // "Editar" para empezar a trabajar.
    var guardado = datos.existe ? datos.validacion : null;
    var estadoRevision = guardado ? guardado.estadoRevision : REV_POR_ENVIAR;
    var editable = esTalentoHumano() &&
      (estadoRevision === REV_POR_ENVIAR || estadoRevision === REV_DEVUELTO);

    FICHA = {
      documento: datos.docente.documento,
      docente: datos.docente,
      guardado: guardado,
      modo: editable ? (guardado ? 'edicion' : 'nueva') : 'consulta',
      archivos: { acta: null, diploma: null },
      quitarDiploma: false,
      guardando: false
    };

    $('fichaContenido').hidden = false;
    pintarFicha();
    anunciar('Ficha de ' + FICHA.docente.nombreCompleto + ' cargada.');
  }, function (mensaje) {
    // Pase lo que pase, la ficha no se queda en "Abriendo...".
    $('fichaCargando').hidden = true;
    $('fichaContenido').hidden = true;
    mostrarAviso($('fichaError'), 'error', 'No fue posible abrir la ficha: ' + mensaje);
  });
}

/**
 * Vuelve a la bandeja. Con `forzar` en true no pregunta nada: lo usan
 * los callbacks de exito, donde el trabajo ya esta a salvo en el servidor.
 */
function volverAlListado(forzar) {
  var salir = function () {
    FICHA = null;
    mostrarVista('lista');
    pintarBandeja();
  };
  if (forzar === true) salir();
  else protegerCambios(salir);
}

/* ------------------------------------------------------------
   PROTECCION DEL TRABAJO SIN GUARDAR

   Talento Humano: diez criterios y quizá un PDF ya elegido. Revisor:
   diez decisiones y una observación. Antes el revisor lo perdía todo en
   silencio al volver, porque su ficha está en modo 'consulta'.
   ------------------------------------------------------------ */

/** true si la ficha abierta tiene algo que el servidor todavia no sabe. */
function hayCambiosPendientes() {
  if (!FICHA) return false;
  if (hayDecisionEnCurso()) return true;
  if (FICHA.modo === 'consulta') return false;
  if (FICHA.archivos && (FICHA.archivos.acta || FICHA.archivos.diploma)) return true;
  if (FICHA.quitarDiploma) return true;

  // Sin formulario en pantalla no hay nada que comparar.
  if (!$('listaCriterios').querySelector('.criterio')) return false;

  var actual = recolectar();
  var guardado = FICHA.guardado;

  if (!guardado) {
    // Ficha nueva: basta con que haya tocado un criterio o las observaciones.
    if (actual.observaciones) return true;
    return Object.keys(actual.criterios).some(function (clave) {
      return actual.criterios[clave].valor || actual.criterios[clave].correccion;
    });
  }

  if ((actual.observaciones || '') !== (guardado.observaciones || '')) return true;

  return Object.keys(actual.criterios).some(function (clave) {
    var previo = (guardado.criterios && guardado.criterios[clave]) || {};
    return actual.criterios[clave].valor !== (previo.valor || '') ||
           actual.criterios[clave].correccion !== (previo.correccion || '');
  });
}

/** true si el revisor empezó a decidir y todavía no lo registró. */
function hayDecisionEnCurso() {
  if (!FICHA || !FICHA.guardado || !esRevisor() || FICHA.guardando) return false;
  if (FICHA.guardado.estadoRevision !== REV_EN_REVISION) return false;

  var guardadas = FICHA.guardado.revisionCriterios || {};
  var distinta = Array.prototype.some.call(
    $('criteriosRevisor').querySelectorAll('.criterio-revisor'), function (fila) {
      var elegido = fila.querySelector('input[type="radio"]:checked');
      return (elegido ? elegido.value : '') !== (guardadas[fila.getAttribute('data-clave')] || '');
    });
  return distinta ||
    $('observacionRevisor').value.trim() !== String(FICHA.guardado.observacionRevision || '').trim();
}

/**
 * Ejecuta `accion`, pero si hay trabajo sin guardar pregunta primero.
 * `alCancelar` permite deshacer el gesto que disparo la salida (por
 * ejemplo devolver el selector de rol a su valor anterior).
 */
function protegerCambios(accion, alCancelar) {
  if (!hayCambiosPendientes()) {
    accion();
    return;
  }

  var nombre = FICHA && FICHA.docente ? FICHA.docente.nombreCompleto : 'este docente';
  confirmar({
    titulo: 'Hay cambios sin guardar',
    cuerpo: 'La ficha de ' + nombre + ' tiene cambios que todavía no se han ' +
            'guardado. Si sale ahora se perderán.',
    textoConfirmar: 'Descartar y salir',
    textoCancelar: 'Seguir editando',
    peligro: true,
    alConfirmar: accion,
    alCancelar: alCancelar
  });
}

/** "Descartar cambios": vuelve a lo guardado y sigue en edición. */
function cancelarEdicion() {
  if (!FICHA || !FICHA.guardado) return;
  var descartar = function () {
    FICHA.archivos = { acta: null, diploma: null };
    FICHA.quitarDiploma = false;
    pintarFicha();
    anunciar('Cambios descartados. Se restauró lo guardado.');
  };
  if (!hayCambiosPendientes()) { descartar(); return; }
  confirmar({
    titulo: 'Descartar cambios',
    cuerpo: 'Se perderán los cambios que no ha guardado y la ficha volverá a lo último guardado.',
    textoConfirmar: 'Descartar cambios',
    textoCancelar: 'Seguir editando',
    peligro: true,
    alConfirmar: descartar
  });
}

/* ------------------------------------------------------------
   FICHA: DIBUJO
   ------------------------------------------------------------ */

/** La ficha como expediente, para pasarla por situacion(). */
function expedienteDeFicha() {
  if (!FICHA || !FICHA.guardado) return { tieneValidacion: false };
  var e = { tieneValidacion: true };
  Object.keys(FICHA.guardado).forEach(function (k) { e[k] = FICHA.guardado[k]; });
  return e;
}

function pintarFicha() {
  if (!FICHA) return;

  var rol = APP.perfil.rol;
  var sit = situacion(expedienteDeFicha(), rol);
  var editable = esTalentoHumano() &&
    (FICHA.modo === 'nueva' || FICHA.modo === 'edicion') && puedeEditarValidacion();

  /* --- 1. Cabecera: una sola insignia --- */
  $('fichaNombre').textContent = FICHA.docente.nombreCompleto || '(sin nombre)';
  $('fichaDocumento').textContent =
    (FICHA.docente.tipoDocumento || 'CC') + ' ' + FICHA.docente.documento;
  var insignia = $('fichaInsignia');
  insignia.className = 'insignia insignia-fase fase-' + sit.fase.toLowerCase();
  vaciar(insignia);
  insignia.appendChild(crear('span', 'muestra-fase'));
  insignia.appendChild(document.createTextNode(sit.etiqueta));

  /* --- 2. Qué pasa / qué hacer --- */
  pintarSituacionFicha(sit);

  /* --- 3a. Zona de Talento Humano --- */
  var zonaTH = esTalentoHumano();
  $('camposRevision').hidden = !zonaTH;
  if (zonaTH) {
    pintarCriterios();
    pintarSoportes();
    $('observaciones').value = FICHA.guardado ? (FICHA.guardado.observaciones || '') : '';
    $('camposRevision').disabled = !editable;
  } else {
    vaciar($('listaCriterios'));
    pintarCarpetaDocente();
  }

  /* --- 3b. Zona del revisor y visor --- */
  pintarPrevisualizacion();
  pintarTablaDecision();

  /* --- 4. Barra de acciones de Talento Humano --- */
  $('navegacionFicha').hidden = !editable;
  $('btnCancelarEdicion').hidden = !(editable && FICHA.guardado);
  $('btnGuardar').disabled = false;
  $('btnGuardarEnviar').disabled = false;

  /* --- 5. Historial --- */
  pintarHistorialExpediente(sit);

  ocultarAviso($('avisoGuardado'));
}

/** Texto del bloque "qué pasa / qué hacer" para un estado y un rol. */
function textoSituacion(sit, v, rol) {
  var th = rol === ROL_TALENTO_HUMANO;
  var rev = rol === ROL_REVISOR;
  var t = { parrafo: '', cita: '', citaPie: '', lista: [] };

  switch (sit.clave) {
    case 'SIN_CARGAR':
      t.parrafo = th
        ? 'Compare cada dato reportado a SNIES con el acta o el diploma, cargue el acta ' +
          'de grado y envíelo al revisor.'
        : 'Talento Humano todavía no ha registrado la validación de este docente.';
      break;
    case 'BORRADOR':
      t.parrafo = th
        ? 'Está guardado, pero el revisor no lo ve hasta que pulse «Enviar al revisor».'
        : 'Talento Humano lo tiene en borrador; aún no lo ha enviado.';
      break;
    case 'DEVUELTO':
      t.parrafo = th
        ? 'El revisor lo devolvió. Corrija abajo los campos señalados y pulse «Enviar al revisor».'
        : 'Devuelto a Talento Humano para corregir.';
      t.cita = v.observacionRevision || '';
      t.citaPie = v.revisadoPor
        ? 'Observación de ' + v.revisadoPor + (v.fechaRevision ? ' el ' + v.fechaRevision : '') : '';
      if (v.revisionCriterios) {
        APP.criterios.forEach(function (c) {
          if (v.revisionCriterios[c.clave] === REV_NO_CONFORME) t.lista.push(c.etiqueta);
        });
      }
      break;
    case 'EN_REVISION':
      t.parrafo = rev
        ? 'Compare cada campo con el soporte y decida en la tabla de abajo.'
        : 'Enviado' + (v.fechaEnvio ? ' el ' + v.fechaEnvio : '') + '. No requiere nada de ' +
          'usted hasta que el revisor lo apruebe o lo devuelva.';
      break;
    case 'POR_RADICAR':
      t.parrafo = rev
        ? 'Tiene datos a corregir en SNIES. Cargue la plantilla corregida en la plataforma del ' +
          'Ministerio y márquelo como radicado. Si todavía no puede, póngalo en subsanación ' +
          'con la fecha en que sí podrá.'
        : 'Aprobado con datos a corregir. La radicación ante el MEN la hace el revisor, ' +
          'fuera de esta aplicación.';
      break;
    case 'EN_SUBSANACION':
      t.parrafo = 'Pasa solo a «Listo para radicar» el ' + (sit.fechaLimite || 'día indicado') +
        '. Hasta entonces no se puede radicar ni hay que hacer nada.';
      t.cita = v.motivoSubsanacion || '';
      t.citaPie = v.subsanacionPor
        ? 'Motivo registrado por ' + v.subsanacionPor +
          (v.fechaSubsanacion ? ' el ' + v.fechaSubsanacion : '') : '';
      break;
    case 'LISTO_RADICAR':
      t.parrafo = rev
        ? 'La fecha de subsanación ya llegó. Radíquelo en la plataforma del MEN y márquelo ' +
          'aquí, o vuelva a ponerlo en subsanación con una fecha nueva.'
        : 'Listo para que el revisor lo radique ante el MEN.';
      t.cita = v.motivoSubsanacion || '';
      t.citaPie = v.motivoSubsanacion ? 'Motivo de la subsanación que acaba de vencer' : '';
      break;
    case 'RADICADO':
      t.parrafo = rev
        ? 'Se cargó al MEN' + (v.fechaRadicacionMen ? ' el ' + v.fechaRadicacionMen : '') +
          '. Cuando compruebe en SNIES que el dato ya aparece corregido, confírmelo aquí.'
        : 'Cargado al MEN; falta que el revisor lo confirme en SNIES.';
      break;
    case 'CONFIRMADO':
      t.parrafo = 'La corrección ya aparece en SNIES' +
        (v.sincronizadoPor ? '; lo verificó ' + v.sincronizadoPor : '') +
        (v.fechaSincronizacion ? ' el ' + v.fechaSincronizacion : '') + '. Trámite cerrado.';
      break;
    case 'SIN_NOVEDAD':
      t.parrafo = 'Sus diez datos coinciden con SNIES: no había nada que corregir, así que ' +
        'se cerró al aprobarlo, sin trámite ante el MEN.';
      break;
  }
  return t;
}

function pintarSituacionFicha(sit) {
  var panel = $('panelSituacion');
  vaciar(panel);

  var rol = APP.perfil.rol;
  var leToca = sit.leTocaA(rol);
  var v = FICHA.guardado || {};
  var t = textoSituacion(sit, v, rol);

  panel.className = 'panel-situacion fase-' + sit.fase.toLowerCase() + (leToca ? ' le-toca' : '');

  var quien = leToca ? 'le toca a usted'
    : sit.fase === 'CERRADO' ? 'trámite cerrado'
      : sit.actor === 'NADIE' ? 'en espera'
        : sit.actor === 'REVISOR' ? 'en manos del revisor' : 'en manos de Talento Humano';

  var titulo = crear('h3', null, sit.etiqueta + ' · ' + quien);
  titulo.id = 'situacionTitulo';
  panel.appendChild(titulo);
  if (t.parrafo) panel.appendChild(crear('p', null, t.parrafo));

  if (t.cita) {
    var cita = crear('blockquote', 'situacion-cita');
    cita.appendChild(crear('p', null, t.cita));
    if (t.citaPie) cita.appendChild(crear('footer', null, t.citaPie));
    panel.appendChild(cita);
  }

  if (t.lista.length) {
    panel.appendChild(crear('p', 'situacion-lista-titulo', 'Campos señalados por el revisor:'));
    var ul = crear('ul', 'situacion-lista');
    t.lista.forEach(function (item) { ul.appendChild(crear('li', null, item)); });
    panel.appendChild(ul);
  }

  // Las acciones de un clic del revisor también están aquí.
  var d = { documento: FICHA.documento, nombreCompleto: FICHA.docente.nombreCompleto };
  if (esRevisor() && sit.accionPrincipal && sit.accionPrincipal.accion !== 'abrir') {
    var barra = crear('div', 'situacion-acciones');
    if (sit.accionSecundaria) barra.appendChild(botonAccion(sit.accionSecundaria, d, 'btn-secundario btn-compacto'));
    barra.appendChild(botonAccion(sit.accionPrincipal, d, 'btn-primario btn-compacto'));
    panel.appendChild(barra);
  }
}

/** Historial plegado: los seis pasos del trámite, con quién y cuándo. */
function pintarHistorialExpediente(sit) {
  var lista = $('historialPasos');
  vaciar(lista);
  var v = FICHA.guardado || {};
  var decision = v.decisionRevision || v.estadoRevision;
  var aprobado = v.estadoRevision === REV_APROBADO;

  var pasos = [
    { titulo: 'Validación registrada', quien: v.guardadoPor,
      cuando: v.fechaValidacion || v.fechaModificacion },
    { titulo: 'Enviado al revisor', quien: v.enviadoPor, cuando: v.fechaEnvio },
    { titulo: decision === REV_DEVUELTO ? 'Devuelto a Talento Humano'
        : (aprobado ? 'Aprobado' : 'Decisión del revisor'),
      quien: v.revisadoPor, cuando: v.fechaRevision }
  ];

  if (v.fechaSubsanacion) {
    pasos.push({ titulo: 'Puesto en subsanación hasta el ' + (v.fechaDisponibleRadicacion || '—'),
      quien: v.subsanacionPor, cuando: v.fechaSubsanacion });
  }

  if (sit.clave === 'SIN_NOVEDAD') {
    pasos.push({ titulo: 'Cerrado sin novedad: sin trámite ante el MEN',
      quien: v.revisadoPor, cuando: v.fechaRevision });
  } else {
    pasos.push({ titulo: 'Radicado ante el MEN', quien: v.radicadoPor, cuando: v.fechaRadicacionMen });
    pasos.push({ titulo: 'Confirmado en SNIES', quien: v.sincronizadoPor, cuando: v.fechaSincronizacion });
  }

  pasos.forEach(function (p, i) {
    var hecho = !!p.cuando;
    var li = crear('li', 'historial-paso ' + (hecho ? 'completo' : 'sin-registrar'));
    li.appendChild(crear('span', 'historial-numero', hecho ? '✓' : String(i + 1)));
    var cuerpo = crear('div');
    cuerpo.appendChild(crear('p', 'historial-titulo', p.titulo));
    cuerpo.appendChild(crear('p', 'historial-detalle', hecho
      ? (p.quien ? p.quien + ' · ' : '') + p.cuando
      : 'Sin registrar'));
    li.appendChild(cuerpo);
    lista.appendChild(li);
  });
}

function pintarCriterios() {
  var contenedor = $('listaCriterios');
  vaciar(contenedor);

  APP.criterios.forEach(function (criterio) {
    var guardado = FICHA.guardado && FICHA.guardado.criterios
      ? FICHA.guardado.criterios[criterio.clave]
      : null;

    var reportado = FICHA.docente.valores ? FICHA.docente.valores[criterio.clave] : '';

    var fila = crear('div', 'criterio');
    fila.setAttribute('data-clave', criterio.clave);

    /* Columna izquierda: que se compara y con que valor */
    var texto = crear('div');
    texto.appendChild(crear('p', 'criterio-etiqueta', criterio.etiqueta));
    texto.appendChild(reportado
      ? crear('p', 'criterio-valor', reportado)
      : crear('p', 'criterio-valor vacio', '(sin dato reportado)'));
    fila.appendChild(texto);

    /* Columna derecha: el par de botones */
    var opciones = crear('div', 'opciones-criterio');
    opciones.appendChild(botonCriterio(criterio.clave, COINCIDE, '✓', 'Coincide',
      guardado && guardado.valor === COINCIDE));
    opciones.appendChild(botonCriterio(criterio.clave, NO_COINCIDE, '✕', 'No coincide',
      guardado && guardado.valor === NO_COINCIDE));
    fila.appendChild(opciones);

    /* Campo de correccion, visible solo cuando algo no coincide */
    var correccion = crear('div', 'correccion');

    var comparacion = crear('p', 'comparacion');
    comparacion.appendChild(document.createTextNode('SNIES reporta: '));
    var reportadoNodo = crear('strong', null, reportado || '(sin dato)');
    comparacion.appendChild(reportadoNodo);
    correccion.appendChild(comparacion);

    var etiqueta = crear('label');
    etiqueta.setAttribute('for', 'corr_' + criterio.clave);
    etiqueta.appendChild(document.createTextNode('Valor correcto según el soporte '));
    etiqueta.appendChild(crear('span', 'obligatorio', '*'));
    correccion.appendChild(etiqueta);

    var opcionesCorreccion = criterio.opcionesCorreccion || [];
    var campo;

    if (opcionesCorreccion.length) {
      campo = document.createElement('select');

      var opcionVacia = document.createElement('option');
      opcionVacia.value = '';
      opcionVacia.textContent = 'Seleccione una opción';
      campo.appendChild(opcionVacia);

      opcionesCorreccion.forEach(function (valor) {
        var opcion = document.createElement('option');
        opcion.value = valor;
        opcion.textContent = valor;
        campo.appendChild(opcion);
      });
    } else {
      campo = document.createElement('input');
      campo.type = criterio.tipoCorreccion === 'fecha' ? 'date' : 'text';

      if (campo.type === 'text') {
        campo.maxLength = 500;
        campo.autocomplete = 'off';
        campo.placeholder = 'Escriba el valor que figura en el documento soporte';
      }
    }

    campo.className = 'campo-correccion';
    if (criterio.normalizarCorreccion === 'mayusculas') {
      campo.classList.add('campo-mayusculas');
    }
    campo.id = 'corr_' + criterio.clave;
    var valorGuardado = guardado ? (guardado.correccion || '') : '';
    if (criterio.normalizarCorreccion === 'mayusculas') {
      valorGuardado = valorGuardado.toUpperCase();
    }
    campo.value = criterio.tipoCorreccion === 'fecha'
      ? fechaParaControl(valorGuardado)
      : valorGuardado;
    correccion.appendChild(campo);

    correccion.appendChild(crear('p', 'mensaje-error',
      opcionesCorreccion.length
        ? 'Seleccione el valor correcto según el soporte.'
        : criterio.tipoCorreccion === 'fecha'
          ? 'Seleccione la fecha correcta según el soporte.'
          : 'Escriba el valor correcto según el soporte.'));

    if (guardado && guardado.valor === NO_COINCIDE) correccion.classList.add('visible');
    fila.appendChild(correccion);

    contenedor.appendChild(fila);
    refrescarCriterio(fila);
  });
}

function botonCriterio(clave, valor, simbolo, texto, marcado) {

  radio.type = 'radio';
  radio.name = 'crit_' + clave;
  radio.value = valor;
  radio.checked = !!marcado;
  etiqueta.appendChild(radio);

  etiqueta.appendChild(crear('span', 'marca', simbolo));

/** Sincroniza el aspecto de un criterio con el radio que este marcado. */
function refrescarCriterio(fila) {
  var elegido = fila.querySelector('input[type="radio"]:checked');
  var valor = elegido ? elegido.value : '';

  Array.prototype.forEach.call(fila.querySelectorAll('.opcion-criterio'), function (etiqueta) {
    var radio = etiqueta.querySelector('input[type="radio"]');
    var activa = radio.checked;
    etiqueta.classList.toggle('marcada-si', activa && radio.value === COINCIDE);
    etiqueta.classList.toggle('marcada-no', activa && radio.value === NO_COINCIDE);
  });

  var correccion = fila.querySelector('.correccion');
  correccion.classList.toggle('visible', valor === NO_COINCIDE);

  if (valor !== NO_COINCIDE) {
    correccion.classList.remove('con-error');
    correccion.querySelector('.campo-correccion').value = '';
  }

  if (valor) fila.classList.remove('sin-responder');
}
