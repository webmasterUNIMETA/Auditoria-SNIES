<script>
/* ============================================================
   Scripts.html
   Validacion documental de docentes - Auditoria SNIES - UNIMETA

   La pagina tiene dos vistas: el listado y la ficha del docente.
   Nunca se usa alert(), confirm() ni prompt(): todos los mensajes
   se dibujan dentro de la interfaz.

   Todo el texto que proviene de las hojas se inserta con
   textContent, nunca con innerHTML, de modo que un nombre o un
   titulo con caracteres de HTML no puede inyectar marcado.
   ============================================================ */

'use strict';

/* ------------------------------------------------------------
   ESTADO
   ------------------------------------------------------------ */

var COINCIDE    = 'COINCIDE';
var NO_COINCIDE = 'NO_COINCIDE';

var ESTADO_PENDIENTE  = 'PENDIENTE';
var ESTADO_VALIDADO   = 'VALIDADO';
var ESTADO_CORRECCION = 'REQUIERE_CORRECCION';

var ROL_TALENTO_HUMANO = 'TALENTO_HUMANO';
var ROL_REVISOR = 'REVISOR';
var ROL_CONSULTA = 'CONSULTA';

var REV_POR_ENVIAR = 'POR_ENVIAR';
var REV_EN_REVISION = 'EN_REVISION';
var REV_DEVUELTO = 'DEVUELTO';
var REV_APROBADO = 'APROBADO';
var REV_CONFORME = 'CONFORME';
var REV_NO_CONFORME = 'NO_CONFORME';

var NOMBRES_ESTADO = {
  PENDIENTE: 'Pendiente',
  VALIDADO: 'Validado',
  REQUIERE_CORRECCION: 'Requiere corrección'
};

var NOMBRES_REVISION = {
  POR_ENVIAR: 'Por enviar',
  EN_REVISION: 'En revisión',
  DEVUELTO: 'Devuelto',
  APROBADO: 'Aprobado'
};

var NOMBRES_ROL = {
  TALENTO_HUMANO: 'Talento Humano',
  REVISOR: 'Revisor',
  CONSULTA: 'Solo consulta'
};

/** Como se nombra cada grupo al contarlo: "Mostrando 12 pendientes". */
var NOMBRES_GRUPO = {
  POR_ENVIAR: 'por enviar',
  EN_REVISION: 'en revisión',
  DEVUELTO: 'devueltos',
  APROBADO: 'aprobados'
};

/** Estado por el que se filtra el listado. 'TODOS' no filtra nada. */
var FILTRO = 'TODOS';

var MAX_BYTES_PDF = 10 * 1024 * 1024;

var SIN_CONEXION = 'No fue posible comunicarse con el servidor. ' +
  'Verifique su conexión e intente de nuevo.';

/** Datos de la auditoria, tal como los entrega obtenerDocentes(). */
var APP = {
  auditoria: '',
  criterios: [],
  perfil: { correo: '', nombre: '', rol: '' },
  requisitos: { actaObligatoria: true, diplomaObligatorio: false },
  docentes: [],
  resumen: { total: 0, porEnviar: 0, enRevision: 0, devueltos: 0, aprobados: 0 }
};

/**
 * Ficha abierta en este momento.
 *
 *   modo 'nueva'    -> el docente aun no ha sido revisado
 *   modo 'consulta' -> revision guardada, campos bloqueados
 *   modo 'edicion'  -> revision guardada que se esta modificando
 *
 * guardado conserva SIEMPRE la ultima version confirmada por el
 * servidor: es lo que permite que "Cancelar edición" restaure los
 * valores exactos sin volver a consultar.
 */
var FICHA = null;

/* ------------------------------------------------------------
   UTILIDADES
   ------------------------------------------------------------ */

function $(id) { return document.getElementById(id); }

function crear(etiqueta, clase, texto) {
  var nodo = document.createElement(etiqueta);
  if (clase) nodo.className = clase;
  if (texto !== undefined && texto !== null) nodo.textContent = texto;
  return nodo;
}

function vaciar(nodo) {
  while (nodo.firstChild) nodo.removeChild(nodo.firstChild);
}

/** Quita tildes y pasa a minusculas, para comparar en el buscador. */
function plano(texto) {
  return String(texto == null ? '' : texto)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase();
}

/** Convierte dd/mm/aaaa al valor aaaa-mm-dd que exige input[type=date]. */
function fechaParaControl(valor) {
  var texto = String(valor || '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) return texto;

  var partes = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(texto);
  return partes ? partes[3] + '-' + partes[2] + '-' + partes[1] : '';
}

function anunciar(texto) { $('anuncio').textContent = texto; }

function mostrarAviso(nodo, tipo, texto) {
  nodo.className = 'aviso aviso-' + tipo;
  nodo.textContent = texto;
  nodo.hidden = false;
}

function ocultarAviso(nodo) {
  nodo.hidden = true;
  nodo.textContent = '';
}

function mostrarCapa(texto) {
  $('textoCarga').textContent = texto;
  $('capaCarga').classList.add('visible');
  $('capaCarga').setAttribute('aria-hidden', 'false');
  anunciar(texto);
}

function ocultarCapa() {
  $('capaCarga').classList.remove('visible');
  $('capaCarga').setAttribute('aria-hidden', 'true');
}

function esTalentoHumano() { return APP.perfil.rol === ROL_TALENTO_HUMANO; }
function esRevisor() { return APP.perfil.rol === ROL_REVISOR; }
function esConsulta() { return APP.perfil.rol === ROL_CONSULTA; }

function puedeEditarValidacion() {
  if (!FICHA || !esTalentoHumano()) return false;
  var estado = FICHA.guardado ? FICHA.guardado.estadoRevision : REV_POR_ENVIAR;
  return estado === REV_POR_ENVIAR || estado === REV_DEVUELTO;
}

/* ------------------------------------------------------------
   IDENTIDAD

   La pagina esta publicada en un sitio estatico, asi que quien
   autoriza no es el servidor de la pagina sino Google: al iniciar
   sesion entrega un token firmado que viaja en cada peticion y que
   Apps Script verifica. Sin token no se responde nada.

   El token NO se guarda en localStorage a proposito. Vive solo en
   memoria: cerrar la pestana cierra la sesion de la aplicacion.
   ------------------------------------------------------------ */

var SESION = { token: null, correo: '' };
var INTENTOS_CARGA_GOOGLE = 50;
var ESPERA_CARGA_GOOGLE_MS = 200;

/**
 * Arranca el botón de Google y queda a la espera.
 *
 * La biblioteca de Google se descarga desde otro dominio. En conexiones
 * lentas puede terminar después de DOMContentLoaded, por lo que se espera
 * hasta diez segundos antes de mostrar un error real de carga.
 */
function iniciarPuerta(intento) {
  intento = intento || 0;

  if (!window.ID_CLIENTE_OAUTH) {
    mostrarAviso($('puertaError'), 'error',
      'La aplicación no está configurada: falta el identificador de cliente de Google. ' +
      'Avise al administrador.');
    return;
  }

  if (!window.google || !google.accounts || !google.accounts.id) {
    if (intento < INTENTOS_CARGA_GOOGLE) {
      setTimeout(function () {
        iniciarPuerta(intento + 1);
      }, ESPERA_CARGA_GOOGLE_MS);
      return;
    }

    mostrarAviso($('puertaError'), 'error',
      'No fue posible cargar el inicio de sesión de Google. ' +
      'Revise su conexión y actualice la página.');
    return;
  }

  google.accounts.id.initialize({
    client_id: window.ID_CLIENTE_OAUTH,
    callback: recibirCredencial,
    auto_select: true,
    cancel_on_tap_outside: false
  });

  google.accounts.id.renderButton($('botonGoogle'), {
    theme: 'outline',
    size: 'large',
    text: 'signin_with',
    shape: 'rectangular',
    locale: 'es',
    width: 280
  });

  // Si la persona ya tiene sesión de Google, entra sin pulsar nada.
  google.accounts.id.prompt();
}

/** Google entrega aquí el token de identidad. */
function recibirCredencial(respuesta) {
  if (!respuesta || !respuesta.credential) {
    mostrarAviso($('puertaError'), 'error', 'No se recibió la credencial de Google.');
    return;
  }

  SESION.token = respuesta.credential;
  SESION.correo = correoDelToken(respuesta.credential);

  ocultarAviso($('puertaError'));
  $('puertaTexto').textContent = 'Verificando su identidad...';

  // El servidor es quien decide de verdad: esta primera llamada sirve
  // tanto para cargar los datos como para validar la sesión.
  cargarDocentes();
}

/**
 * Lee el correo del token sin verificarlo, solo para mostrarlo en el
 * encabezado. La comprobación de verdad la hace el servidor: lo que se
 * lea aquí no autoriza nada.
 */
function correoDelToken(token) {
  try {
    var carga = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(carga)))).email || '';
  } catch (e) {
    return '';
  }
}

function abrirAplicacion() {
  $('puerta').hidden = true;
  if (SESION.correo) {
    $('sesionCorreo').textContent = SESION.correo;
    $('sesionRol').textContent = NOMBRES_ROL[APP.perfil.rol] || APP.perfil.rol || '';
    $('nombreRol').textContent = NOMBRES_ROL[APP.perfil.rol] || 'Acceso autorizado';
    $('sesion').hidden = false;
  }
}

/** Devuelve a la puerta de entrada, con un motivo. */
function cerrarSesion(motivo) {
  SESION.token = null;
  SESION.correo = '';

  try {
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.disableAutoSelect();
    }
  } catch (e) { /* sin sesión de Google que cerrar */ }

  $('sesion').hidden = true;
  $('sesionRol').textContent = '';
  $('puerta').hidden = false;
  $('puertaTexto').textContent = 'Esta aplicación es de uso interno. ' +
    'Inicie sesión con su cuenta institucional para continuar.';

  if (motivo) mostrarAviso($('puertaError'), 'error', motivo);
  else ocultarAviso($('puertaError'));
}

/* ------------------------------------------------------------
   CONEXION CON EL SERVIDOR
   ------------------------------------------------------------ */

/**
 * Unica via hacia el servidor. Siempre lleva manejador de exito y de
 * fallo: ninguna operacion puede quedarse esperando para siempre.
 *
 * El cuerpo se manda como text/plain aunque sea JSON: asi el navegador
 * no hace la consulta previa de CORS (OPTIONS), que Apps Script no sabe
 * responder. Y sin cookies de Google, porque con varias cuentas abiertas
 * son ellas las que mandan la peticion a la sesion equivocada.
 */
function servidor(accion, argumento, exito, fallo) {
  // El simulador de la vista previa se anuncia así.
  if (window.SIMULADOR) {
    window.SIMULADOR(accion, argumento, exito, fallo);
    return;
  }

  if (!window.URL_SERVIDOR) {
    fallo('La aplicación no está configurada: falta la dirección del servidor.');
    return;
  }

  fetch(window.URL_SERVIDOR, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: SESION.token, accion: accion, argumento: argumento }),
    credentials: 'omit'
  })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (r) {
      if (r && r.ok) {
        try {
          exito(r.resultado);
        } catch (e) {
          console.error(e);
          fallo('Ocurrió un problema al mostrar la respuesta del servidor.');
        }
        return;
      }

      // El servidor rechazó la sesión: se vuelve a la puerta de entrada
      // en lugar de dejar a la persona ante un error que no puede resolver.
      if (r && r.sesion === 'INVALIDA') {
        cerrarSesion(r.error || 'Su sesión expiró. Vuelva a iniciar sesión.');
        return;
      }

      fallo((r && r.error) || SIN_CONEXION);
    }, function () {
      fallo(SIN_CONEXION);
    });
}

/* ------------------------------------------------------------
   ARRANQUE
   ------------------------------------------------------------ */

document.addEventListener('DOMContentLoaded', function () {
  conectarEventos();

  // En la vista previa no hay Google: se entra directo.
  if (window.SIMULADOR) {
    $('puerta').hidden = true;
    cargarDocentes();
    return;
  }

  iniciarPuerta();
});

function cargarDocentes() {
  $('listaCargando').hidden = false;
  $('listaVacia').hidden = true;
  ocultarAviso($('avisoGeneral'));
  mostrarVista('lista');

  servidor('obtenerDocentes', undefined, function (datos) {
    $('listaCargando').hidden = true;

    APP.auditoria  = datos.auditoria || '';
    APP.criterios  = datos.criterios || [];
    APP.requisitos = datos.requisitos || APP.requisitos;
    APP.perfil     = datos.perfil || APP.perfil;
    APP.docentes   = datos.docentes || [];
    APP.resumen    = datos.resumen || APP.resumen;

    if (APP.auditoria) $('nombreAuditoria').textContent = APP.auditoria;

    if (esTalentoHumano()) {
      $('tituloLista').textContent = 'Validación documental de docentes';
      $('descripcionLista').textContent =
        'Registre la comparación con los soportes y envíe cada docente al revisor. ' +
        'Los registros enviados quedan bloqueados hasta que sean aprobados o devueltos.';
    } else if (esRevisor()) {
      $('tituloLista').textContent = 'Bandeja de revisión';
      $('descripcionLista').textContent =
        'Compare los datos reportados y corregidos con el acta y el diploma. ' +
        'Revise cada criterio antes de aprobar o devolver el registro.';
    } else {
      $('tituloLista').textContent = 'Consulta del avance';
      $('descripcionLista').textContent =
        'Vista de solo lectura para consultar el avance general y el estado de los docentes. ' +
        'Esta cuenta no puede abrir fichas, modificar, enviar, aprobar ni devolver registros.';
    }

    aplicarRequisitos();
    pintarIndicadores();
    marcarFiltro();
    pintarLista();

    // El servidor respondió, luego la sesión es válida: se abre la app.
    abrirAplicacion();
    anunciar('Listado cargado con ' + APP.docentes.length + ' docentes.');
  }, function (mensaje) {
    $('listaCargando').hidden = true;

    // Si aún no se ha entrado, el error va en la puerta: el aviso de
    // dentro quedaría tapado y la persona no vería nada.
    if (!$('puerta').hidden) {
      $('puertaTexto').textContent = 'Esta aplicación es de uso interno. ' +
        'Inicie sesión con su cuenta institucional para continuar.';
      mostrarAviso($('puertaError'), 'error', mensaje);
      return;
    }

    mostrarAviso($('avisoGeneral'), 'error',
      'No fue posible cargar la lista de docentes: ' + mensaje);
  });
}

/** Marca el acta y el diploma como obligatorios u opcionales. */
function aplicarRequisitos() {
  var acta = $('marcaActa');
  if (APP.requisitos.actaObligatoria) {
    acta.className = 'obligatorio';
    acta.textContent = '*';
  } else {
    acta.className = 'opcional';
    acta.textContent = 'Opcional';
  }

  var diploma = $('marcaDiploma');
  if (APP.requisitos.diplomaObligatorio) {
    diploma.className = 'obligatorio';
    diploma.textContent = '*';
  } else {
    diploma.className = 'opcional';
    diploma.textContent = 'Opcional';
  }
}

/* ------------------------------------------------------------
   EVENTOS
   ------------------------------------------------------------ */

function conectarEventos() {
  $('btnSalir').addEventListener('click', function () {
    FICHA = null;
    mostrarVista('lista');
    cerrarSesion('');
  });

  $('buscador').addEventListener('input', pintarLista);

  $('tiraIndicadores').addEventListener('click', function (evento) {
    var boton = evento.target.closest('[data-filtro]');
    if (boton) aplicarFiltro(boton.getAttribute('data-filtro'));
  });

  // Delegacion: los botones del listado se crean y destruyen al filtrar.
  $('listaDocentes').addEventListener('click', function (evento) {
    var boton = evento.target.closest('button[data-documento]');
    if (boton) abrirFicha(boton.getAttribute('data-documento'));
  });

  $('btnVolver').addEventListener('click', volverAlListado);
  $('btnEditar').addEventListener('click', entrarEnEdicion);
  $('btnCancelarEdicion').addEventListener('click', cancelarEdicion);
  $('btnEnviarRevision').addEventListener('click', enviarRevision);
  $('btnAprobar').addEventListener('click', function () { decidirRevision(REV_APROBADO); });
  $('btnDevolver').addEventListener('click', function () { decidirRevision(REV_DEVUELTO); });
  $('tabActa').addEventListener('click', function () { mostrarDocumento('acta'); });
  $('tabDiploma').addEventListener('click', function () { mostrarDocumento('diploma'); });

  $('formRevision').addEventListener('submit', function (evento) {
    evento.preventDefault();
    guardarRevision();
  });

  $('listaCriterios').addEventListener('change', function (evento) {
    var opcion = evento.target.closest('.criterio');
    if (opcion && evento.target.type === 'radio') {
      refrescarCriterio(opcion);
      return;
    }

    var bloque = evento.target.closest('.correccion');
    if (bloque && evento.target.tagName === 'SELECT' && evento.target.value) {
      bloque.classList.remove('con-error');
    }
  });

  $('listaCriterios').addEventListener('input', function (evento) {
    if (evento.target.tagName !== 'INPUT' ||
        (evento.target.type !== 'text' && evento.target.type !== 'date')) return;
    var bloque = evento.target.closest('.correccion');
    if (bloque && evento.target.value.trim()) bloque.classList.remove('con-error');
  });

  $('archivoActa').addEventListener('change', function () {
    recibirArchivo('acta', this, 'acta de grado');
  });

  $('archivoDiploma').addEventListener('change', function () {
    recibirArchivo('diploma', this, 'diploma de grado');
  });
}

/* ------------------------------------------------------------
   VISTAS
   ------------------------------------------------------------ */

function mostrarVista(cual) {
  $('vistaLista').classList.toggle('activa', cual === 'lista');
  $('vistaFicha').classList.toggle('activa', cual === 'ficha');
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------
   INDICADORES Y LISTADO
   ------------------------------------------------------------ */

function pintarIndicadores() {
  var r = APP.resumen;
  $('cifraTotal').textContent      = r.total;
  $('cifraPorEnviar').textContent  = r.porEnviar;
  $('cifraEnRevision').textContent = r.enRevision;
  $('cifraDevueltos').textContent  = r.devueltos;
  $('cifraAprobados').textContent  = r.aprobados;
}

function pintarLista() {
  var contenedor = $('listaDocentes');
  var texto = plano($('buscador').value.trim());
  vaciar(contenedor);

  // Primero el estado y despues el texto, para poder decir "3 de 12
  // pendientes" en lugar de "3 de 50".
  var delEstado = APP.docentes.filter(function (d) {
    return FILTRO === 'TODOS' || (d.estadoRevision || REV_POR_ENVIAR) === FILTRO;
  });

  var visibles = delEstado.filter(function (d) {
    if (!texto) return true;
    return plano(d.nombreCompleto).indexOf(texto) !== -1 ||
           plano(d.documento).indexOf(texto) !== -1;
  });

  visibles.forEach(function (d) { contenedor.appendChild(tarjetaDocente(d)); });

  $('listaVacia').hidden = visibles.length > 0 || APP.docentes.length === 0;
  $('listaVacia').textContent = texto
    ? 'No hay docentes que coincidan con la búsqueda.'
    : 'No hay docentes en este estado.';

  pintarConteo(visibles.length, delEstado.length, texto);
}

/** Linea bajo el buscador: cuantos se ven y como volver a verlos todos. */
function pintarConteo(visibles, delEstado, texto) {
  var nodo = $('conteoResultados');
  vaciar(nodo);
  if (!APP.docentes.length) return;

  var frase;
  if (FILTRO === 'TODOS') {
    frase = texto
      ? 'Mostrando ' + visibles + ' de ' + APP.docentes.length + ' docentes.'
      : 'Mostrando los ' + APP.docentes.length + ' docentes de la auditoría.';
  } else if (texto) {
    frase = 'Mostrando ' + visibles + ' de ' + delEstado + ' ' + NOMBRES_GRUPO[FILTRO] + '.';
  } else {
    frase = 'Mostrando ' + delEstado + ' ' +
      (delEstado === 1 ? 'docente' : 'docentes') + ' ' + NOMBRES_GRUPO[FILTRO] + '.';
  }

  nodo.appendChild(document.createTextNode(frase + ' '));

  if (FILTRO !== 'TODOS' || texto) {
    var limpiar = crear('button', 'btn-mini', 'Ver todos');
    limpiar.type = 'button';
    limpiar.addEventListener('click', function () {
      FILTRO = 'TODOS';
      $('buscador').value = '';
      marcarFiltro();
      pintarLista();
    });
    nodo.appendChild(limpiar);
  }
}

/** Aplica un filtro por estado desde las cifras de arriba. */
function aplicarFiltro(estado) {
  // Volver a pulsar la misma cifra quita el filtro.
  FILTRO = (FILTRO === estado) ? 'TODOS' : estado;
  marcarFiltro();
  pintarLista();
  anunciar(FILTRO === 'TODOS'
    ? 'Mostrando todos los docentes.'
    : 'Filtrando por ' + NOMBRES_GRUPO[FILTRO] + '.');
}

/** Sincroniza el aspecto de las cuatro cifras con el filtro vigente. */
function marcarFiltro() {
  Array.prototype.forEach.call(
    $('tiraIndicadores').querySelectorAll('[data-filtro]'),
    function (boton) {
      var activo = boton.getAttribute('data-filtro') === FILTRO;
      boton.classList.toggle('activo', activo);
      boton.setAttribute('aria-pressed', activo ? 'true' : 'false');
    });
}

function tarjetaDocente(docente) {
  var estado = docente.estadoRevision || REV_POR_ENVIAR;

  var fila = crear('article', 'docente docente-' + estado);

  var datos = crear('div', 'docente-datos');
  datos.appendChild(crear('p', 'docente-nombre', docente.nombreCompleto || '(sin nombre)'));
  datos.appendChild(crear('p', 'docente-documento',
    (docente.tipoDocumento || 'CC') + ' ' + docente.documento));
  fila.appendChild(datos);

  var acciones = crear('div', 'docente-acciones');
  acciones.appendChild(insignia(estado));

  if (esConsulta()) {
    fila.appendChild(acciones);
    return fila;
  }

  var tieneValidacion = (docente.estado || ESTADO_PENDIENTE) !== ESTADO_PENDIENTE;
  var textoBoton = esTalentoHumano() && !tieneValidacion ? 'Validar' : 'Ver detalle';
  if (esRevisor() && estado === REV_EN_REVISION) textoBoton = 'Revisar';
  var boton = crear('button',
    'btn-compacto ' + ((esTalentoHumano() && !tieneValidacion) ||
      (esRevisor() && estado === REV_EN_REVISION) ? 'btn-primario' : 'btn-secundario'),
    textoBoton);
  boton.type = 'button';
  boton.setAttribute('data-documento', docente.documento);
  boton.setAttribute('aria-label',
    textoBoton + ' de ' + docente.nombreCompleto);
  acciones.appendChild(boton);

  fila.appendChild(acciones);
  return fila;
}

function insignia(estado) {
  return crear('span', 'insignia insignia-' + estado,
    NOMBRES_REVISION[estado] || NOMBRES_REVISION.POR_ENVIAR);
}

/* ------------------------------------------------------------
   FICHA: APERTURA
   ------------------------------------------------------------ */

function abrirFicha(documento) {
  mostrarVista('ficha');

  $('fichaCargando').hidden = false;
  $('fichaContenido').hidden = true;
  ocultarAviso($('fichaError'));
  ocultarAviso($('avisoGuardado'));
  anunciar('Cargando revisión...');

  servidor('obtenerValidacion', documento, function (datos) {
    $('fichaCargando').hidden = true;

    if (!datos || !datos.docente) {
      mostrarAviso($('fichaError'), 'error',
        'El servidor no devolvió la información del docente. Vuelva al listado e intente de nuevo.');
      return;
    }

    FICHA = {
      documento: datos.docente.documento,
      docente: datos.docente,
      guardado: datos.existe ? datos.validacion : null,
      modo: datos.existe || !esTalentoHumano() ? 'consulta' : 'nueva',
      archivos: { acta: null, diploma: null },
      quitarDiploma: false,
      guardando: false
    };

    $('fichaContenido').hidden = false;
    pintarFicha();
    anunciar('Ficha de ' + FICHA.docente.nombreCompleto + ' cargada.');
  }, function (mensaje) {
    // Pase lo que pase, la ficha no se queda en "Cargando revisión...".
    $('fichaCargando').hidden = true;
    $('fichaContenido').hidden = true;
    mostrarAviso($('fichaError'), 'error', 'No fue posible cargar la revisión: ' + mensaje);
  });
}

function volverAlListado() {
  FICHA = null;
  pintarLista();
  mostrarVista('lista');
}

/* ------------------------------------------------------------
   FICHA: DIBUJO
   ------------------------------------------------------------ */

function pintarFicha() {
  if (!FICHA) return;

  var formularioEditable = esTalentoHumano() &&
    (FICHA.modo === 'nueva' || FICHA.modo === 'edicion') && puedeEditarValidacion();
  var estadoDato = FICHA.guardado ? FICHA.guardado.estado : ESTADO_PENDIENTE;
  var estadoRevision = FICHA.guardado ? FICHA.guardado.estadoRevision : REV_POR_ENVIAR;

  /* --- Cabecera --- */
  $('fichaNombre').textContent = FICHA.docente.nombreCompleto || '(sin nombre)';
  $('fichaDocumento').textContent =
    (FICHA.docente.tipoDocumento || 'CC') + ' ' + FICHA.docente.documento;

  var marca = $('fichaInsignia');
  marca.className = 'insignia insignia-' + estadoRevision;
  marca.textContent = NOMBRES_REVISION[estadoRevision] || NOMBRES_REVISION.POR_ENVIAR;

  var marcaDato = $('fichaInsigniaDato');
  marcaDato.className = 'insignia insignia-' + estadoDato;
  marcaDato.textContent = NOMBRES_ESTADO[estadoDato] || NOMBRES_ESTADO.PENDIENTE;

  $('btnEditar').hidden = !(FICHA.modo === 'consulta' && FICHA.guardado && puedeEditarValidacion());

  /* --- Marcas de la revision guardada --- */
  pintarMarcas();

  /* --- Cinta de modo --- */
  var cinta = $('cintaModo');
  if (esConsulta()) {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      'Vista de solo consulta. Puede revisar el avance y los documentos, pero no modificar ni decidir registros.';
  } else if (esRevisor() && estadoRevision === REV_EN_REVISION) {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      'Registro enviado por Talento Humano. Compare cada dato con los soportes antes de decidir.';
  } else if (esRevisor()) {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      'Este registro no está pendiente de decisión. Se muestra en modo de consulta.';
  } else if (FICHA.modo === 'consulta' && estadoRevision === REV_EN_REVISION) {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      'Registro enviado al revisor. La edición está bloqueada hasta que sea aprobado o devuelto.';
  } else if (FICHA.modo === 'consulta' && estadoRevision === REV_APROBADO) {
    cinta.hidden = false;
    $('cintaModoTexto').textContent = 'Registro aprobado y cerrado para edición.';
  } else if (FICHA.modo === 'consulta') {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      estadoRevision === REV_DEVUELTO
        ? 'El revisor devolvió este registro. Use "Editar revisión" para corregirlo y enviarlo nuevamente.'
        : 'Validación guardada. Puede editarla o enviarla al revisor.';
  } else if (FICHA.modo === 'edicion') {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      'Está editando una revisión guardada. Al guardar se actualizará el registro existente, ' +
      'sin crear uno nuevo.';
  } else {
    cinta.hidden = true;
    $('cintaModoTexto').textContent = '';
  }

  /* --- Cuerpo --- */
  pintarCriterios();
  pintarSoportes();
  pintarPrevisualizacion();
  pintarPanelRevisor();

  $('observaciones').value = FICHA.guardado ? (FICHA.guardado.observaciones || '') : '';
  $('camposRevision').disabled = !formularioEditable;

  /* --- Navegacion --- */
  var puedeEnviar = esTalentoHumano() && FICHA.guardado && FICHA.modo === 'consulta' &&
    (estadoRevision === REV_POR_ENVIAR || estadoRevision === REV_DEVUELTO);
  $('navegacionFicha').hidden = !formularioEditable && !puedeEnviar;
  $('btnCancelarEdicion').hidden = FICHA.modo !== 'edicion';
  $('btnGuardar').hidden = !formularioEditable;
  $('btnEnviarRevision').hidden = !puedeEnviar;
  $('btnGuardar').textContent = FICHA.modo === 'edicion' ? 'Guardar cambios' : 'Guardar revisión';
  $('btnGuardar').disabled = false;

  ocultarAviso($('avisoGuardado'));
}

function pintarMarcas() {
  var caja = $('fichaMarcas');
  vaciar(caja);

  if (!FICHA.guardado) {
    caja.hidden = true;
    return;
  }

  var marcas = [
    ['Fecha de validación (hora Colombia)', FICHA.guardado.fechaValidacion],
    ['Última modificación (hora Colombia)', FICHA.guardado.fechaModificacion],
    ['Resultado de datos', NOMBRES_ESTADO[FICHA.guardado.estado] || FICHA.guardado.estado],
    ['Estado de revisión', NOMBRES_REVISION[FICHA.guardado.estadoRevision] || FICHA.guardado.estadoRevision],
    ['Guardado por', FICHA.guardado.guardadoPor],
    ['Enviado por', FICHA.guardado.enviadoPor],
    ['Fecha de envío (hora Colombia)', FICHA.guardado.fechaEnvio],
    ['Revisado por', FICHA.guardado.revisadoPor],
    ['Fecha de decisión (hora Colombia)', FICHA.guardado.fechaRevision]
  ];

  marcas.forEach(function (par) {
    var celda = crear('div', 'ficha-marca');
    celda.appendChild(crear('p', null, par[0]));
    celda.appendChild(crear('p', null, par[1] || '—'));
    caja.appendChild(celda);
  });

  caja.hidden = false;
}

function pintarPrevisualizacion() {
  var panel = $('previsualizacion');
  var guardado = FICHA && FICHA.guardado;
  var hayActa = !!(guardado && guardado.previewActa);
  var hayDiploma = !!(guardado && guardado.previewDiploma);
  panel.hidden = !hayActa && !hayDiploma;
  $('tabActa').hidden = !hayActa;
  $('tabDiploma').hidden = !hayDiploma;
  if (panel.hidden) {
    vaciar($('visorDocumento'));
    return;
  }
  mostrarDocumento(hayActa ? 'acta' : 'diploma');
}

function mostrarDocumento(tipo) {
  if (!FICHA || !FICHA.guardado) return;
  var esActa = tipo === 'acta';
  var preview = esActa ? FICHA.guardado.previewActa : FICHA.guardado.previewDiploma;
  var url = esActa ? FICHA.guardado.urlActa : FICHA.guardado.urlDiploma;
  if (!preview) return;

  $('tabActa').classList.toggle('activo', esActa);
  $('tabDiploma').classList.toggle('activo', !esActa);
  var visor = $('visorDocumento');
  vaciar(visor);

  var iframe = document.createElement('iframe');
  iframe.src = preview;
  iframe.title = 'Previsualización de ' + (esActa ? 'acta de grado' : 'diploma');
  iframe.loading = 'lazy';
  iframe.referrerPolicy = 'no-referrer';
  visor.appendChild(iframe);

  var enlace = crear('a', 'abrir-drive', 'Abrir en Drive');
  enlace.href = url;
  enlace.target = '_blank';
  enlace.rel = 'noopener';
  visor.appendChild(enlace);
}

function pintarPanelRevisor() {
  var panel = $('panelRevisor');
  if (!FICHA || !FICHA.guardado || esTalentoHumano()) {
    panel.hidden = true;
    return;
  }

  panel.hidden = false;
  var puedeDecidir = esRevisor() && FICHA.guardado.estadoRevision === REV_EN_REVISION;
  var contenedor = $('criteriosRevisor');
  vaciar(contenedor);

  APP.criterios.forEach(function (criterio) {
    var th = FICHA.guardado.criterios && FICHA.guardado.criterios[criterio.clave];
    var reportado = FICHA.docente.valores ? FICHA.docente.valores[criterio.clave] : '';
    var valorFinal = th && th.valor === NO_COINCIDE ? th.correccion : reportado;
    var guardado = FICHA.guardado.revisionCriterios
      ? FICHA.guardado.revisionCriterios[criterio.clave] : '';

    var fila = crear('div', 'criterio-revisor');
    fila.setAttribute('data-clave', criterio.clave);
    var comparacion = crear('div', 'revision-comparacion');
    comparacion.appendChild(crear('p', 'criterio-etiqueta', criterio.etiqueta));
    comparacion.appendChild(crear('p', 'revision-original', 'SNIES: ' + (reportado || '(sin dato)')));
    comparacion.appendChild(crear('p', 'revision-final',
      'Talento Humano: ' + (valorFinal || '(sin dato)')));
    fila.appendChild(comparacion);

    var opciones = crear('div', 'opciones-criterio');
    opciones.appendChild(botonRevision(criterio.clave, REV_CONFORME, '✓', 'Conforme',
      guardado === REV_CONFORME));
    opciones.appendChild(botonRevision(criterio.clave, REV_NO_CONFORME, '✕', 'No conforme',
      guardado === REV_NO_CONFORME));
    fila.appendChild(opciones);
    contenedor.appendChild(fila);
  });

  $('observacionRevisor').value = FICHA.guardado.observacionRevision || '';
  $('camposRevisor').disabled = !puedeDecidir;
  $('accionesRevisor').hidden = !puedeDecidir;
}

function botonRevision(clave, valor, simbolo, texto, marcado) {
  var etiqueta = crear('label', 'opcion-criterio');
  var radio = document.createElement('input');
  radio.type = 'radio';
  radio.name = 'rev_' + clave;
  radio.value = valor;
  radio.checked = !!marcado;
  etiqueta.appendChild(radio);
  etiqueta.appendChild(crear('span', 'marca', simbolo));
  etiqueta.appendChild(document.createTextNode(texto));
  if (marcado) etiqueta.classList.add(valor === REV_CONFORME ? 'marcada-si' : 'marcada-no');
  radio.addEventListener('change', function () {
    Array.prototype.forEach.call(etiqueta.parentNode.querySelectorAll('.opcion-criterio'), function (e) {
      var r = e.querySelector('input');
      e.classList.toggle('marcada-si', r.checked && r.value === REV_CONFORME);
      e.classList.toggle('marcada-no', r.checked && r.value === REV_NO_CONFORME);
    });
  });
  return etiqueta;
}

function pintarCriterios() {
  var contenedor = $('listaCriterios');
  vaciar(contenedor);

  APP.criterios.forEach(function (criterio) {
    var guardado = FICHA.guardado && FICHA.guardado.criterios
      ? FICHA.guardado.criterios[criterio.clave]
      : null;

    var reportado = FICHA.docente.valores ? FICHA.docente.valores[criterio.clave] : '';

    var fila = crear('div', 'criterio');
    fila.setAttribute('data-clave', criterio.clave);

    /* Columna izquierda: que se compara y con que valor */
    var texto = crear('div');
    texto.appendChild(crear('p', 'criterio-etiqueta', criterio.etiqueta));
    texto.appendChild(reportado
      ? crear('p', 'criterio-valor', reportado)
      : crear('p', 'criterio-valor vacio', '(sin dato reportado)'));
    fila.appendChild(texto);

    /* Columna derecha: el par de botones */
    var opciones = crear('div', 'opciones-criterio');
    opciones.appendChild(botonCriterio(criterio.clave, COINCIDE, '✓', 'Coincide',
      guardado && guardado.valor === COINCIDE));
    opciones.appendChild(botonCriterio(criterio.clave, NO_COINCIDE, '✕', 'No coincide',
      guardado && guardado.valor === NO_COINCIDE));
    fila.appendChild(opciones);

    /* Campo de correccion, visible solo cuando algo no coincide */
    var correccion = crear('div', 'correccion');

    var comparacion = crear('p', 'comparacion');
    comparacion.appendChild(document.createTextNode('SNIES reporta: '));
    var reportadoNodo = crear('strong', null, reportado || '(sin dato)');
    comparacion.appendChild(reportadoNodo);
    correccion.appendChild(comparacion);

    var etiqueta = crear('label');
    etiqueta.setAttribute('for', 'corr_' + criterio.clave);
    etiqueta.appendChild(document.createTextNode('Valor correcto según el soporte '));
    etiqueta.appendChild(crear('span', 'obligatorio', '*'));
    correccion.appendChild(etiqueta);

    var opcionesCorreccion = criterio.opcionesCorreccion || [];
    var campo;

    if (opcionesCorreccion.length) {
      campo = document.createElement('select');

      var opcionVacia = document.createElement('option');
      opcionVacia.value = '';
      opcionVacia.textContent = 'Seleccione una opción';
      campo.appendChild(opcionVacia);

      opcionesCorreccion.forEach(function (valor) {
        var opcion = document.createElement('option');
        opcion.value = valor;
        opcion.textContent = valor;
        campo.appendChild(opcion);
      });
    } else {
      campo = document.createElement('input');
      campo.type = criterio.tipoCorreccion === 'fecha' ? 'date' : 'text';

      if (campo.type === 'text') {
        campo.maxLength = 500;
        campo.autocomplete = 'off';
        campo.placeholder = 'Escriba el valor que figura en el documento soporte';
      }
    }

    campo.className = 'campo-correccion';
    if (criterio.normalizarCorreccion === 'mayusculas') {
      campo.classList.add('campo-mayusculas');
    }
    campo.id = 'corr_' + criterio.clave;
    var valorGuardado = guardado ? (guardado.correccion || '') : '';
    if (criterio.normalizarCorreccion === 'mayusculas') {
      valorGuardado = valorGuardado.toUpperCase();
    }
    campo.value = criterio.tipoCorreccion === 'fecha'
      ? fechaParaControl(valorGuardado)
      : valorGuardado;
    correccion.appendChild(campo);

    correccion.appendChild(crear('p', 'mensaje-error',
      opcionesCorreccion.length
        ? 'Seleccione el valor correcto según el soporte.'
        : criterio.tipoCorreccion === 'fecha'
          ? 'Seleccione la fecha correcta según el soporte.'
          : 'Escriba el valor correcto según el soporte.'));

    if (guardado && guardado.valor === NO_COINCIDE) correccion.classList.add('visible');
    fila.appendChild(correccion);

    contenedor.appendChild(fila);
    refrescarCriterio(fila);
  });
}

function botonCriterio(clave, valor, simbolo, texto, marcado) {
  var etiqueta = crear('label', 'opcion-criterio');

  var radio = document.createElement('input');
  radio.type = 'radio';
  radio.name = 'crit_' + clave;
  radio.value = valor;
  radio.checked = !!marcado;
  etiqueta.appendChild(radio);

  etiqueta.appendChild(crear('span', 'marca', simbolo));
  etiqueta.appendChild(document.createTextNode(texto));
  return etiqueta;
}

/** Sincroniza el aspecto de un criterio con el radio que este marcado. */
function refrescarCriterio(fila) {
  var elegido = fila.querySelector('input[type="radio"]:checked');
  var valor = elegido ? elegido.value : '';

  Array.prototype.forEach.call(fila.querySelectorAll('.opcion-criterio'), function (etiqueta) {
    var radio = etiqueta.querySelector('input[type="radio"]');
    var activa = radio.checked;
    etiqueta.classList.toggle('marcada-si', activa && radio.value === COINCIDE);
    etiqueta.classList.toggle('marcada-no', activa && radio.value === NO_COINCIDE);
  });

  var correccion = fila.querySelector('.correccion');
  correccion.classList.toggle('visible', valor === NO_COINCIDE);

  if (valor !== NO_COINCIDE) {
    correccion.classList.remove('con-error');
    correccion.querySelector('.campo-correccion').value = '';
  }

  if (valor) fila.classList.remove('sin-responder');
}

function pintarEstadoSoporte(tipo) {
  var nodo = $(tipo === 'acta' ? 'estadoActa' : 'estadoDiploma');
  var nombre = tipo === 'acta' ? 'acta' : 'diploma';
  var url = FICHA.guardado
    ? (tipo === 'acta' ? FICHA.guardado.urlActa : FICHA.guardado.urlDiploma)
    : '';

  vaciar(nodo);

  if (FICHA.archivos[tipo]) {
    nodo.className = 'soporte-estado nuevo';
    nodo.appendChild(document.createTextNode(
      'Archivo seleccionado: ' + FICHA.archivos[tipo].nombre));
    if (url) {
      nodo.appendChild(crear('span', null, ' (reemplazará al actual)'));
    }
    return;
  }

  if (tipo === 'diploma' && FICHA.quitarDiploma && url) {
    nodo.className = 'soporte-estado fallo';
    nodo.appendChild(document.createTextNode('El diploma se retirará al guardar.'));
    nodo.appendChild(botonSoporte('Conservar', function () {
      FICHA.quitarDiploma = false;
      pintarEstadoSoporte('diploma');
    }));
    return;
  }

  if (url) {
    nodo.className = 'soporte-estado cargado';
    nodo.appendChild(document.createTextNode('✓ Documento cargado'));

    var enlace = crear('a', null, 'Ver documento');
    enlace.href = url;
    enlace.target = '_blank';
    enlace.rel = 'noopener';
    enlace.setAttribute('aria-label', 'Ver el ' + nombre + ' en Google Drive');
    nodo.appendChild(enlace);

    if (tipo === 'diploma' && FICHA.modo !== 'consulta') {
      nodo.appendChild(botonSoporte('Quitar', function () {
        FICHA.quitarDiploma = true;
        pintarEstadoSoporte('diploma');
      }));
    }
    return;
  }

  nodo.className = 'soporte-estado ausente';
  nodo.appendChild(document.createTextNode(
    tipo === 'acta' ? 'Sin acta cargada.' : 'Sin diploma cargado.'));
}

function botonSoporte(texto, accion) {
  var boton = crear('button', 'btn-mini', texto);
  boton.type = 'button';
  boton.addEventListener('click', accion);
  return boton;
}

/**
 * Comprueba el archivo elegido y lo deja listo en memoria como base64.
 * Solo se sube al servidor cuando la persona guarda la revision.
 */
function recibirArchivo(tipo, input, etiqueta) {
  var caja = $(tipo === 'acta' ? 'soporteActa' : 'soporteDiploma');
  var error = $(tipo === 'acta' ? 'errorActa' : 'errorDiploma');
  var estado = $(tipo === 'acta' ? 'estadoActa' : 'estadoDiploma');

  var fallar = function (mensaje) {
    input.value = '';
    FICHA.archivos[tipo] = null;
    caja.classList.add('con-error');
    error.textContent = mensaje;
    error.hidden = false;
    pintarEstadoSoporte(tipo);
  };

  caja.classList.remove('con-error');
  error.hidden = true;

  var archivo = input.files && input.files[0];
  if (!archivo) {
    FICHA.archivos[tipo] = null;
    pintarEstadoSoporte(tipo);
    return;
  }

  if (!/\.pdf$/i.test(archivo.name) ||
      (archivo.type && archivo.type !== 'application/pdf')) {
    fallar('El ' + etiqueta + ' debe ser un archivo PDF.');
    return;
  }

  if (archivo.size > MAX_BYTES_PDF) {
    fallar('El ' + etiqueta + ' supera el tamaño máximo de 10 MB.');
    return;
  }

  if (archivo.size === 0) {
    fallar('El archivo seleccionado está vacío.');
    return;
  }

  estado.className = 'soporte-estado ausente';
  estado.textContent = 'Leyendo archivo...';

  var lector = new FileReader();

  lector.onload = function () {
    var resultado = String(lector.result || '');
    var coma = resultado.indexOf(',');
    if (coma === -1) {
      fallar('No fue posible leer el archivo. Vuelva a seleccionarlo.');
      return;
    }
    FICHA.archivos[tipo] = {
      nombre: archivo.name,
      tipo: 'application/pdf',
      datos: resultado.slice(coma + 1)
    };
    if (tipo === 'diploma') FICHA.quitarDiploma = false;
    pintarEstadoSoporte(tipo);
  };

  lector.onerror = function () {
    fallar('No fue posible leer el archivo. Vuelva a seleccionarlo.');
  };

  lector.readAsDataURL(archivo);
}

function entrarEnEdicion() {
  if (!FICHA || !puedeEditarValidacion()) return;
  FICHA.modo = 'edicion';
  FICHA.archivos = { acta: null, diploma: null };
  FICHA.quitarDiploma = false;
  pintarFicha();

  var primero = $('listaCriterios').querySelector('input[type="radio"]');
  if (primero) primero.focus();
  anunciar('Edición habilitada.');
}

/** Descarta los cambios y vuelve a dibujar exactamente lo guardado. */
function cancelarEdicion() {
  if (!FICHA || !FICHA.guardado) return;
  FICHA.modo = 'consulta';
  FICHA.archivos = { acta: null, diploma: null };
  FICHA.quitarDiploma = false;
  pintarFicha();
  anunciar('Edición cancelada. Se restauraron los valores guardados.');
}

/* ------------------------------------------------------------
   FICHA: VALIDACION Y GUARDADO
   ------------------------------------------------------------ */

/** Recoge lo que hay en pantalla en la forma que espera el servidor. */
function recolectar() {
  var criterios = {};

  Array.prototype.forEach.call($('listaCriterios').querySelectorAll('.criterio'), function (fila) {
    var clave = fila.getAttribute('data-clave');
    var elegido = fila.querySelector('input[type="radio"]:checked');
    var correccion = fila.querySelector('.campo-correccion');
    criterios[clave] = {
      valor: elegido ? elegido.value : '',
      correccion: correccion ? correccion.value.trim() : ''
    };
  });

  return {
    documento: FICHA.documento,
    version: FICHA.guardado ? FICHA.guardado.version : 0,
    criterios: criterios,
    observaciones: $('observaciones').value.trim(),
    acta: FICHA.archivos.acta,
    diploma: FICHA.archivos.diploma,
    quitarDiploma: FICHA.quitarDiploma === true
  };
}

/**
 * Revisa lo recogido y devuelve la lista de problemas. Ademas senala en
 * pantalla cada campo afectado y deja en .foco el primero, para llevar
 * alli a la persona.
 */
function validar(datos) {
  var problemas = [];
  var foco = null;
  var sinRevisar = 0;

  // Se parte de cero: lo que se corrigio desde el intento anterior
  // debe dejar de aparecer marcado.
  $('soporteActa').classList.remove('con-error');
  $('soporteDiploma').classList.remove('con-error');
  $('errorActa').hidden = true;
  $('errorDiploma').hidden = true;

  Array.prototype.forEach.call($('listaCriterios').querySelectorAll('.criterio'), function (fila) {
    var clave = fila.getAttribute('data-clave');
    var dato = datos.criterios[clave];
    var correccion = fila.querySelector('.correccion');

    fila.classList.remove('sin-responder');
    correccion.classList.remove('con-error');

    if (!dato.valor) {
      sinRevisar++;
      fila.classList.add('sin-responder');
      if (!foco) foco = fila.querySelector('input[type="radio"]');
      return;
    }

    if (dato.valor === NO_COINCIDE && !dato.correccion) {
      correccion.classList.add('con-error');
      problemas.push('Falta el valor correcto de "' + etiquetaDe(clave) + '".');
      if (!foco) foco = correccion.querySelector('.campo-correccion');
    }
  });

  if (sinRevisar) {
    problemas.unshift(sinRevisar === 1
      ? 'Queda 1 criterio sin revisar.'
      : 'Quedan ' + sinRevisar + ' criterios sin revisar.');
  }

  if (APP.requisitos.actaObligatoria && !datos.acta && !urlGuardada('acta')) {
    $('soporteActa').classList.add('con-error');
    $('errorActa').textContent = 'Debe cargar el acta de grado en PDF.';
    $('errorActa').hidden = false;
    problemas.push('Falta cargar el acta de grado.');
    if (!foco) foco = $('archivoActa');
  }

  if (APP.requisitos.diplomaObligatorio && !datos.diploma &&
      (!urlGuardada('diploma') || datos.quitarDiploma)) {
    $('soporteDiploma').classList.add('con-error');
    $('errorDiploma').textContent = 'Debe cargar el diploma de grado en PDF.';
    $('errorDiploma').hidden = false;
    problemas.push('Falta cargar el diploma de grado.');
    if (!foco) foco = $('archivoDiploma');
  }

  return { problemas: problemas, foco: foco };
}

function urlGuardada(tipo) {
  if (!FICHA.guardado) return '';
  return (tipo === 'acta' ? FICHA.guardado.urlActa : FICHA.guardado.urlDiploma) || '';
}

function etiquetaDe(clave) {
  for (var i = 0; i < APP.criterios.length; i++) {
    if (APP.criterios[i].clave === clave) return APP.criterios[i].etiqueta;
  }
  return clave;
}

function guardarRevision() {
  if (!FICHA || FICHA.guardando || !esTalentoHumano() || !puedeEditarValidacion()) return;

  var datos = recolectar();
  var revision = validar(datos);
  var aviso = $('avisoGuardado');

  if (revision.problemas.length) {
    mostrarAviso(aviso, 'error',
      'No fue posible guardar la revisión: ' + revision.problemas.join(' '));
    if (revision.foco) {
      revision.foco.focus();
      // El radio esta oculto visualmente: se desplaza el bloque que lo contiene.
      var visible = revision.foco.closest('.criterio, .soporte') || revision.foco;
      visible.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    return;
  }

  ocultarAviso(aviso);

  var boton = $('btnGuardar');
  var textoOriginal = boton.textContent;
  FICHA.guardando = true;
  boton.disabled = true;
  boton.textContent = 'Guardando...';
  $('btnCancelarEdicion').disabled = true;

  var subeArchivos = !!(datos.acta || datos.diploma);
  mostrarCapa(subeArchivos ? 'Subiendo documentos...' : 'Guardando revisión...');

  var terminar = function () {
    FICHA.guardando = false;
    boton.disabled = false;
    boton.textContent = textoOriginal;
    $('btnCancelarEdicion').disabled = false;
    ocultarCapa();
  };

  servidor('guardarValidacion', datos, function (respuesta) {
    terminar();

    if (respuesta && respuesta.resumen) {
      APP.resumen = respuesta.resumen;
      pintarIndicadores();
    }

    actualizarDocenteEnLista(respuesta.documento, respuesta.estado, respuesta.validacion.estadoRevision);
    var nombreDocente = FICHA.docente.nombreCompleto || FICHA.documento;

    // El servidor ya confirmo el guardado: se actualiza el listado y se
    // regresa de inmediato, sin obligar a pulsar "Volver al listado".
    volverAlListado();
    mostrarAviso($('avisoGeneral'), 'exito',
      '✓ Revisión de ' + nombreDocente + ' guardada correctamente.');
    anunciar('Revisión guardada. Estado: ' +
      (NOMBRES_ESTADO[respuesta.estado] || respuesta.estado) + '.');

  }, function (mensaje) {
    terminar();
    mostrarAviso($('avisoGuardado'), 'error', 'No fue posible guardar la revisión: ' + mensaje);
    $('avisoGuardado').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

function enviarRevision() {
  if (!FICHA || !FICHA.guardado || FICHA.guardando || !esTalentoHumano()) return;
  var boton = $('btnEnviarRevision');
  FICHA.guardando = true;
  boton.disabled = true;
  mostrarCapa('Enviando al revisor...');

  servidor('enviarARevision', {
    documento: FICHA.documento,
    version: FICHA.guardado.version
  }, function (respuesta) {
    FICHA.guardando = false;
    boton.disabled = false;
    ocultarCapa();
    if (respuesta && respuesta.resumen) APP.resumen = respuesta.resumen;
    actualizarDocenteEnLista(respuesta.documento, null, respuesta.estadoRevision);
    var nombre = FICHA.docente.nombreCompleto || FICHA.documento;
    volverAlListado();
    pintarIndicadores();
    mostrarAviso($('avisoGeneral'), 'exito',
      '✓ ' + nombre + ' fue enviado al revisor. El registro quedó bloqueado para edición.');
  }, function (mensaje) {
    FICHA.guardando = false;
    boton.disabled = false;
    ocultarCapa();
    mostrarAviso($('avisoGuardado'), 'error', 'No fue posible enviar la revisión: ' + mensaje);
  });
}

function recolectarDecision() {
  var criterios = {};
  Array.prototype.forEach.call($('criteriosRevisor').querySelectorAll('.criterio-revisor'), function (fila) {
    var elegido = fila.querySelector('input[type="radio"]:checked');
    criterios[fila.getAttribute('data-clave')] = elegido ? elegido.value : '';
    fila.classList.toggle('sin-responder', !elegido);
  });
  return criterios;
}

function decidirRevision(decision) {
  if (!FICHA || !FICHA.guardado || FICHA.guardando || !esRevisor() ||
      FICHA.guardado.estadoRevision !== REV_EN_REVISION) return;

  var criterios = recolectarDecision();
  var faltantes = Object.keys(criterios).filter(function (clave) { return !criterios[clave]; });
  var observacion = $('observacionRevisor').value.trim();
  if (faltantes.length) {
    mostrarAviso($('avisoGuardado'), 'error',
      'Debe revisar todos los criterios antes de tomar una decisión.');
    return;
  }
  if (decision === REV_APROBADO && Object.keys(criterios).some(function (clave) {
    return criterios[clave] === REV_NO_CONFORME;
  })) {
    mostrarAviso($('avisoGuardado'), 'error',
      'No puede aprobar mientras exista un criterio marcado como no conforme.');
    return;
  }
  if (decision === REV_DEVUELTO && !observacion) {
    mostrarAviso($('avisoGuardado'), 'error',
      'Escriba qué debe corregir Talento Humano antes de devolver el registro.');
    $('observacionRevisor').focus();
    return;
  }

  FICHA.guardando = true;
  $('btnAprobar').disabled = true;
  $('btnDevolver').disabled = true;
  mostrarCapa(decision === REV_APROBADO ? 'Aprobando revisión...' : 'Devolviendo a Talento Humano...');

  servidor('decidirRevision', {
    documento: FICHA.documento,
    version: FICHA.guardado.version,
    decision: decision,
    criterios: criterios,
    observacion: observacion
  }, function (respuesta) {
    FICHA.guardando = false;
    ocultarCapa();
    if (respuesta && respuesta.resumen) APP.resumen = respuesta.resumen;
    actualizarDocenteEnLista(respuesta.documento, null, respuesta.estadoRevision);
    var nombre = FICHA.docente.nombreCompleto || FICHA.documento;
    volverAlListado();
    pintarIndicadores();
    mostrarAviso($('avisoGeneral'), 'exito', decision === REV_APROBADO
      ? '✓ Revisión de ' + nombre + ' aprobada.'
      : '↩ Revisión de ' + nombre + ' devuelta a Talento Humano.');
  }, function (mensaje) {
    FICHA.guardando = false;
    $('btnAprobar').disabled = false;
    $('btnDevolver').disabled = false;
    ocultarCapa();
    mostrarAviso($('avisoGuardado'), 'error', 'No fue posible registrar la decisión: ' + mensaje);
  });
}

/** Refleja el nuevo estado en la lista sin volver a pedirla al servidor. */
function actualizarDocenteEnLista(documento, estado, estadoRevision) {
  for (var i = 0; i < APP.docentes.length; i++) {
    if (APP.docentes[i].documento === documento) {
      if (estado) APP.docentes[i].estado = estado;
      if (estadoRevision) APP.docentes[i].estadoRevision = estadoRevision;
      return;
    }
  }
}
</script>
