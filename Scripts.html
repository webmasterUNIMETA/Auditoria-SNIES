<script>
/* ============================================================
   Scripts.html
   Validacion documental de docentes - Auditoria SNIES - UNIMETA

   La pagina tiene dos vistas: el listado y la ficha del docente.
   Nunca se usa alert(), confirm() ni prompt(): todos los mensajes
   se dibujan dentro de la interfaz.

   Todo el texto que proviene de las hojas se inserta con
   textContent, nunca con innerHTML, de modo que un nombre o un
   titulo con caracteres de HTML no puede inyectar marcado.
   ============================================================ */

'use strict';

/* ------------------------------------------------------------
   ESTADO
   ------------------------------------------------------------ */

var COINCIDE    = 'COINCIDE';
var NO_COINCIDE = 'NO_COINCIDE';

var ESTADO_PENDIENTE  = 'PENDIENTE';
var ESTADO_VALIDADO   = 'VALIDADO';
var ESTADO_CORRECCION = 'REQUIERE_CORRECCION';

var ROL_TALENTO_HUMANO = 'TALENTO_HUMANO';
var ROL_REVISOR = 'REVISOR';
var ROL_CONSULTA = 'CONSULTA';

var REV_PENDIENTE_CARGA = 'PENDIENTE_CARGA';
var REV_POR_ENVIAR = 'POR_ENVIAR';
var REV_EN_REVISION = 'EN_REVISION';
var REV_DEVUELTO = 'DEVUELTO';
var REV_APROBADO = 'APROBADO';
var REV_CONFORME = 'CONFORME';
var REV_NO_CONFORME = 'NO_CONFORME';

var MEN_PENDIENTE = 'PENDIENTE';
var MEN_SUBSANACION = 'SUBSANACION';
var MEN_LISTO = 'LISTO_RADICAR';
var MEN_RADICADO = 'RADICADO';

/* ------------------------------------------------------------
   VOCABULARIO

   Una palabra, un significado. Reglas de reserva:

     "Revisión"  -> solo la etapa del revisor
     "Validación"-> solo el trabajo de Talento Humano
     "Pendiente" -> nunca se usa sola: siempre "pendiente DE algo"
     "Radicar"   -> siempre con su complemento "ante el MEN"

   La cadena que aprende el usuario es:
     Sin cargar -> Borrador sin enviar -> En revisión ->
     (Devuelto para corregir | Aprobado) -> Por radicar -> Radicado
   ------------------------------------------------------------ */

var NOMBRES_ESTADO = {
  PENDIENTE: 'Sin validar',
  VALIDADO: 'Validado',
  REQUIERE_CORRECCION: 'Dato distinto a SNIES'
};

var NOMBRES_REVISION = {
  PENDIENTE_CARGA: 'Sin cargar',
  POR_ENVIAR: 'Borrador sin enviar',
  EN_REVISION: 'En revisión',
  DEVUELTO: 'Devuelto para corregir',
  APROBADO: 'Aprobado · falta radicar'
};

var NOMBRES_MEN = {
  PENDIENTE: 'Por radicar ante el MEN',
  SUBSANACION: 'En subsanación (espera fecha)',
  LISTO_RADICAR: 'Listo para radicar',
  RADICADO: 'Radicado ante el MEN'
};

var NOMBRES_ROL = {
  TALENTO_HUMANO: 'Talento Humano',
  REVISOR: 'Revisor',
  CONSULTA: 'Solo consulta'
};

/** Como se nombra cada grupo al contarlo: "Mostrando 12 pendientes". */
var NOMBRES_GRUPO = {
  PENDIENTE_CARGA: 'sin cargar',
  POR_ENVIAR: 'en borrador, sin enviar',
  EN_REVISION: 'en revisión',
  DEVUELTO: 'devueltos para corregir',
  APROBADO: 'aprobados',
  MEN_PENDIENTE: 'por radicar ante el MEN',
  MEN_SUBSANACION: 'en subsanación',
  MEN_LISTO: 'listos para radicar',
  MEN_RADICADO: 'radicados ante el MEN'
};

var NOMBRES_GRUPO_SINGULAR = {
  PENDIENTE_CARGA: 'sin cargar',
  POR_ENVIAR: 'en borrador, sin enviar',
  EN_REVISION: 'en revisión',
  DEVUELTO: 'devuelto para corregir',
  APROBADO: 'aprobado',
  MEN_PENDIENTE: 'por radicar ante el MEN',
  MEN_SUBSANACION: 'en subsanación',
  MEN_LISTO: 'listo para radicar',
  MEN_RADICADO: 'radicado ante el MEN'
};

/**
 * Los eventos del historial en lenguaje llano.
 *
 * La hoja HistorialRevisiones es una bitácora que nunca se borra, así que
 * puede contener eventos que el código de hoy ya no emite (por ejemplo
 * AJUSTE_A_SUBSANACION_MEN, de una versión anterior). Por eso existe
 * nombreEvento(): un mapa fijo dejaría esas filas con el nombre técnico.
 */
var NOMBRES_EVENTO = {
  GUARDADO: 'Guardados',
  ENVIADO_A_REVISION: 'Enviados al revisor',
  APROBADO: 'Aprobados',
  APROBADO_CON_CORRECCION_REVISOR: 'Aprobados con corrección',
  DEVUELTO: 'Devueltos',
  SUBSANACION_MEN: 'Puestos en subsanación',
  AJUSTE_A_SUBSANACION_MEN: 'Ajustes de subsanación',
  RADICADO_MEN: 'Radicados ante el MEN',
  MIGRADO_A_REVISION: 'Migrados a revisión'
};

/** Nombre legible de un evento, conocido o no. */
function nombreEvento(clave) {
  if (NOMBRES_EVENTO[clave]) return NOMBRES_EVENTO[clave];
  // ALGO_QUE_NO_CONOZCO -> "Algo que no conozco"
  var texto = String(clave || '').replace(/_/g, ' ').toLowerCase().trim();
  return texto ? texto.charAt(0).toUpperCase() + texto.slice(1) : '—';
}

/** Nombre legible de un rol, incluido el seudo-rol de las migraciones. */
function nombreRol(clave) {
  if (NOMBRES_ROL[clave]) return NOMBRES_ROL[clave];
  if (clave === 'ADMINISTRADOR') return 'Administrador';
  var texto = String(clave || '').replace(/_/g, ' ').toLowerCase().trim();
  return texto ? texto.charAt(0).toUpperCase() + texto.slice(1) : '—';
}

/** Estado por el que se filtra el listado. 'TODOS' no filtra nada. */
var FILTRO = 'TODOS';

var MAX_BYTES_PDF = 10 * 1024 * 1024;

var SIN_CONEXION = 'No fue posible comunicarse con el servidor. ' +
  'Verifique su conexión e intente de nuevo.';

/** Datos de la auditoria, tal como los entrega obtenerDocentes(). */
var APP = {
  auditoria: '',
  criterios: [],
  perfil: { correo: '', nombre: '', rol: '', roles: [] },
  requisitos: { actaObligatoria: true, diplomaObligatorio: false },
  docentes: [],
  resumen: {
    total: 0,
    pendientesCarga: 0,
    porEnviar: 0,
    enRevision: 0,
    devueltos: 0,
    aprobados: 0,
    menPendientes: 0,
    menSubsanacion: 0,
    menListos: 0,
    menRadicados: 0
  }
};

var DOCUMENTO_SUBSANACION = '';

/**
 * Ficha abierta en este momento.
 *
 *   modo 'nueva'    -> el docente aun no ha sido revisado
 *   modo 'consulta' -> revision guardada, campos bloqueados
 *   modo 'edicion'  -> revision guardada que se esta modificando
 *
 * guardado conserva SIEMPRE la ultima version confirmada por el
 * servidor: es lo que permite que "Cancelar edición" restaure los
 * valores exactos sin volver a consultar.
 */
var FICHA = null;

/* ------------------------------------------------------------
   UTILIDADES
   ------------------------------------------------------------ */

function $(id) { return document.getElementById(id); }

function crear(etiqueta, clase, texto) {
  var nodo = document.createElement(etiqueta);
  if (clase) nodo.className = clase;
  if (texto !== undefined && texto !== null) nodo.textContent = texto;
  return nodo;
}

function vaciar(nodo) {
  while (nodo.firstChild) nodo.removeChild(nodo.firstChild);
}

/** Quita tildes y pasa a minusculas, para comparar en el buscador. */
function plano(texto) {
  return String(texto == null ? '' : texto)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase();
}

/** Convierte dd/mm/aaaa al valor aaaa-mm-dd que exige input[type=date]. */
function fechaParaControl(valor) {
  var texto = String(valor || '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(texto)) return texto;

  var partes = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(texto);
  return partes ? partes[3] + '-' + partes[2] + '-' + partes[1] : '';
}

function fechaIsoLocal(fecha) {
  var dos = function (n) { return n < 10 ? '0' + n : String(n); };
  return fecha.getFullYear() + '-' + dos(fecha.getMonth() + 1) + '-' + dos(fecha.getDate());
}

function mananaIso() {
  var fecha = new Date();
  fecha.setDate(fecha.getDate() + 1);
  return fechaIsoLocal(fecha);
}

function estadoMenDe(docente) {
  if (docente && docente.radicadoMen) return MEN_RADICADO;
  return docente && docente.estadoMen ? docente.estadoMen : MEN_PENDIENTE;
}

function anunciar(texto) { $('anuncio').textContent = texto; }

/**
 * Muestra un aviso dentro de la interfaz.
 *
 * Con `persistente` en true el aviso no se desvanece y gana un botón para
 * cerrarlo. Los mensajes que explican QUE FALTA HACER son siempre
 * persistentes: desaparecer solos era la causa de que la gente no supiera
 * cuál era su siguiente paso.
 */
function mostrarAviso(nodo, tipo, texto, persistente) {
  if (nodo._temporizadorAviso) clearTimeout(nodo._temporizadorAviso);
  nodo.className = 'aviso aviso-' + tipo;
  vaciar(nodo);
  nodo.appendChild(document.createTextNode(texto));
  nodo.hidden = false;

  if (persistente || tipo === 'error' || tipo === 'aviso') {
    nodo._temporizadorAviso = null;
    if (persistente || tipo === 'aviso') {
      var cerrar = crear('button', 'btn-mini aviso-cerrar', 'Cerrar');
      cerrar.type = 'button';
      cerrar.setAttribute('aria-label', 'Cerrar este mensaje');
      cerrar.addEventListener('click', function () { ocultarAviso(nodo); });
      nodo.appendChild(cerrar);
    }
    return;
  }

  nodo._temporizadorAviso = setTimeout(function () { ocultarAviso(nodo); }, 12000);
}

/* ------------------------------------------------------------
   CONFIRMACION

   Un solo diálogo para todo lo que conviene pensar dos veces. Sustituye
   al doble clic con caducidad silenciosa que tenía la radicación, y
   añade la confirmación que le faltaba a "Enviar al revisor" — que es
   la acción de verdad irreversible, porque bloquea el expediente.
   ------------------------------------------------------------ */

function confirmar(opciones) {
  var dialogo = $('dialogoConfirmar');
  var aceptar = $('btnAceptarConfirmar');
  var cancelar = $('btnCancelarConfirmar');

  $('tituloConfirmar').textContent = opciones.titulo;
  $('cuerpoConfirmar').textContent = opciones.cuerpo;
  aceptar.textContent = opciones.textoConfirmar || 'Confirmar';
  cancelar.textContent = opciones.textoCancelar || 'Cancelar';
  aceptar.className = opciones.peligro ? 'btn-primario' : 'btn-primario';

  var cerrar = function () {
    aceptar.removeEventListener('click', alAceptar);
    cancelar.removeEventListener('click', alCancelar);
    dialogo.removeEventListener('cancel', alCancelar);
    if (dialogo.open) dialogo.close();
  };

  function alAceptar() {
    cerrar();
    if (opciones.alConfirmar) opciones.alConfirmar();
  }

  function alCancelar(evento) {
    if (evento) evento.preventDefault();
    cerrar();
    if (opciones.alCancelar) opciones.alCancelar();
  }

  aceptar.addEventListener('click', alAceptar);
  cancelar.addEventListener('click', alCancelar);
  dialogo.addEventListener('cancel', alCancelar);   // tecla Escape

  if (typeof dialogo.showModal === 'function') dialogo.showModal();
  else dialogo.setAttribute('open', 'open');
  aceptar.focus();
}

function ocultarAviso(nodo) {
  if (nodo._temporizadorAviso) clearTimeout(nodo._temporizadorAviso);
  nodo._temporizadorAviso = null;
  nodo.hidden = true;
  nodo.textContent = '';
}

function mostrarCapa(texto) {
  $('textoCarga').textContent = texto;
  $('capaCarga').classList.add('visible');
  $('capaCarga').setAttribute('aria-hidden', 'false');
  anunciar(texto);
}

function ocultarCapa() {
  $('capaCarga').classList.remove('visible');
  $('capaCarga').setAttribute('aria-hidden', 'true');
}

function esTalentoHumano() { return APP.perfil.rol === ROL_TALENTO_HUMANO; }
function esRevisor() { return APP.perfil.rol === ROL_REVISOR; }
function esConsulta() { return APP.perfil.rol === ROL_CONSULTA; }

function puedeEditarValidacion() {
  if (!FICHA || !esTalentoHumano()) return false;
  var estado = FICHA.guardado ? FICHA.guardado.estadoRevision : REV_POR_ENVIAR;
  return estado === REV_POR_ENVIAR || estado === REV_DEVUELTO;
}

/* ------------------------------------------------------------
   IDENTIDAD

   La pagina esta publicada en un sitio estatico, asi que quien
   autoriza no es el servidor de la pagina sino Google: al iniciar
   sesion entrega un token firmado que viaja en cada peticion y que
   Apps Script verifica. Sin token no se responde nada.

   El token NO se guarda en localStorage a proposito. Vive solo en
   memoria: cerrar la pestana cierra la sesion de la aplicacion.
   ------------------------------------------------------------ */

var SESION = { token: null, correo: '', rol: '' };
var INTENTOS_CARGA_GOOGLE = 50;
var ESPERA_CARGA_GOOGLE_MS = 200;

/**
 * Arranca el botón de Google y queda a la espera.
 *
 * La biblioteca de Google se descarga desde otro dominio. En conexiones
 * lentas puede terminar después de DOMContentLoaded, por lo que se espera
 * hasta diez segundos antes de mostrar un error real de carga.
 */
function iniciarPuerta(intento) {
  intento = intento || 0;

  if (!window.ID_CLIENTE_OAUTH) {
    mostrarAviso($('puertaError'), 'error',
      'La aplicación no está configurada: falta el identificador de cliente de Google. ' +
      'Avise al administrador.');
    return;
  }

  if (!window.google || !google.accounts || !google.accounts.id) {
    if (intento < INTENTOS_CARGA_GOOGLE) {
      setTimeout(function () {
        iniciarPuerta(intento + 1);
      }, ESPERA_CARGA_GOOGLE_MS);
      return;
    }

    mostrarAviso($('puertaError'), 'error',
      'No fue posible cargar el inicio de sesión de Google. ' +
      'Revise su conexión y actualice la página.');
    return;
  }

  google.accounts.id.initialize({
    client_id: window.ID_CLIENTE_OAUTH,
    callback: recibirCredencial,
    auto_select: true,
    cancel_on_tap_outside: false
  });

  google.accounts.id.renderButton($('botonGoogle'), {
    theme: 'outline',
    size: 'large',
    text: 'signin_with',
    shape: 'rectangular',
    locale: 'es',
    width: 280
  });

  // Si la persona ya tiene sesión de Google, entra sin pulsar nada.
  google.accounts.id.prompt();
}

/** Google entrega aquí el token de identidad. */
function recibirCredencial(respuesta) {
  if (!respuesta || !respuesta.credential) {
    mostrarAviso($('puertaError'), 'error', 'No se recibió la credencial de Google.');
    return;
  }

  SESION.token = respuesta.credential;
  SESION.correo = correoDelToken(respuesta.credential);

  ocultarAviso($('puertaError'));
  $('puertaTexto').textContent = 'Verificando su identidad...';

  // El servidor es quien decide de verdad: esta primera llamada sirve
  // tanto para cargar los datos como para validar la sesión.
  cargarDocentes();
}

/**
 * Lee el correo del token sin verificarlo, solo para mostrarlo en el
 * encabezado. La comprobación de verdad la hace el servidor: lo que se
 * lea aquí no autoriza nada.
 */
function correoDelToken(token) {
  try {
    var carga = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(carga)))).email || '';
  } catch (e) {
    return '';
  }
}

function abrirAplicacion() {
  $('puerta').hidden = true;
  if (SESION.correo) {
    $('sesionCorreo').textContent = SESION.correo;
    $('sesionRol').textContent = NOMBRES_ROL[APP.perfil.rol] || APP.perfil.rol || '';
    $('nombreRol').textContent = NOMBRES_ROL[APP.perfil.rol] || 'Acceso autorizado';
    actualizarSelectorRoles();
    $('sesion').hidden = false;
  }
}

/** Muestra el selector únicamente cuando la cuenta tiene más de un rol. */
function actualizarSelectorRoles() {
  var roles = Array.isArray(APP.perfil.roles) && APP.perfil.roles.length
    ? APP.perfil.roles
    : [APP.perfil.rol];
  var selector = $('selectorRol');
  selector.innerHTML = '';

  roles.forEach(function (rol) {
    var opcion = crear('option', '', NOMBRES_ROL[rol] || rol);
    opcion.value = rol;
    selector.appendChild(opcion);
  });

  selector.value = APP.perfil.rol;
  $('selectorRolContenedor').hidden = roles.length < 2;
}

/** Devuelve a la puerta de entrada, con un motivo. */
function cerrarSesion(motivo) {
  SESION.token = null;
  SESION.correo = '';
  SESION.rol = '';

  try {
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.disableAutoSelect();
    }
  } catch (e) { /* sin sesión de Google que cerrar */ }

  $('sesion').hidden = true;
  $('sesionRol').textContent = '';
  $('selectorRolContenedor').hidden = true;
  $('puerta').hidden = false;
  $('puertaTexto').textContent = 'Esta aplicación es de uso interno. ' +
    'Inicie sesión con su cuenta institucional para continuar.';

  if (motivo) mostrarAviso($('puertaError'), 'error', motivo);
  else ocultarAviso($('puertaError'));
}

/* ------------------------------------------------------------
   CONEXION CON EL SERVIDOR
   ------------------------------------------------------------ */

/**
 * Unica via hacia el servidor. Siempre lleva manejador de exito y de
 * fallo: ninguna operacion puede quedarse esperando para siempre.
 *
 * El cuerpo se manda como text/plain aunque sea JSON: asi el navegador
 * no hace la consulta previa de CORS (OPTIONS), que Apps Script no sabe
 * responder. Y sin cookies de Google, porque con varias cuentas abiertas
 * son ellas las que mandan la peticion a la sesion equivocada.
 */
function servidor(accion, argumento, exito, fallo) {
  // El simulador de la vista previa se anuncia así.
  if (window.SIMULADOR) {
    window.SIMULADOR(accion, argumento, exito, fallo);
    return;
  }

  if (!window.URL_SERVIDOR) {
    fallo('La aplicación no está configurada: falta la dirección del servidor.');
    return;
  }

  fetch(window.URL_SERVIDOR, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      token: SESION.token,
      rol: SESION.rol,
      accion: accion,
      argumento: argumento
    }),
    credentials: 'omit'
  })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (r) {
      if (r && r.ok) {
        try {
          exito(r.resultado);
        } catch (e) {
          console.error(e);
          fallo('Ocurrió un problema al mostrar la respuesta del servidor.');
        }
        return;
      }

      // El servidor rechazó la sesión: se vuelve a la puerta de entrada
      // en lugar de dejar a la persona ante un error que no puede resolver.
      if (r && r.sesion === 'INVALIDA') {
        cerrarSesion(r.error || 'Su sesión expiró. Vuelva a iniciar sesión.');
        return;
      }

      fallo((r && r.error) || SIN_CONEXION);
    }, function () {
      fallo(SIN_CONEXION);
    });
}

/* ------------------------------------------------------------
   ARRANQUE
   ------------------------------------------------------------ */

document.addEventListener('DOMContentLoaded', function () {
  conectarEventos();

  // En la vista previa no hay Google: se entra directo.
  if (window.SIMULADOR) {
    $('puerta').hidden = true;
    cargarDocentes();
    return;
  }

  iniciarPuerta();
});

function cargarDocentes() {
  $('listaCargando').hidden = false;
  $('listaVacia').hidden = true;
  ocultarAviso($('avisoGeneral'));
  mostrarVista('lista');

  servidor('obtenerDocentes', undefined, function (datos) {
    $('listaCargando').hidden = true;

    APP.auditoria  = datos.auditoria || '';
    APP.criterios  = datos.criterios || [];
    APP.requisitos = datos.requisitos || APP.requisitos;
    APP.perfil     = datos.perfil || APP.perfil;
    SESION.rol     = APP.perfil.rol || '';
    APP.docentes   = datos.docentes || [];
    APP.resumen    = datos.resumen || APP.resumen;

    if (APP.auditoria) $('nombreAuditoria').textContent = APP.auditoria;

    if (esTalentoHumano()) {
      $('tituloLista').textContent = 'Validación documental de docentes';
      $('descripcionLista').textContent =
        'Registre la comparación con los soportes y envíe cada docente al revisor. ' +
        'Los registros enviados quedan bloqueados hasta que sean aprobados o devueltos.';
    } else if (esRevisor()) {
      $('tituloLista').textContent = 'Bandeja de revisión';
      $('descripcionLista').textContent =
        'Compare los datos reportados y corregidos con el acta y el diploma. ' +
        'Revise cada criterio antes de aprobar o devolver el registro.';
    } else {
      $('tituloLista').textContent = 'Consulta del avance';
      $('descripcionLista').textContent =
        'Vista de solo lectura para consultar el avance general y el estado de los docentes. ' +
        'Esta cuenta no puede abrir fichas, modificar, enviar, aprobar ni devolver registros.';
    }

    configurarTableroRol();
    aplicarRequisitos();
    pintarIndicadores();
    marcarFiltro();
    pintarLista();

    // El servidor respondió, luego la sesión es válida: se abre la app.
    abrirAplicacion();
    anunciar('Listado cargado con ' + APP.docentes.length + ' docentes.');
  }, function (mensaje) {
    $('listaCargando').hidden = true;

    // Si aún no se ha entrado, el error va en la puerta: el aviso de
    // dentro quedaría tapado y la persona no vería nada.
    if (!$('puerta').hidden) {
      $('puertaTexto').textContent = 'Esta aplicación es de uso interno. ' +
        'Inicie sesión con su cuenta institucional para continuar.';
      mostrarAviso($('puertaError'), 'error', mensaje);
      return;
    }

    mostrarAviso($('avisoGeneral'), 'error',
      'No fue posible cargar la lista de docentes: ' + mensaje);
  });
}

function configurarTableroRol() {
  // Las diez cifras se muestran a los tres roles. Antes al revisor se le
  // ocultaban "Sin cargar" y "Borradores sin enviar" — justo al único rol
  // que rinde el informe de gestión — y Talento Humano no veía cuántos de
  // sus aprobados seguían sin radicar.
  Array.prototype.forEach.call(
    $('tiraIndicadores').querySelectorAll('[data-filtro]'),
    function (boton) { boton.hidden = false; });

  // El subfiltro de aprobados sobra: las cuatro cifras MEN son más precisas
  // y no se contradicen con ellas.
  $('panelInforme').hidden = !esRevisor();

  // Los tres pasos del trámite, para que Talento Humano sepa dónde termina
  // su parte y quién radica.
  $('guiaFlujo').hidden = !esTalentoHumano();

  if (!$('informeHasta').value) {
    var hoy = new Date();
    $('informeHasta').value = fechaIsoLocal(hoy);
    $('informeDesde').value = fechaIsoLocal(new Date(hoy.getFullYear(), hoy.getMonth(), 1));
  }
}

/** Marca el acta y el diploma como obligatorios u opcionales. */
function aplicarRequisitos() {
  var acta = $('marcaActa');
  if (APP.requisitos.actaObligatoria) {
    acta.className = 'obligatorio';
    acta.textContent = '*';
  } else {

    acta.textContent = 'Opcional';
  }

  var diploma = $('marcaDiploma');
  if (APP.requisitos.diplomaObligatorio) {
    diploma.className = 'obligatorio';
    diploma.textContent = '*';
  } else {
    diploma.className = 'opcional';
    diploma.textContent = 'Opcional';
  }
}

/* ------------------------------------------------------------
   EVENTOS
   ------------------------------------------------------------ */

function conectarEventos() {
  $('btnSalir').addEventListener('click', function () {
    protegerCambios(function () {
      FICHA = null;
      mostrarVista('lista');
      cerrarSesion('');
    });
  });

  $('selectorRol').addEventListener('change', function () {
    var selector = this;
    var nuevoRol = selector.value;
    var permitidos = APP.perfil.roles || [];
    if (permitidos.indexOf(nuevoRol) === -1 || nuevoRol === SESION.rol) return;

    protegerCambios(function () {
      SESION.rol = nuevoRol;
      FICHA = null;
      FILTRO = 'TODOS';
      mostrarVista('lista');
      cargarDocentes();
    }, function () {
      // Si decide seguir editando, el desplegable vuelve a su rol real.
      selector.value = SESION.rol;
    });
  });

  $('buscador').addEventListener('input', pintarLista);

  $('tiraIndicadores').addEventListener('click', function (evento) {
    var boton = evento.target.closest('[data-filtro]');
    if (boton) aplicarFiltro(boton.getAttribute('data-filtro'));
  });


  // Delegacion: los botones del listado se crean y destruyen al filtrar.
  $('listaDocentes').addEventListener('click', function (evento) {
    var boton = evento.target.closest('button[data-documento]');
    if (!boton) return;
    if (boton.getAttribute('data-accion') === 'enviar-revision') {
      enviarRevisionDesdeLista(boton);
      return;
    }
    if (boton.getAttribute('data-accion') === 'subsanar-men') {
      abrirDialogoSubsanacion(boton.getAttribute('data-documento'));
      return;
    }
    if (boton.getAttribute('data-accion') === 'radicar-men') {
      confirmarRadicadoMenDesdeLista(boton);
      return;
    }
    abrirFicha(boton.getAttribute('data-documento'));
  });

  $('btnVolver').addEventListener('click', function () { volverAlListado(); });
  $('btnGuardar').addEventListener('click', function () { guardarRevision(false); });
  $('btnEditar').addEventListener('click', entrarEnEdicion);
  $('btnCancelarEdicion').addEventListener('click', cancelarEdicion);
  $('btnEnviarRevision').addEventListener('click', enviarRevision);
  $('btnGuardarEnviar').addEventListener('click', function () { guardarRevision(true); });
  $('btnDescargarInforme').addEventListener('click', descargarInformeGestion);
  $('btnAbrirTablero').addEventListener('click', abrirTablero);
  $('btnVolverTablero').addEventListener('click', function () { mostrarVista('lista'); });
  $('btnImprimirTablero').addEventListener('click', function () { window.print(); });
  $('btnCancelarSubsanacion').addEventListener('click', cerrarDialogoSubsanacion);
  $('formSubsanacion').addEventListener('submit', confirmarSubsanacion);
  $('btnAprobar').addEventListener('click', function () { decidirRevision(REV_APROBADO); });
  $('btnDevolver').addEventListener('click', function () { decidirRevision(REV_DEVUELTO); });
  $('tabActa').addEventListener('click', function () { mostrarDocumento('acta'); });
  $('tabDiploma').addEventListener('click', function () { mostrarDocumento('diploma'); });

  // El formulario no envía nada por sí mismo: guardar es siempre un clic
  // deliberado en su botón. Así Enter dentro de un campo de corrección no
  // interrumpe la captura.
  $('formRevision').addEventListener('submit', function (evento) {
    evento.preventDefault();
  });

  // Última red: cerrar la pestaña con trabajo sin guardar.
  window.addEventListener('beforeunload', function (evento) {
    if (!hayCambiosPendientes()) return;
    evento.preventDefault();
    evento.returnValue = '';
  });

  $('listaCriterios').addEventListener('change', function (evento) {
    var opcion = evento.target.closest('.criterio');
    if (opcion && evento.target.type === 'radio') {
      refrescarCriterio(opcion);
      return;
    }

    var bloque = evento.target.closest('.correccion');
    if (bloque && evento.target.tagName === 'SELECT' && evento.target.value) {
      bloque.classList.remove('con-error');
    }
  });

  $('listaCriterios').addEventListener('input', function (evento) {
    if (evento.target.tagName !== 'INPUT' ||
        (evento.target.type !== 'text' && evento.target.type !== 'date')) return;
    var bloque = evento.target.closest('.correccion');
    if (bloque && evento.target.value.trim()) bloque.classList.remove('con-error');
  });

  $('archivoActa').addEventListener('change', function () {
    recibirArchivo('acta', this, 'acta de grado');
  });

  $('archivoDiploma').addEventListener('change', function () {
    recibirArchivo('diploma', this, 'diploma de grado');
  });
}

function pintarIndicadores() {

function pintarLista() {
  var contenedor = $('listaDocentes');
  var texto = plano($('buscador').value.trim());
  vaciar(contenedor);

  // Primero el estado y despues el texto, para poder decir "3 de 12
  // pendientes" en lugar de "3 de 50".
  var delEstado = APP.docentes.filter(function (d) {
    if (FILTRO === 'TODOS') return true;
    if (FILTRO === REV_PENDIENTE_CARGA) return d.tieneValidacion === false;
    if (FILTRO === REV_POR_ENVIAR) {
      return d.tieneValidacion !== false &&
        (d.estadoRevision || REV_POR_ENVIAR) === REV_POR_ENVIAR;
    }
    if (FILTRO === 'MEN_PENDIENTE') {
      return d.estadoRevision === REV_APROBADO && estadoMenDe(d) === MEN_PENDIENTE;
    }
    if (FILTRO === 'MEN_SUBSANACION') {
      return d.estadoRevision === REV_APROBADO && estadoMenDe(d) === MEN_SUBSANACION;
    }
    if (FILTRO === 'MEN_LISTO') {
      return d.estadoRevision === REV_APROBADO && estadoMenDe(d) === MEN_LISTO;
    }
    if (FILTRO === 'MEN_RADICADO') {
      return d.estadoRevision === REV_APROBADO && estadoMenDe(d) === MEN_RADICADO;
    }
    return (d.estadoRevision || REV_POR_ENVIAR) === FILTRO;
  });

  var aprobadosPendientes = delEstado.filter(function (d) { return !d.radicadoMen; }).length;
  var aprobadosRadicados = delEstado.filter(function (d) { return !!d.radicadoMen; }).length;
  if (FILTRO === REV_APROBADO) {
    // Los pendientes de radicar primero: es lo que exige acción.
    delEstado.sort(function (a, b) {
      var porRadicado = Number(!!a.radicadoMen) - Number(!!b.radicadoMen);
      return porRadicado || String(a.nombreCompleto || '').localeCompare(
        String(b.nombreCompleto || ''), 'es');
    });
  }

  if (FILTRO === 'TODOS') {
    delEstado.sort(function (a, b) {
      var prioridad = function (d) {
        var revision = d.tieneValidacion === false ? REV_PENDIENTE_CARGA : d.estadoRevision;
        if (esRevisor()) {
          if (revision === REV_EN_REVISION) return 0;
          if (revision === REV_APROBADO && estadoMenDe(d) === MEN_LISTO) return 1;
          if (revision === REV_APROBADO && estadoMenDe(d) === MEN_PENDIENTE) return 2;
          if (revision === REV_APROBADO && estadoMenDe(d) === MEN_SUBSANACION) return 3;
          if (revision === REV_DEVUELTO) return 4;
          if (revision === REV_APROBADO) return 6;
          return 5;
        }
        if (esTalentoHumano()) {
          if (revision === REV_DEVUELTO) return 0;
          if (revision === REV_POR_ENVIAR) return 1;
          if (revision === REV_PENDIENTE_CARGA) return 2;
          if (revision === REV_EN_REVISION) return 3;
          return 4;
        }
        return 0;
      };
      var diferencia = prioridad(a) - prioridad(b);
      return diferencia || String(a.nombreCompleto || '').localeCompare(
        String(b.nombreCompleto || ''), 'es');
    });
  }

  var visibles = delEstado.filter(function (d) {
    if (!texto) return true;
    return plano(d.nombreCompleto).indexOf(texto) !== -1 ||
           plano(d.documento).indexOf(texto) !== -1;
  });

  visibles.forEach(function (d) { contenedor.appendChild(tarjetaDocente(d)); });

  $('listaVacia').hidden = visibles.length > 0 || APP.docentes.length === 0;
  $('listaVacia').textContent = texto
    ? 'No hay docentes que coincidan con la búsqueda.'
    : 'No hay docentes en este estado.';

  pintarConteo(visibles.length, delEstado.length, texto);
}

/** Linea bajo el buscador: cuantos se ven y como volver a verlos todos. */
function pintarConteo(visibles, delEstado, texto) {
  var nodo = $('conteoResultados');
  vaciar(nodo);
  if (!APP.docentes.length) return;

  var frase;
  if (FILTRO === 'TODOS') {
    frase = texto
      ? 'Mostrando ' + visibles + ' de ' + APP.docentes.length + ' docentes.'
      : 'Mostrando los ' + APP.docentes.length + ' docentes de la auditoría.';
  } else if (texto) {
    frase = 'Mostrando ' + visibles + ' de ' + delEstado + ' ' + NOMBRES_GRUPO[FILTRO] + '.';
  } else {
    frase = 'Mostrando ' + delEstado + ' ' +
      (delEstado === 1 ? 'docente' : 'docentes') + ' ' +
      (delEstado === 1 ? NOMBRES_GRUPO_SINGULAR[FILTRO] : NOMBRES_GRUPO[FILTRO]) + '.';
  }

  nodo.appendChild(document.createTextNode(frase + ' '));

  if (FILTRO !== 'TODOS' || texto) {
    var limpiar = crear('button', 'btn-mini', 'Ver todos');
    limpiar.type = 'button';
    limpiar.addEventListener('click', function () {
      FILTRO = 'TODOS';
      $('buscador').value = '';
      marcarFiltro();
      pintarLista();
    });
    nodo.appendChild(limpiar);
  }
}

/** Aplica un filtro por estado desde las cifras de arriba. */
function aplicarFiltro(estado) {
  // Volver a pulsar la misma cifra quita el filtro.
  FILTRO = (FILTRO === estado) ? 'TODOS' : estado;
  marcarFiltro();
  pintarLista();
  anunciar(FILTRO === 'TODOS'
    ? 'Mostrando todos los docentes.'
    : 'Filtrando por ' + NOMBRES_GRUPO[FILTRO] + '.');
}


/** Sincroniza el aspecto de las cifras con el filtro vigente. */
function marcarFiltro() {
  Array.prototype.forEach.call(
    $('tiraIndicadores').querySelectorAll('[data-filtro]'),
    function (boton) {
      var activo = boton.getAttribute('data-filtro') === FILTRO;
      boton.classList.toggle('activo', activo);
      boton.setAttribute('aria-pressed', activo ? 'true' : 'false');
    });
}

function tarjetaDocente(docente) {
  var estado = docente.estadoRevision || REV_POR_ENVIAR;
  var estadoVisual = docente.tieneValidacion === false ? REV_PENDIENTE_CARGA : estado;

  var fila = crear('article', 'docente docente-' + estadoVisual);

  var datos = crear('div', 'docente-datos');
  datos.appendChild(crear('p', 'docente-nombre', docente.nombreCompleto || '(sin nombre)'));
  datos.appendChild(crear('p', 'docente-documento',
    (docente.tipoDocumento || 'CC') + ' ' + docente.documento));
  var referenciaFecha = estado === REV_EN_REVISION ? docente.fechaEnvio
    : estado === REV_DEVUELTO || estado === REV_APROBADO ? docente.fechaRevision
      : docente.fechaModificacion;
  if (referenciaFecha) {
    datos.appendChild(crear('p', 'docente-meta-operativa', 'En este estado desde: ' + referenciaFecha));
  }
  fila.appendChild(datos);

  var acciones = crear('div', 'docente-acciones');
  if (docente.estado === ESTADO_CORRECCION && estado !== REV_APROBADO) {
    var correccion = crear('span', 'insignia insignia-REQUIERE_CORRECCION',
      'Requiere corrección');
    correccion.title = 'Talento Humano registró uno o más datos diferentes a lo reportado en SNIES.';
    acciones.appendChild(correccion);
  } else if (docente.estado === ESTADO_CORRECCION && estado === REV_APROBADO) {
    acciones.appendChild(crear('span', 'insignia insignia-ajuste', 'Con ajuste del revisor'));
  }
  acciones.appendChild(insignia(estadoVisual));

  if (estado === REV_APROBADO) {
    var men = estadoMenDe(docente);
    var claseMen = men === MEN_RADICADO ? 'insignia-radicado-men'
      : men === MEN_SUBSANACION ? 'insignia-men-subsanacion'
        : men === MEN_LISTO ? 'insignia-men-listo' : 'insignia-men-pendiente';
    var textoMen = NOMBRES_MEN[men] || NOMBRES_MEN.PENDIENTE;
    if (men === MEN_SUBSANACION && docente.fechaDisponibleRadicacion) {
      textoMen += ' · disponible desde ' + docente.fechaDisponibleRadicacion;
    }
    if (men === MEN_RADICADO) textoMen += ' ✓';
    acciones.appendChild(crear('span', 'insignia ' + claseMen, textoMen));
  }

  if (esConsulta()) {
    // Sin botón a propósito: el servidor no permite a esta cuenta abrir
    // fichas. Decirlo es más honesto que un botón que fallaría.
    acciones.appendChild(crear('span', 'nota-accion', 'Solo consulta'));
    fila.appendChild(acciones);
    return fila;
  }

  var tieneValidacion = (docente.estado || ESTADO_PENDIENTE) !== ESTADO_PENDIENTE;
  var textoBoton = esTalentoHumano() && !tieneValidacion ? 'Validar' : 'Ver detalle';
  if (esTalentoHumano() && estado === REV_DEVUELTO) textoBoton = 'Corregir y reenviar';
  if (esRevisor() && estado === REV_EN_REVISION) textoBoton = 'Revisar';
  var boton = crear('button',
    'btn-compacto ' + ((esTalentoHumano() && !tieneValidacion) ||
      (esRevisor() && estado === REV_EN_REVISION) ? 'btn-primario' : 'btn-secundario'),
    textoBoton);
  boton.type = 'button';
  boton.setAttribute('data-documento', docente.documento);
  boton.setAttribute('aria-label',
    textoBoton + ' de ' + docente.nombreCompleto);
  acciones.appendChild(boton);

  if (esTalentoHumano() && tieneValidacion && estado === REV_POR_ENVIAR) {
    var enviar = crear('button', 'btn-compacto btn-primario', 'Enviar al revisor');
    enviar.type = 'button';
    enviar.setAttribute('data-documento', docente.documento);
    enviar.setAttribute('data-version', String(docente.version || 0));
    enviar.setAttribute('data-accion', 'enviar-revision');
    acciones.appendChild(enviar);
  }

  if (esRevisor() && estado === REV_APROBADO) {
    var estadoMen = estadoMenDe(docente);
    if (estadoMen === MEN_PENDIENTE || estadoMen === MEN_LISTO) {
      // Un expediente ya vencido puede volver a aplazarse: el texto lo
      // dice para que no parezca que se está empezando de cero.
      var subsanar = crear('button', 'btn-compacto btn-secundario',
        estadoMen === MEN_LISTO ? 'Volver a subsanación' : 'Poner en subsanación');
      subsanar.type = 'button';
      subsanar.setAttribute('data-documento', docente.documento);
      subsanar.setAttribute('data-accion', 'subsanar-men');
      acciones.appendChild(subsanar);
    }
    if (estadoMen === MEN_SUBSANACION) {
      // No hay botón porque el servidor rechazaría la radicación hasta que
      // venza la fecha. Lo que faltaba era decirlo.
      acciones.appendChild(crear('span', 'nota-accion',
        docente.fechaDisponibleRadicacion
          ? 'Se libera solo el ' + docente.fechaDisponibleRadicacion
          : 'Esperando la fecha de subsanación'));
    }
    if (estadoMen === MEN_PENDIENTE || estadoMen === MEN_LISTO) {
      var radicar = crear('button', 'btn-compacto btn-radicado-men', 'Marcar como radicado');
      radicar.type = 'button';
      radicar.setAttribute('data-documento', docente.documento);
      radicar.setAttribute('data-version', String(docente.version || 0));
      radicar.setAttribute('data-accion', 'radicar-men');
      radicar.setAttribute('aria-label', 'Marcar como radicado MEN a ' + docente.nombreCompleto);
      acciones.appendChild(radicar);
    }
  }

  fila.appendChild(acciones);
  return fila;
}

function insignia(estado) {
  return crear('span', 'insignia insignia-' + estado,
    NOMBRES_REVISION[estado] || NOMBRES_REVISION.POR_ENVIAR);
}

/* ------------------------------------------------------------
   FICHA: APERTURA
   ------------------------------------------------------------ */

function abrirFicha(documento) {
  // El nombre ya está en el listado: se usa para que la pantalla de carga
  // diga a quién se está abriendo, en lugar de anunciar una "revisión" que
  // en el caso de un docente sin validar todavía no existe.
  var enLista = APP.docentes.filter(function (d) { return d.documento === documento; })[0];
  var textoCarga = enLista && enLista.nombreCompleto
    ? 'Abriendo la ficha de ' + enLista.nombreCompleto + '...'
    : 'Abriendo ficha del docente...';

  mostrarVista('ficha');

  $('fichaCargando').querySelector('p').textContent = textoCarga;
  $('fichaCargando').hidden = false;
  $('fichaContenido').hidden = true;
  ocultarAviso($('fichaError'));
  ocultarAviso($('avisoGuardado'));
  anunciar(textoCarga);

  servidor('obtenerValidacion', documento, function (datos) {
    $('fichaCargando').hidden = true;

    if (!datos || !datos.docente) {
      mostrarAviso($('fichaError'), 'error',
        'El servidor no devolvió la información del docente. Vuelva al listado e intente de nuevo.');
      return;
    }

    FICHA = {
      documento: datos.docente.documento,
      docente: datos.docente,
      guardado: datos.existe ? datos.validacion : null,
      modo: datos.existe || !esTalentoHumano() ? 'consulta' : 'nueva',
      archivos: { acta: null, diploma: null },
      quitarDiploma: false,
      guardando: false
    };

    $('fichaContenido').hidden = false;
    pintarFicha();
    anunciar('Ficha de ' + FICHA.docente.nombreCompleto + ' cargada.');
  }, function (mensaje) {
    // Pase lo que pase, la ficha no se queda en "Abriendo...".
    $('fichaCargando').hidden = true;
    $('fichaContenido').hidden = true;
    mostrarAviso($('fichaError'), 'error', 'No fue posible abrir la ficha: ' + mensaje);
  });
}

/**
 * Vuelve al listado. Con `forzar` en true no pregunta nada: lo usan los
 * callbacks de exito, donde el trabajo ya esta a salvo en el servidor.
 */
function volverAlListado(forzar) {
  var salir = function () {
    FICHA = null;
    pintarLista();
    mostrarVista('lista');
  };
  if (forzar === true) salir();
  else protegerCambios(salir);
}

/* ------------------------------------------------------------
   PROTECCION DEL TRABAJO SIN GUARDAR

   Una ficha a medio llenar son diez criterios y puede que un PDF ya
   elegido. Antes se perdia en silencio al volver al listado, al cerrar
   sesion o al cambiar de rol.
   ------------------------------------------------------------ */

/** true si la ficha abierta tiene algo que el servidor todavia no sabe. */
function hayCambiosPendientes() {
  if (!FICHA || FICHA.modo === 'consulta') return false;
  if (FICHA.archivos && (FICHA.archivos.acta || FICHA.archivos.diploma)) return true;
  if (FICHA.quitarDiploma) return true;

  // Sin formulario en pantalla no hay nada que comparar.
  if (!$('listaCriterios').querySelector('.criterio')) return false;

  var actual = recolectar();
  var guardado = FICHA.guardado;

  if (!guardado) {
    // Ficha nueva: basta con que haya tocado un criterio o las observaciones.
    if (actual.observaciones) return true;
    return Object.keys(actual.criterios).some(function (clave) {
      return actual.criterios[clave].valor || actual.criterios[clave].correccion;
    });
  }

  if ((actual.observaciones || '') !== (guardado.observaciones || '')) return true;

  return Object.keys(actual.criterios).some(function (clave) {
    var previo = (guardado.criterios && guardado.criterios[clave]) || {};
    return actual.criterios[clave].valor !== (previo.valor || '') ||
           actual.criterios[clave].correccion !== (previo.correccion || '');
  });
}

/**
 * Ejecuta `accion`, pero si hay trabajo sin guardar pregunta primero.
 * `alCancelar` permite deshacer el gesto que disparo la salida (por
 * ejemplo devolver el selector de rol a su valor anterior).
 */
function protegerCambios(accion, alCancelar) {
  if (!hayCambiosPendientes()) {
    accion();
    return;
  }

  var nombre = FICHA && FICHA.docente ? FICHA.docente.nombreCompleto : 'este docente';
  confirmar({
    titulo: 'Hay cambios sin guardar',
    cuerpo: 'La ficha de ' + nombre + ' tiene cambios que todavía no se han ' +
            'guardado. Si sale ahora se perderán.',
    textoConfirmar: 'Descartar y salir',
    textoCancelar: 'Seguir editando',
    peligro: true,
    alConfirmar: accion,
    alCancelar: alCancelar
  });
}

/* ------------------------------------------------------------
   PANEL DE ETAPA

   Responde tres preguntas en el mismo sitio y siempre arriba:
   dónde está el expediente, qué significa eso, y qué toca hacer.

   Antes, el motivo de una devolución vivía en un textarea deshabilitado
   al final de la ficha, después del visor de PDF, y el motivo de una
   subsanación no se mostraba en ninguna parte de la aplicación.
   ------------------------------------------------------------ */

function pintarPanelEtapa(estadoRevision) {
  var panel = $('panelEtapa');
  vaciar(panel);

  var v = FICHA.guardado;
  var estadoMen = v && estadoRevision === REV_APROBADO
    ? (v.estadoMen || (v.radicadoMen ? MEN_RADICADO : MEN_PENDIENTE))
    : '';

  var etapa = describirEtapa_(estadoRevision, estadoMen, v);
  if (!etapa) {
    panel.hidden = true;
    return;
  }

  panel.className = 'panel-etapa panel-etapa-' + etapa.tono;

  var titulo = crear('h3', null, etapa.titulo);
  titulo.id = 'panelEtapaTitulo';
  panel.appendChild(titulo);

  etapa.parrafos.forEach(function (texto) {
    if (texto) panel.appendChild(crear('p', null, texto));
  });

  if (etapa.cita) {
    var cita = crear('blockquote', 'panel-etapa-cita');
    cita.appendChild(crear('p', null, etapa.cita));
    if (etapa.citaPie) cita.appendChild(crear('footer', null, etapa.citaPie));
    panel.appendChild(cita);
  }

  if (etapa.lista && etapa.lista.length) {
    var ul = crear('ul', 'panel-etapa-lista');
    etapa.lista.forEach(function (item) { ul.appendChild(crear('li', null, item)); });
    panel.appendChild(ul);
  }

  panel.hidden = false;
}

/** Devuelve { tono, titulo, parrafos[], cita, citaPie, lista[] } o null. */
function describirEtapa_(estadoRevision, estadoMen, v) {
  var quien = esTalentoHumano() ? 'th' : esRevisor() ? 'rev' : 'consulta';

  /* --- Etapa MEN: aplica a cualquiera que mire un aprobado --- */
  if (estadoMen === MEN_SUBSANACION) {
    return {
      tono: 'espera',
      titulo: 'En subsanación · no hay que hacer nada todavía',
      parrafos: [
        v.fechaDisponibleRadicacion
          ? 'Este expediente pasará automáticamente a «Listo para radicar» el ' +
            v.fechaDisponibleRadicacion + '. Hasta entonces el sistema no permite radicarlo.'
          : 'Este expediente está en subsanación y todavía no se puede radicar.'
      ],
      cita: v.motivoSubsanacion || '',
      citaPie: v.subsanacionPor
        ? 'Motivo registrado por ' + v.subsanacionPor +
          (v.fechaSubsanacion ? ' el ' + v.fechaSubsanacion : '')
        : ''
    };
  }

  if (estadoMen === MEN_LISTO) {
    return {
      tono: 'accion',
      titulo: 'Listo para radicar ante el MEN',
      parrafos: [
        quien === 'rev'
          ? 'La fecha de subsanación ya venció. Radique el expediente en la plataforma ' +
            'del Ministerio y después vuelva aquí y márquelo como radicado. Si todavía ' +
            'no puede radicarlo, vuelva a ponerlo en subsanación con una fecha nueva.'
          : 'La fecha de subsanación ya venció. El revisor puede radicarlo ante el MEN.'
      ],
      cita: v.motivoSubsanacion || '',
      citaPie: v.motivoSubsanacion ? 'Motivo de la subsanación que acaba de vencer' : ''
    };
  }

  if (estadoMen === MEN_RADICADO) {
    return {
      tono: 'cerrado',
      titulo: 'Radicado ante el MEN',
      parrafos: ['El trámite de este docente está cerrado.' +
        (v.radicadoPor ? ' Lo radicó ' + v.radicadoPor : '') +
        (v.fechaRadicacionMen ? ' el ' + v.fechaRadicacionMen + '.' : '.')]
    };
  }

  if (estadoMen === MEN_PENDIENTE) {
    return {
      tono: 'accion',
      titulo: quien === 'rev'
        ? 'Aprobado · falta radicarlo ante el MEN'
        : 'Aprobado · Talento Humano ya terminó con este docente',
      parrafos: [
        quien === 'rev'
          ? 'Radíquelo en la plataforma del Ministerio y después vuelva aquí y márquelo ' +
            'como radicado. Si todavía no puede radicarlo, póngalo en subsanación con la ' +
            'fecha en que sí podrá.'
          : 'La radicación ante el MEN la realiza el revisor, en la plataforma del ' +
            'Ministerio, fuera de esta aplicación. Usted no tiene que hacer nada más ' +
            'con este docente.'
      ]
    };
  }

  /* --- Etapa de revisión interna --- */
  if (estadoRevision === REV_DEVUELTO) {
    var noConformes = [];
    if (v && v.revisionCriterios) {
      APP.criterios.forEach(function (c) {
        if (v.revisionCriterios[c.clave] === 'NO_CONFORME') noConformes.push(c.etiqueta);
      });
    }
    return {
      tono: 'atencion',
      titulo: quien === 'th'
        ? 'Devuelto para corregir · le toca a usted'
        : 'Devuelto a Talento Humano',
      parrafos: [
        quien === 'th'
          ? 'El revisor encontró diferencias. Corrija lo señalado y vuelva a enviarlo.'
          : 'Este expediente está en manos de Talento Humano.'
      ],
      cita: (v && v.observacionRevision) || '',
      citaPie: v && v.revisadoPor
        ? 'Observación de ' + v.revisadoPor + (v.fechaRevision ? ' el ' + v.fechaRevision : '')
        : '',
      lista: noConformes.length
        ? ['Criterios marcados como no conformes:'].concat(noConformes)
        : []
    };
  }

  if (estadoRevision === REV_EN_REVISION) {
    return {
      tono: 'espera',
      titulo: quien === 'rev' ? 'Pendiente de su decisión' : 'En manos del revisor',
      parrafos: [
        quien === 'rev'
          ? 'Compare cada dato con los soportes y apruebe o devuelva el expediente.'
          : 'Ya lo envió' + (v && v.fechaEnvio ? ' el ' + v.fechaEnvio : '') +
            '. No requiere ninguna acción suya hasta que el revisor lo apruebe o lo devuelva.'
      ]
    };
  }

  if (estadoRevision === REV_POR_ENVIAR && quien === 'th') {
    return {
      tono: 'accion',
      titulo: v ? 'Borrador guardado · falta enviarlo al revisor'
                : 'Sin cargar · empiece por validar los datos',
      parrafos: [
        v ? 'Este expediente sigue en su bandeja. El revisor no lo ve hasta que pulse ' +
            '«Enviar al revisor».'
          : 'Compare cada dato reportado a SNIES con los soportes, cargue el acta de grado ' +
            'y envíelo al revisor.'
      ]
    };
  }

  return null;
}

/* ------------------------------------------------------------
   FICHA: DIBUJO
   ------------------------------------------------------------ */

function pintarFicha() {
  if (!FICHA) return;

  var formularioEditable = esTalentoHumano() &&
    (FICHA.modo === 'nueva' || FICHA.modo === 'edicion') && puedeEditarValidacion();
  var estadoDato = FICHA.guardado ? FICHA.guardado.estado : ESTADO_PENDIENTE;
  var estadoRevision = FICHA.guardado ? FICHA.guardado.estadoRevision : REV_POR_ENVIAR;

  /* --- Cabecera --- */
  $('fichaNombre').textContent = FICHA.docente.nombreCompleto || '(sin nombre)';
  $('fichaDocumento').textContent =
    (FICHA.docente.tipoDocumento || 'CC') + ' ' + FICHA.docente.documento;

  var marca = $('fichaInsignia');
  marca.className = 'insignia insignia-' + estadoRevision;
  marca.textContent = NOMBRES_REVISION[estadoRevision] || NOMBRES_REVISION.POR_ENVIAR;

  // La segunda insignia cambia de significado según la etapa, así que su
  // micro-rótulo también: sin él, dos insignias contiguas e idénticas
  // decían cosas distintas sin avisar.
  var marcaDato = $('fichaInsigniaDato');
  if (estadoRevision === REV_APROBADO) {
    var estadoMenFicha = FICHA.guardado.estadoMen ||
      (FICHA.guardado.radicadoMen ? MEN_RADICADO : MEN_PENDIENTE);
    marcaDato.className = 'insignia ' + (estadoMenFicha === MEN_RADICADO
      ? 'insignia-radicado-men'
      : estadoMenFicha === MEN_SUBSANACION ? 'insignia-men-subsanacion'
        : estadoMenFicha === MEN_LISTO ? 'insignia-men-listo' : 'insignia-men-pendiente');
    marcaDato.textContent = NOMBRES_MEN[estadoMenFicha] || NOMBRES_MEN.PENDIENTE;
    $('rotuloInsigniaDato').textContent = 'MEN';
  } else {
    marcaDato.className = 'insignia insignia-' + estadoDato;
    marcaDato.textContent = NOMBRES_ESTADO[estadoDato] || NOMBRES_ESTADO.PENDIENTE;
    $('rotuloInsigniaDato').textContent = 'Datos';
  }

  $('btnEditar').hidden = !(FICHA.modo === 'consulta' && FICHA.guardado && puedeEditarValidacion());

  /* --- En qué punto está y qué toca hacer --- */
  pintarPanelEtapa(estadoRevision);

  /* --- Marcas de la revision guardada --- */
  pintarMarcas();

  /* --- Cinta de modo --- */
  var cinta = $('cintaModo');
  if (esConsulta()) {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      'Vista de solo consulta. Puede revisar el avance y los documentos, pero no modificar ni decidir registros.';
  } else if (esRevisor() && estadoRevision === REV_EN_REVISION) {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      'Registro enviado por Talento Humano. Compare cada dato con los soportes antes de decidir.';
  } else if (esRevisor()) {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      'Este registro no está pendiente de decisión. Se muestra en modo de consulta.';
  } else if (FICHA.modo === 'consulta' && estadoRevision === REV_EN_REVISION) {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      'Registro enviado al revisor. La edición está bloqueada hasta que sea aprobado o devuelto.';
  } else if (FICHA.modo === 'consulta' && estadoRevision === REV_APROBADO) {
    cinta.hidden = false;
    $('cintaModoTexto').textContent = 'Registro aprobado y cerrado para edición.';
  } else if (FICHA.modo === 'consulta') {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      estadoRevision === REV_DEVUELTO
        ? 'El revisor devolvió este registro. Revise el resultado al final de la ficha, corrija y envíe nuevamente.'
        : 'Validación guardada. Puede editarla o enviarla al revisor.';
  } else if (FICHA.modo === 'edicion') {
    cinta.hidden = false;
    $('cintaModoTexto').textContent =
      'Está editando una revisión guardada. Al guardar se actualizará el registro existente, ' +
      'sin crear uno nuevo.';
  } else {
    cinta.hidden = true;
    $('cintaModoTexto').textContent = '';
  }

  /* --- Cuerpo --- */
  pintarCriterios();
  pintarSoportes();
  pintarPrevisualizacion();
  pintarPanelRevisor();

  $('observaciones').value = FICHA.guardado ? (FICHA.guardado.observaciones || '') : '';
  $('camposRevision').disabled = !formularioEditable;

  /* --- Navegacion --- */
  var puedeEnviar = esTalentoHumano() && FICHA.guardado && FICHA.modo === 'consulta' &&
    (estadoRevision === REV_POR_ENVIAR || estadoRevision === REV_DEVUELTO);
  $('navegacionFicha').hidden = !formularioEditable && !puedeEnviar;
  $('btnCancelarEdicion').hidden = FICHA.modo !== 'edicion';
  $('btnGuardar').hidden = !formularioEditable;
  $('btnGuardarEnviar').hidden = !formularioEditable;
  $('btnEnviarRevision').hidden = !puedeEnviar;
  $('btnGuardar').textContent = 'Guardar borrador';
  $('btnGuardarEnviar').textContent = 'Guardar y enviar a revisión';
  $('btnGuardar').disabled = false;
  $('btnGuardarEnviar').disabled = false;

  ocultarAviso($('avisoGuardado'));
}

function pintarMarcas() {
  var caja = $('fichaMarcas');
  vaciar(caja);

  if (!FICHA.guardado) {
    caja.hidden = true;
    return;
  }

  var cabecera = crear('div', 'ficha-marcas-cabecera');
  var textosCabecera = crear('div');
  textosCabecera.appendChild(crear('p', 'ficha-marcas-titulo', 'Trazabilidad del registro'));
  textosCabecera.appendChild(crear('p', 'ficha-marcas-nota', 'Fechas registradas en hora de Colombia'));
  cabecera.appendChild(textosCabecera);
  caja.appendChild(cabecera);

  var pasos = [
    {
      titulo: 'Validación registrada',
      valor: FICHA.guardado.fechaValidacion,
      detalle: 'Registro inicial',
      completo: !!FICHA.guardado.fechaValidacion
    },
    {
      titulo: 'Última actualización',
      valor: FICHA.guardado.fechaModificacion,
      detalle: FICHA.guardado.guardadoPor,
      completo: !!FICHA.guardado.fechaModificacion
    },
    {
      titulo: 'Envío a revisión',
      valor: FICHA.guardado.fechaEnvio,
      detalle: FICHA.guardado.enviadoPor,
      completo: !!FICHA.guardado.fechaEnvio
    },
    {
      titulo: 'Decisión del revisor',
      valor: FICHA.guardado.fechaRevision,
      detalle: FICHA.guardado.revisadoPor,
      completo: !!FICHA.guardado.fechaRevision
    },
    {
      titulo: 'Radicado MEN',
      valor: FICHA.guardado.fechaRadicacionMen,
      detalle: FICHA.guardado.radicadoPor,
      completo: !!FICHA.guardado.radicadoMen
    }
  ];

  if (FICHA.guardado.fechaSubsanacion) {
    pasos.splice(pasos.length - 1, 0, {
      titulo: FICHA.guardado.estadoMen === MEN_LISTO ? 'Subsanación cumplida' : 'Subsanación MEN',
      valor: FICHA.guardado.fechaSubsanacion,
      detalle: 'Disponible: ' + (FICHA.guardado.fechaDisponibleRadicacion || 'sin fecha'),
      completo: FICHA.guardado.estadoMen === MEN_LISTO || FICHA.guardado.radicadoMen
    });
  }

  var linea = crear('div', 'ficha-trazabilidad');
  pasos.forEach(function (paso, indice) {
    var celda = crear('div', 'ficha-paso ' + (paso.completo ? 'completo' : 'pendiente'));
    celda.appendChild(crear('span', 'ficha-paso-numero', paso.completo ? '✓' : String(indice + 1)));
    var contenido = crear('div', 'ficha-paso-contenido');
    contenido.appendChild(crear('p', 'ficha-paso-titulo', paso.titulo));
    contenido.appendChild(crear('p', 'ficha-paso-valor', paso.valor || 'Sin registrar'));
    contenido.appendChild(crear('p', 'ficha-paso-detalle',
      paso.detalle || (paso.completo ? 'Sin responsable registrado' : 'Aún no registrado')));
    celda.appendChild(contenido);
    linea.appendChild(celda);
  });
  caja.appendChild(linea);

  caja.hidden = false;
}

function pintarPrevisualizacion() {
  var panel = $('previsualizacion');
  var guardado = FICHA && FICHA.guardado;
  var hayActa = !!(guardado && guardado.previewActa);
  var hayDiploma = !!(guardado && guardado.previewDiploma);
  panel.hidden = !hayActa && !hayDiploma;
  $('tabActa').hidden = !hayActa;
  $('tabDiploma').hidden = !hayDiploma;
  if (panel.hidden) {
    vaciar($('visorDocumento'));
    actualizarDisposicionRevision();
    return;
  }
  mostrarDocumento(hayActa ? 'acta' : 'diploma');
  actualizarDisposicionRevision();
}

/** Coloca visor y decisión lado a lado solo cuando ambos están visibles. */
function actualizarDisposicionRevision() {
  var espacio = $('espacioRevision');
  var hayVisor = !$('previsualizacion').hidden;
  var hayPanel = !$('panelRevisor').hidden;
  espacio.hidden = !hayVisor && !hayPanel;
  espacio.classList.toggle('dos-columnas', hayVisor && hayPanel);
}

function mostrarDocumento(tipo) {
  if (!FICHA || !FICHA.guardado) return;
  var esActa = tipo === 'acta';
  var preview = esActa ? FICHA.guardado.previewActa : FICHA.guardado.previewDiploma;
  var url = esActa ? FICHA.guardado.urlActa : FICHA.guardado.urlDiploma;
  if (!preview) return;

  $('tabActa').classList.toggle('activo', esActa);
  $('tabDiploma').classList.toggle('activo', !esActa);
  var visor = $('visorDocumento');
  vaciar(visor);

  var iframe = document.createElement('iframe');
  iframe.src = preview;
  iframe.title = 'Previsualización de ' + (esActa ? 'acta de grado' : 'diploma');
  iframe.loading = 'lazy';
  iframe.referrerPolicy = 'no-referrer';
  visor.appendChild(iframe);

  var enlace = crear('a', 'abrir-drive', 'Abrir en Drive');
  enlace.href = url;
  enlace.target = '_blank';
  enlace.rel = 'noopener';
  visor.appendChild(enlace);
}

function pintarPanelRevisor() {
  var panel = $('panelRevisor');

  // Talento Humano ya no ve este panel: su contenido útil —el veredicto y
  // el motivo de la devolución— lo entrega ahora el panel de etapa, arriba
  // de la ficha, en vez de un textarea deshabilitado detrás del visor de PDF.
  if (!FICHA || !FICHA.guardado || esTalentoHumano()) {
    panel.hidden = true;
    actualizarDisposicionRevision();
    return;
  }

  panel.hidden = false;
  var puedeDecidir = esRevisor() && FICHA.guardado.estadoRevision === REV_EN_REVISION;
  $('tituloPanelRevisor').textContent = puedeDecidir ? 'Decisión del revisor' : 'Resultado del revisor';
  var contenedor = $('criteriosRevisor');
  vaciar(contenedor);

  APP.criterios.forEach(function (criterio) {
    var th = FICHA.guardado.criterios && FICHA.guardado.criterios[criterio.clave];
    var reportado = FICHA.docente.valores ? FICHA.docente.valores[criterio.clave] : '';
    var valorFinal = th && th.valor === NO_COINCIDE ? th.correccion : reportado;
    var guardado = FICHA.guardado.revisionCriterios
      ? FICHA.guardado.revisionCriterios[criterio.clave] : '';
    var correccionGuardada = FICHA.guardado.revisionCorrecciones
      ? (FICHA.guardado.revisionCorrecciones[criterio.clave] || '') : '';

    var fila = crear('div', 'criterio-revisor');
    fila.setAttribute('data-clave', criterio.clave);
    var comparacion = crear('div', 'revision-comparacion');
    comparacion.appendChild(crear('p', 'criterio-etiqueta', criterio.etiqueta));
    comparacion.appendChild(crear('p', 'revision-original', 'SNIES: ' + (reportado || '(sin dato)')));
    comparacion.appendChild(crear('p', 'revision-final', correccionGuardada
      ? 'Corrección del revisor: ' + correccionGuardada
      : 'Talento Humano: ' + (valorFinal || '(sin dato)')));
    fila.appendChild(comparacion);

    var opciones = crear('div', 'opciones-criterio');
    opciones.appendChild(botonRevision(criterio.clave, REV_CONFORME, '✓', 'Conforme',
      guardado === REV_CONFORME));
    opciones.appendChild(botonRevision(criterio.clave, REV_NO_CONFORME, '✕', 'No conforme',
      guardado === REV_NO_CONFORME));
    fila.appendChild(opciones);

    var correccionRevisor = crear('div', 'correccion-revisor');
    var etiquetaCorreccion = crear('label');
    etiquetaCorreccion.setAttribute('for', 'rev_corr_' + criterio.clave);
    etiquetaCorreccion.appendChild(document.createTextNode('Valor correcto según el soporte '));
    etiquetaCorreccion.appendChild(crear('span', 'obligatorio', '*'));
    correccionRevisor.appendChild(etiquetaCorreccion);

    var campoCorreccion = campoCorreccionRevisor(criterio);
    campoCorreccion.id = 'rev_corr_' + criterio.clave;
    if (criterio.normalizarCorreccion === 'mayusculas') {
      correccionGuardada = correccionGuardada.toUpperCase();
    }
    campoCorreccion.value = criterio.tipoCorreccion === 'fecha'
      ? fechaParaControl(correccionGuardada) : correccionGuardada;
    correccionRevisor.appendChild(campoCorreccion);
    correccionRevisor.appendChild(crear('p', 'ayuda-correccion-revisor',
      'La corrección quedará registrada a nombre del revisor y permitirá aprobar sin devolver.'));
    fila.appendChild(correccionRevisor);
    contenedor.appendChild(fila);
    refrescarCriterioRevisor(fila);
  });

  $('observacionRevisor').value = FICHA.guardado.observacionRevision || '';
  $('camposRevisor').disabled = !puedeDecidir;
  $('accionesRevisor').hidden = !puedeDecidir;
  // Los botones viven entre aperturas de fichas. Se restablecen aquí para
  // que una decisión anterior no deje deshabilitado el siguiente docente.
  $('btnAprobar').disabled = !puedeDecidir;
  $('btnDevolver').disabled = !puedeDecidir;
  actualizarDisposicionRevision();
}

function botonRevision(clave, valor, simbolo, texto, marcado) {
  var etiqueta = crear('label', 'opcion-criterio');
  var radio = document.createElement('input');
  radio.type = 'radio';
  radio.name = 'rev_' + clave;
  radio.value = valor;
  radio.checked = !!marcado;
  etiqueta.appendChild(radio);
  etiqueta.appendChild(crear('span', 'marca', simbolo));
  etiqueta.appendChild(document.createTextNode(texto));
  if (marcado) etiqueta.classList.add(valor === REV_CONFORME ? 'marcada-si' : 'marcada-no');
  radio.addEventListener('change', function () {
    Array.prototype.forEach.call(etiqueta.parentNode.querySelectorAll('.opcion-criterio'), function (e) {
      var r = e.querySelector('input');
      e.classList.toggle('marcada-si', r.checked && r.value === REV_CONFORME);
      e.classList.toggle('marcada-no', r.checked && r.value === REV_NO_CONFORME);
    });
    refrescarCriterioRevisor(etiqueta.closest('.criterio-revisor'));
  });
  return etiqueta;
}

function campoCorreccionRevisor(criterio) {
  var opciones = criterio.opcionesCorreccion || [];
  var campo;
  if (opciones.length) {
    campo = document.createElement('select');
    var vacia = document.createElement('option');
    vacia.value = '';
    vacia.textContent = 'Seleccione una opción';
    campo.appendChild(vacia);
    opciones.forEach(function (valor) {
      var opcion = document.createElement('option');
      opcion.value = valor;
      opcion.textContent = valor;
      campo.appendChild(opcion);
    });
  } else {
    campo = document.createElement('input');
    campo.type = criterio.tipoCorreccion === 'fecha' ? 'date' : 'text';
    if (campo.type === 'text') {
      campo.maxLength = 500;
      campo.autocomplete = 'off';
      campo.placeholder = 'Escriba el valor correcto según el soporte';
    }
  }
  campo.className = 'campo-correccion-revisor';
  if (criterio.normalizarCorreccion === 'mayusculas') campo.classList.add('campo-mayusculas');
  return campo;
}

function refrescarCriterioRevisor(fila) {
  if (!fila) return;
  var elegido = fila.querySelector('input[type="radio"]:checked');
  var correccion = fila.querySelector('.correccion-revisor');
  if (correccion) {
    correccion.classList.toggle('visible', !!(elegido && elegido.value === REV_NO_CONFORME));
  }
  if (elegido) fila.classList.remove('sin-responder');
}

function pintarCriterios() {
  var contenedor = $('listaCriterios');
  vaciar(contenedor);

  APP.criterios.forEach(function (criterio) {
    var guardado = FICHA.guardado && FICHA.guardado.criterios
      ? FICHA.guardado.criterios[criterio.clave]
      : null;

    var reportado = FICHA.docente.valores ? FICHA.docente.valores[criterio.clave] : '';

    var fila = crear('div', 'criterio');
    fila.setAttribute('data-clave', criterio.clave);

    /* Columna izquierda: que se compara y con que valor */
    var texto = crear('div');
    texto.appendChild(crear('p', 'criterio-etiqueta', criterio.etiqueta));
    texto.appendChild(reportado
      ? crear('p', 'criterio-valor', reportado)
      : crear('p', 'criterio-valor vacio', '(sin dato reportado)'));
    fila.appendChild(texto);

    /* Columna derecha: el par de botones */
    var opciones = crear('div', 'opciones-criterio');
    opciones.appendChild(botonCriterio(criterio.clave, COINCIDE, '✓', 'Coincide',
      guardado && guardado.valor === COINCIDE));
    opciones.appendChild(botonCriterio(criterio.clave, NO_COINCIDE, '✕', 'No coincide',
      guardado && guardado.valor === NO_COINCIDE));
    fila.appendChild(opciones);

    /* Campo de correccion, visible solo cuando algo no coincide */
    var correccion = crear('div', 'correccion');

    var comparacion = crear('p', 'comparacion');
    comparacion.appendChild(document.createTextNode('SNIES reporta: '));
    var reportadoNodo = crear('strong', null, reportado || '(sin dato)');
    comparacion.appendChild(reportadoNodo);
    correccion.appendChild(comparacion);

    var etiqueta = crear('label');
    etiqueta.setAttribute('for', 'corr_' + criterio.clave);
    etiqueta.appendChild(document.createTextNode('Valor correcto según el soporte '));
    etiqueta.appendChild(crear('span', 'obligatorio', '*'));
    correccion.appendChild(etiqueta);

    var opcionesCorreccion = criterio.opcionesCorreccion || [];
    var campo;

    if (opcionesCorreccion.length) {
      campo = document.createElement('select');

      var opcionVacia = document.createElement('option');
      opcionVacia.value = '';
      opcionVacia.textContent = 'Seleccione una opción';
      campo.appendChild(opcionVacia);

      opcionesCorreccion.forEach(function (valor) {
        var opcion = document.createElement('option');
        opcion.value = valor;
        opcion.textContent = valor;
        campo.appendChild(opcion);
      });
    } else {
      campo = document.createElement('input');
      campo.type = criterio.tipoCorreccion === 'fecha' ? 'date' : 'text';

      if (campo.type === 'text') {
        campo.maxLength = 500;
        campo.autocomplete = 'off';
        campo.placeholder = 'Escriba el valor que figura en el documento soporte';
      }
    }

    campo.className = 'campo-correccion';
    if (criterio.normalizarCorreccion === 'mayusculas') {
      campo.classList.add('campo-mayusculas');
    }
    campo.id = 'corr_' + criterio.clave;
    var valorGuardado = guardado ? (guardado.correccion || '') : '';
    if (criterio.normalizarCorreccion === 'mayusculas') {
      valorGuardado = valorGuardado.toUpperCase();
    }
    campo.value = criterio.tipoCorreccion === 'fecha'
      ? fechaParaControl(valorGuardado)
      : valorGuardado;
    correccion.appendChild(campo);

    correccion.appendChild(crear('p', 'mensaje-error',
      opcionesCorreccion.length
        ? 'Seleccione el valor correcto según el soporte.'
        : criterio.tipoCorreccion === 'fecha'
          ? 'Seleccione la fecha correcta según el soporte.'
          : 'Escriba el valor correcto según el soporte.'));

    if (guardado && guardado.valor === NO_COINCIDE) correccion.classList.add('visible');
    fila.appendChild(correccion);

    contenedor.appendChild(fila);
    refrescarCriterio(fila);
  });
}

function botonCriterio(clave, valor, simbolo, texto, marcado) {
  var etiqueta = crear('label', 'opcion-criterio');

  var radio = document.createElement('input');
  radio.type = 'radio';
  radio.name = 'crit_' + clave;
  radio.value = valor;
  radio.checked = !!marcado;
  etiqueta.appendChild(radio);

  etiqueta.appendChild(crear('span', 'marca', simbolo));
  etiqueta.appendChild(document.createTextNode(texto));
  return etiqueta;
}

/** Sincroniza el aspecto de un criterio con el radio que este marcado. */
function refrescarCriterio(fila) {
  var elegido = fila.querySelector('input[type="radio"]:checked');
  var valor = elegido ? elegido.value : '';

  Array.prototype.forEach.call(fila.querySelectorAll('.opcion-criterio'), function (etiqueta) {
    var radio = etiqueta.querySelector('input[type="radio"]');
    var activa = radio.checked;
    etiqueta.classList.toggle('marcada-si', activa && radio.value === COINCIDE);
    etiqueta.classList.toggle('marcada-no', activa && radio.value === NO_COINCIDE);
  });

  var correccion = fila.querySelector('.correccion');
  correccion.classList.toggle('visible', valor === NO_COINCIDE);

  if (valor !== NO_COINCIDE) {
    correccion.classList.remove('con-error');
    correccion.querySelector('.campo-correccion').value = '';
  }

  if (valor) fila.classList.remove('sin-responder');
}

function pintarSoportes() {
  $('archivoActa').value = '';
  $('archivoDiploma').value = '';
  $('errorActa').hidden = true;
  $('errorDiploma').hidden = true;
  $('soporteActa').classList.remove('con-error');
  $('soporteDiploma').classList.remove('con-error');

  pintarEstadoSoporte('acta');
  pintarEstadoSoporte('diploma');
  pintarCarpetaDocente();
}

/** Enlace a la carpeta del docente en Drive, si ya existe. */
function pintarCarpetaDocente() {
  var nodo = $('carpetaDocente');
  var url = FICHA.guardado ? (FICHA.guardado.urlCarpeta || '') : '';
  vaciar(nodo);

  if (!url) {
    nodo.hidden = true;
    return;
  }

  var enlace = crear('a', null, '📁 Abrir carpeta del docente');
  enlace.href = url;
  enlace.target = '_blank';
  enlace.rel = 'noopener';
  enlace.setAttribute('aria-label',
    'Abrir en Google Drive la carpeta con los soportes de ' +
    (FICHA.docente.nombreCompleto || 'el docente'));
  nodo.appendChild(enlace);
  nodo.hidden = false;
}

function pintarEstadoSoporte(tipo) {
  var nodo = $(tipo === 'acta' ? 'estadoActa' : 'estadoDiploma');
  var nombre = tipo === 'acta' ? 'acta' : 'diploma';
  var url = FICHA.guardado
    ? (tipo === 'acta' ? FICHA.guardado.urlActa : FICHA.guardado.urlDiploma)
    : '';

  vaciar(nodo);

  if (FICHA.archivos[tipo]) {
    nodo.className = 'soporte-estado nuevo';
    nodo.appendChild(document.createTextNode(
      'Archivo seleccionado: ' + FICHA.archivos[tipo].nombre));
    if (url) {
      nodo.appendChild(crear('span', null, ' (reemplazará al actual)'));
    }
    return;
  }

  if (tipo === 'diploma' && FICHA.quitarDiploma && url) {
    nodo.className = 'soporte-estado fallo';
    nodo.appendChild(document.createTextNode('El diploma se retirará al guardar.'));
    nodo.appendChild(botonSoporte('Conservar', function () {
      FICHA.quitarDiploma = false;
      pintarEstadoSoporte('diploma');
    }));
    return;
  }

  if (url) {
    nodo.className = 'soporte-estado cargado';
    nodo.appendChild(document.createTextNode('✓ Documento cargado'));

    var enlace = crear('a', null, 'Ver documento');
    enlace.href = url;
    enlace.target = '_blank';
    enlace.rel = 'noopener';
    enlace.setAttribute('aria-label', 'Ver el ' + nombre + ' en Google Drive');
    nodo.appendChild(enlace);

    if (tipo === 'diploma' && FICHA.modo !== 'consulta') {
      nodo.appendChild(botonSoporte('Quitar', function () {
        FICHA.quitarDiploma = true;
        pintarEstadoSoporte('diploma');
      }));
    }
    return;
  }

  nodo.className = 'soporte-estado ausente';
  nodo.appendChild(document.createTextNode(
    tipo === 'acta' ? 'Sin acta cargada.' : 'Sin diploma cargado.'));
}

function botonSoporte(texto, accion) {
  var boton = crear('button', 'btn-mini', texto);
  boton.type = 'button';
  boton.addEventListener('click', accion);
  return boton;
}

/**
 * Comprueba el archivo elegido y lo deja listo en memoria como base64.
 * Solo se sube al servidor cuando la persona guarda la revision.
 */
function recibirArchivo(tipo, input, etiqueta) {
  var caja = $(tipo === 'acta' ? 'soporteActa' : 'soporteDiploma');
  var error = $(tipo === 'acta' ? 'errorActa' : 'errorDiploma');
  var estado = $(tipo === 'acta' ? 'estadoActa' : 'estadoDiploma');

  var fallar = function (mensaje) {
    input.value = '';
    FICHA.archivos[tipo] = null;
    caja.classList.add('con-error');
    error.textContent = mensaje;
    error.hidden = false;
    pintarEstadoSoporte(tipo);
  };

  caja.classList.remove('con-error');
  error.hidden = true;

  var archivo = input.files && input.files[0];
  if (!archivo) {
    FICHA.archivos[tipo] = null;
    pintarEstadoSoporte(tipo);
    return;
  }

  if (!/\.pdf$/i.test(archivo.name) ||
      (archivo.type && archivo.type !== 'application/pdf')) {
    fallar('El ' + etiqueta + ' debe ser un archivo PDF.');
    return;
  }

  if (archivo.size > MAX_BYTES_PDF) {
    fallar('El ' + etiqueta + ' supera el tamaño máximo de 10 MB.');
    return;
  }

  if (archivo.size === 0) {
    fallar('El archivo seleccionado está vacío.');
    return;
  }

  estado.className = 'soporte-estado ausente';
  estado.textContent = 'Leyendo archivo...';

  var lector = new FileReader();

  lector.onload = function () {
    var resultado = String(lector.result || '');
    var coma = resultado.indexOf(',');
    if (coma === -1) {
      fallar('No fue posible leer el archivo. Vuelva a seleccionarlo.');
      return;
    }
    FICHA.archivos[tipo] = {
      nombre: archivo.name,
      tipo: 'application/pdf',
      datos: resultado.slice(coma + 1)
    };
    if (tipo === 'diploma') FICHA.quitarDiploma = false;
    pintarEstadoSoporte(tipo);
  };

  lector.onerror = function () {
    fallar('No fue posible leer el archivo. Vuelva a seleccionarlo.');
  };

  lector.readAsDataURL(archivo);
}
