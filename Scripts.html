function entrarEnEdicion() {
  if (!FICHA || !puedeEditarValidacion()) return;
  FICHA.modo = 'edicion';
  FICHA.archivos = { acta: null, diploma: null };
  FICHA.quitarDiploma = false;
  pintarFicha();

  var primero = $('listaCriterios').querySelector('input[type="radio"]');
  if (primero) primero.focus();
  anunciar('Edición habilitada.');
}

/** Descarta los cambios y vuelve a dibujar exactamente lo guardado. */
function cancelarEdicion() {
  if (!FICHA || !FICHA.guardado) return;
  FICHA.modo = 'consulta';
  FICHA.archivos = { acta: null, diploma: null };
  FICHA.quitarDiploma = false;
  pintarFicha();
  anunciar('Edición cancelada. Se restauraron los valores guardados.');
}

/* ------------------------------------------------------------
   FICHA: VALIDACION Y GUARDADO
   ------------------------------------------------------------ */

/** Recoge lo que hay en pantalla en la forma que espera el servidor. */
function recolectar() {
  var criterios = {};

  Array.prototype.forEach.call($('listaCriterios').querySelectorAll('.criterio'), function (fila) {
    var clave = fila.getAttribute('data-clave');
    var elegido = fila.querySelector('input[type="radio"]:checked');
    var correccion = fila.querySelector('.campo-correccion');
    criterios[clave] = {
      valor: elegido ? elegido.value : '',
      correccion: correccion ? correccion.value.trim() : ''
    };
  });

  return {
    documento: FICHA.documento,
    version: FICHA.guardado ? FICHA.guardado.version : 0,
    criterios: criterios,
    observaciones: $('observaciones').value.trim(),
    acta: FICHA.archivos.acta,
    diploma: FICHA.archivos.diploma,
    quitarDiploma: FICHA.quitarDiploma === true
  };
}

/**
 * Revisa lo recogido y devuelve la lista de problemas. Ademas senala en
 * pantalla cada campo afectado y deja en .foco el primero, para llevar
 * alli a la persona.
 */
function validar(datos) {
  var problemas = [];
  var foco = null;
  var sinRevisar = 0;

  // Se parte de cero: lo que se corrigio desde el intento anterior
  // debe dejar de aparecer marcado.
  $('soporteActa').classList.remove('con-error');
  $('soporteDiploma').classList.remove('con-error');
  $('errorActa').hidden = true;
  $('errorDiploma').hidden = true;

  Array.prototype.forEach.call($('listaCriterios').querySelectorAll('.criterio'), function (fila) {
    var clave = fila.getAttribute('data-clave');
    var dato = datos.criterios[clave];
    var correccion = fila.querySelector('.correccion');

    fila.classList.remove('sin-responder');
    correccion.classList.remove('con-error');

    if (!dato.valor) {
      sinRevisar++;
      fila.classList.add('sin-responder');
      if (!foco) foco = fila.querySelector('input[type="radio"]');
      return;
    }

    if (dato.valor === NO_COINCIDE && !dato.correccion) {
      correccion.classList.add('con-error');
      problemas.push('Falta el valor correcto de "' + etiquetaDe(clave) + '".');
      if (!foco) foco = correccion.querySelector('.campo-correccion');
    }
  });

  if (sinRevisar) {
    problemas.unshift(sinRevisar === 1
      ? 'Queda 1 criterio sin revisar.'
      : 'Quedan ' + sinRevisar + ' criterios sin revisar.');
  }

  if (APP.requisitos.actaObligatoria && !datos.acta && !urlGuardada('acta')) {
    $('soporteActa').classList.add('con-error');
    $('errorActa').textContent = 'Debe cargar el acta de grado en PDF.';
    $('errorActa').hidden = false;
    problemas.push('Falta cargar el acta de grado.');
    if (!foco) foco = $('archivoActa');
  }

  if (APP.requisitos.diplomaObligatorio && !datos.diploma &&
      (!urlGuardada('diploma') || datos.quitarDiploma)) {
    $('soporteDiploma').classList.add('con-error');
    $('errorDiploma').textContent = 'Debe cargar el diploma de grado en PDF.';
    $('errorDiploma').hidden = false;
    problemas.push('Falta cargar el diploma de grado.');
    if (!foco) foco = $('archivoDiploma');
  }

  return { problemas: problemas, foco: foco };
}

function urlGuardada(tipo) {
  if (!FICHA.guardado) return '';
  return (tipo === 'acta' ? FICHA.guardado.urlActa : FICHA.guardado.urlDiploma) || '';
}

function etiquetaDe(clave) {
  for (var i = 0; i < APP.criterios.length; i++) {
    if (APP.criterios[i].clave === clave) return APP.criterios[i].etiqueta;
  }
  return clave;
}

function guardarRevision(enviarDespues) {
  if (!FICHA || FICHA.guardando || !esTalentoHumano() || !puedeEditarValidacion()) return;

  var datos = recolectar();
  var revision = validar(datos);
  var aviso = $('avisoGuardado');

  if (revision.problemas.length) {
    mostrarAviso(aviso, 'error',
      'No fue posible guardar la revisión: ' + revision.problemas.join(' '));
    if (revision.foco) {
      revision.foco.focus();
      // El radio esta oculto visualmente: se desplaza el bloque que lo contiene.
      var visible = revision.foco.closest('.criterio, .soporte') || revision.foco;
      visible.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    return;
  }

  ocultarAviso(aviso);

  var boton = $('btnGuardar');
  var botonGuardarEnviar = $('btnGuardarEnviar');
  var textoOriginal = boton.textContent;
  var textoOriginalEnviar = botonGuardarEnviar.textContent;
  FICHA.guardando = true;
  boton.disabled = true;
  botonGuardarEnviar.disabled = true;
  (enviarDespues ? botonGuardarEnviar : boton).textContent = 'Guardando...';
  $('btnCancelarEdicion').disabled = true;

  var subeArchivos = !!(datos.acta || datos.diploma);
  mostrarCapa(subeArchivos ? 'Subiendo documentos...' : 'Guardando revisión...');

  var terminar = function () {
    FICHA.guardando = false;
    boton.disabled = false;
    botonGuardarEnviar.disabled = false;
    boton.textContent = textoOriginal;
    botonGuardarEnviar.textContent = textoOriginalEnviar;
    $('btnCancelarEdicion').disabled = false;
    ocultarCapa();
  };

  servidor('guardarValidacion', datos, function (respuesta) {
    if (respuesta && respuesta.resumen) {
      APP.resumen = respuesta.resumen;
      pintarIndicadores();
    }

    actualizarDocenteEnLista(respuesta.documento, respuesta.estado,
      respuesta.validacion.estadoRevision, respuesta.validacion.version);
    var nombreDocente = FICHA.docente.nombreCompleto || FICHA.documento;

    if (enviarDespues) {
      FICHA.guardado = respuesta.validacion;
      mostrarCapa('Enviando al revisor...');
      servidor('enviarARevision', {
        documento: respuesta.documento,
        version: respuesta.validacion.version
      }, function (envio) {
        terminar();
        if (envio && envio.resumen) APP.resumen = envio.resumen;
        actualizarDocenteEnLista(envio.documento, respuesta.estado,
          envio.estadoRevision, envio.version);
        volverAlListado(true);
        pintarIndicadores();
        mostrarAviso($('avisoGeneral'), 'exito',
          '✓ ' + nombreDocente + ' fue guardado y enviado al revisor. ' +
          'La radicación ante el MEN la hará el revisor: usted ya terminó con este docente.',
          true);
      }, function (mensajeEnvio) {
        terminar();
        // El borrador SI se guardó: la ficha sigue editable para que pueda
        // reintentar el envío sin volver a capturarlo todo.
        FICHA.guardado = respuesta.validacion;
        FICHA.archivos = { acta: null, diploma: null };
        FICHA.quitarDiploma = false;
        pintarFicha();
        mostrarAviso($('avisoGuardado'), 'error',
          'El borrador quedó guardado, pero no fue posible enviarlo: ' + mensajeEnvio +
          ' Vuelva a pulsar «Enviar al revisor» cuando quiera reintentarlo.');
      });
      return;
    }

    terminar();

    // Guardar ya NO expulsa al listado: se sigue trabajando en la misma
    // ficha. Los PDF ya subieron, así que se limpian de memoria.
    FICHA.guardado = respuesta.validacion;
    FICHA.archivos = { acta: null, diploma: null };
    FICHA.quitarDiploma = false;
    // Ya existe registro guardado: deja de ser una ficha nueva y pasa a
    // edición, con lo que aparece "Cancelar edición" para volver atrás.
    FICHA.modo = 'edicion';
    pintarFicha();

    // Después de pintarFicha, que termina ocultando este mismo aviso.
    mostrarAviso($('avisoGuardado'), 'exito',
      '✓ Borrador de ' + nombreDocente + ' guardado. Sigue siendo suyo: ' +
      'todavía no lo ha enviado al revisor.', true);
    anunciar('Borrador guardado. Falta enviarlo al revisor.');

  }, function (mensaje) {
    terminar();
    mostrarAviso($('avisoGuardado'), 'error', 'No fue posible guardar la revisión: ' + mensaje);
    $('avisoGuardado').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

function enviarRevision() {
  if (!FICHA || !FICHA.guardado || FICHA.guardando || !esTalentoHumano()) return;
  var boton = $('btnEnviarRevision');
  FICHA.guardando = true;
  boton.disabled = true;
  mostrarCapa('Enviando al revisor...');

  servidor('enviarARevision', {
    documento: FICHA.documento,
    version: FICHA.guardado.version
  }, function (respuesta) {
    FICHA.guardando = false;
    boton.disabled = false;
    ocultarCapa();
    if (respuesta && respuesta.resumen) APP.resumen = respuesta.resumen;
    actualizarDocenteEnLista(respuesta.documento, null, respuesta.estadoRevision, respuesta.version);
    var nombre = FICHA.docente.nombreCompleto || FICHA.documento;
    volverAlListado(true);
    pintarIndicadores();
    mostrarAviso($('avisoGeneral'), 'exito',
      '✓ ' + nombre + ' fue enviado al revisor. El registro quedó bloqueado para edición. ' +
      'La radicación ante el MEN la hará el revisor: usted ya terminó con este docente.', true);
  }, function (mensaje) {
    FICHA.guardando = false;
    boton.disabled = false;
    ocultarCapa();
    mostrarAviso($('avisoGuardado'), 'error', 'No fue posible enviar la revisión: ' + mensaje);
  });
}

function enviarRevisionDesdeLista(boton) {
  if (!esTalentoHumano() || !boton || boton.disabled) return;
  var documento = boton.getAttribute('data-documento');
  var docente = APP.docentes.filter(function (d) { return d.documento === documento; })[0];
  var nombre = docente && docente.nombreCompleto ? docente.nombreCompleto : documento;

  // Enviar bloquea el expediente: es la acción irreversible de este rol y
  // hasta ahora era la única que no pedía confirmación.
  confirmar({
    titulo: 'Enviar al revisor',
    cuerpo: nombre + ' pasará al revisor y quedará bloqueado para edición. ' +
            'No podrá modificarlo hasta que lo aprueben o se lo devuelvan.',
    textoConfirmar: 'Enviar al revisor',
    textoCancelar: 'Cancelar',
    alConfirmar: function () { ejecutarEnvioDesdeLista(boton, documento, nombre); }
  });
}

function ejecutarEnvioDesdeLista(boton, documento, nombre) {
  boton.disabled = true;
  boton.textContent = 'Enviando...';
  mostrarCapa('Enviando al revisor...');
  servidor('enviarARevision', {
    documento: documento,
    version: Number(boton.getAttribute('data-version'))
  }, function (respuesta) {
    ocultarCapa();
    if (respuesta && respuesta.resumen) APP.resumen = respuesta.resumen;
    actualizarDocenteEnLista(respuesta.documento, null, respuesta.estadoRevision, respuesta.version);
    pintarIndicadores();
    pintarLista();
    mostrarAviso($('avisoGeneral'), 'exito',
      '✓ ' + nombre + ' fue enviado al revisor. La radicación ante el MEN la hará ' +
      'el revisor: usted ya terminó con este docente.', true);
  }, function (mensaje) {
    ocultarCapa();
    boton.disabled = false;
    boton.textContent = 'Enviar al revisor';
    mostrarAviso($('avisoGeneral'), 'error', 'No fue posible enviar la revisión: ' + mensaje);
  });
}

function recolectarDecision() {
  var criterios = {};
  Array.prototype.forEach.call($('criteriosRevisor').querySelectorAll('.criterio-revisor'), function (fila) {
    var elegido = fila.querySelector('input[type="radio"]:checked');
    var campo = fila.querySelector('.campo-correccion-revisor');
    criterios[fila.getAttribute('data-clave')] = {
      valor: elegido ? elegido.value : '',
      correccion: elegido && elegido.value === REV_NO_CONFORME && campo ? campo.value.trim() : ''
    };
    fila.classList.toggle('sin-responder', !elegido);
  });
  return criterios;
}

function decidirRevision(decision) {
  if (!FICHA || !FICHA.guardado || FICHA.guardando || !esRevisor() ||
      FICHA.guardado.estadoRevision !== REV_EN_REVISION) return;

  var criterios = recolectarDecision();
  var faltantes = Object.keys(criterios).filter(function (clave) { return !criterios[clave].valor; });
  var observacion = $('observacionRevisor').value.trim();
  if (faltantes.length) {
    mostrarAviso($('avisoGuardado'), 'error',
      'Debe revisar todos los criterios antes de tomar una decisión.');
    return;
  }
  var correccionesFaltantes = decision === REV_APROBADO && Object.keys(criterios).filter(function (clave) {
    return criterios[clave].valor === REV_NO_CONFORME && !criterios[clave].correccion;
  });
  if (correccionesFaltantes && correccionesFaltantes.length) {
    mostrarAviso($('avisoGuardado'), 'error',
      'Para aprobar, escriba el valor correcto de cada criterio marcado como no conforme.');
    var primera = $('criteriosRevisor').querySelector(
      '.criterio-revisor[data-clave="' + correccionesFaltantes[0] + '"] .campo-correccion-revisor');
    if (primera) primera.focus();
    return;
  }
  if (decision === REV_DEVUELTO && !observacion) {
    mostrarAviso($('avisoGuardado'), 'error',
      'Escriba qué debe corregir Talento Humano antes de devolver el registro.');
    $('observacionRevisor').focus();
    return;
  }

  FICHA.guardando = true;
  $('btnAprobar').disabled = true;
  $('btnDevolver').disabled = true;
  mostrarCapa(decision === REV_APROBADO ? 'Aprobando revisión...' : 'Devolviendo a Talento Humano...');

  servidor('decidirRevision', {
    documento: FICHA.documento,
    version: FICHA.guardado.version,
    decision: decision,
    criterios: criterios,
    observacion: observacion
  }, function (respuesta) {
    FICHA.guardando = false;
    ocultarCapa();
    if (respuesta && respuesta.resumen) APP.resumen = respuesta.resumen;
    actualizarDocenteEnLista(respuesta.documento, respuesta.estado,
      respuesta.estadoRevision, respuesta.version);
    var actualizado = APP.docentes.filter(function (d) { return d.documento === respuesta.documento; })[0];
    if (actualizado && respuesta.estadoMen) actualizado.estadoMen = respuesta.estadoMen;
    var nombre = FICHA.docente.nombreCompleto || FICHA.documento;
    volverAlListado(true);
    pintarIndicadores();
    mostrarAviso($('avisoGeneral'), 'exito', decision === REV_APROBADO
      ? '✓ Revisión de ' + nombre + ' aprobada. Falta radicarla ante el MEN: hágalo en la ' +
        'plataforma del Ministerio y vuelva a marcarla aquí.'
      : '↩ Revisión de ' + nombre + ' devuelta a Talento Humano para corregir.', true);
  }, function (mensaje) {
    FICHA.guardando = false;
    $('btnAprobar').disabled = false;
    $('btnDevolver').disabled = false;
    ocultarCapa();
    mostrarAviso($('avisoGuardado'), 'error', 'No fue posible registrar la decisión: ' + mensaje);
  });
}

function abrirDialogoSubsanacion(documento) {
  if (!esRevisor()) return;
  var docente = APP.docentes.filter(function (d) { return d.documento === documento; })[0];
  if (!docente) return;
  DOCUMENTO_SUBSANACION = documento;

  var vencida = estadoMenDe(docente) === MEN_LISTO;
  $('tituloSubsanacion').textContent = vencida
    ? 'Aplazar la radicación'
    : 'Poner en subsanación MEN';
  $('docenteSubsanacion').textContent = docente.nombreCompleto + ' · ' + documento +
    (vencida
      ? ' — ya estaba listo para radicar; indique la nueva fecha y el motivo.'
      : '');

  // Si vuelve a aplazarse, el motivo anterior se ofrece como punto de
  // partida: casi siempre es una continuación del mismo asunto.
  $('motivoSubsanacion').value = vencida ? (docente.motivoSubsanacion || '') : '';
  $('fechaDisponibleSubsanacion').value = mananaIso();
  $('fechaDisponibleSubsanacion').min = mananaIso();
  ocultarAviso($('errorSubsanacion'));
  $('dialogoSubsanacion').showModal();
  $('motivoSubsanacion').focus();
}

function cerrarDialogoSubsanacion() {
  DOCUMENTO_SUBSANACION = '';
  if ($('dialogoSubsanacion').open) $('dialogoSubsanacion').close();
}

function confirmarSubsanacion(evento) {
  evento.preventDefault();
  var documento = DOCUMENTO_SUBSANACION;
  var motivo = $('motivoSubsanacion').value.trim();
  var fecha = $('fechaDisponibleSubsanacion').value;
  var docente = APP.docentes.filter(function (d) { return d.documento === documento; })[0];
  if (!documento || !docente) return;
  if (!motivo || !fecha) {
    mostrarAviso($('errorSubsanacion'), 'error', 'Indique el motivo y la fecha disponible.');
    return;
  }
  mostrarCapa('Registrando subsanación...');
  servidor('ponerEnSubsanacion', {
    documento: documento,
    version: docente.version,
    motivo: motivo,
    fechaDisponible: fecha
  }, function (respuesta) {
    ocultarCapa();
    cerrarDialogoSubsanacion();
    docente.version = respuesta.version;
    docente.estadoMen = respuesta.estadoMen;
    docente.motivoSubsanacion = respuesta.motivoSubsanacion;
    docente.fechaSubsanacion = respuesta.fechaSubsanacion;
    docente.fechaDisponibleRadicacion = respuesta.fechaDisponibleRadicacion;
    docente.subsanacionPor = respuesta.subsanacionPor;
    if (respuesta.resumen) APP.resumen = respuesta.resumen;
    pintarIndicadores();
    pintarLista();
    mostrarAviso($('avisoGeneral'), 'exito',
      '✓ ' + docente.nombreCompleto + ' quedó en subsanación hasta el ' +
      respuesta.fechaDisponibleRadicacion + '.');
  }, function (mensaje) {
    ocultarCapa();
    mostrarAviso($('errorSubsanacion'), 'error', mensaje);
  });
}

function escaparCsv(valor) {
  var texto = String(valor == null ? '' : valor);
  return '"' + texto.replace(/"/g, '""') + '"';
}

function descargarCsv(nombre, filas) {
  var contenido = '\ufeff' + filas.map(function (fila) {
    return fila.map(escaparCsv).join(';');
  }).join('\r\n');
  var enlace = document.createElement('a');
  enlace.href = URL.createObjectURL(new Blob([contenido], { type: 'text/csv;charset=utf-8' }));
  enlace.download = nombre;
  document.body.appendChild(enlace);
  enlace.click();
  setTimeout(function () {
    URL.revokeObjectURL(enlace.href);
    enlace.remove();
  }, 0);
}

/* ------------------------------------------------------------
   TABLERO DE GESTIÓN

   Pantalla imprimible con el estado de la auditoría y lo hecho por
   cada usuario. Reutiliza obtenerInformeGestion tal cual: no añade
   ninguna acción nueva al servidor.

   HONESTIDAD CON LAS FECHAS: el rango desde/hasta filtra el historial
   y la actividad por persona, pero NO el estado actual, que siempre es
   la foto de hoy. En vez de disimularlo, los selectores viven dentro
   del bloque que gobiernan y cada bloque lleva su propia estampa.
   ------------------------------------------------------------ */

var INFORME = null;

function abrirTablero() {
  if (!esRevisor()) return;
  mostrarVista('tablero');
  cargarInforme();
}

function cargarInforme() {
  $('tableroCargando').hidden = false;
  $('tableroContenido').hidden = true;
  ocultarAviso($('tableroError'));

  servidor('obtenerInformeGestion', {
    desde: $('informeDesde').value,
    hasta: $('informeHasta').value
  }, function (informe) {
    $('tableroCargando').hidden = true;
    INFORME = informe;
    pintarTablero(informe);
    $('tableroContenido').hidden = false;
  }, function (mensaje) {
    $('tableroCargando').hidden = true;
    mostrarAviso($('tableroError'), 'error', 'No fue posible generar el informe: ' + mensaje);
  });
}

/**
 * Construye una tabla del informe dentro de un contenedor desplazable.
 *
 * `columnasLargas` son los índices de las columnas con texto libre
 * (motivos, observaciones): solo esas parten en varias líneas. El resto
 * va en una sola línea, porque si el navegador puede partir cualquier
 * celda estrangula la columna más estrecha —"Talento Humano" acababa
 * en seis líneas de tres letras.
 */
function tablaInforme(encabezados, filas, columnasLargas) {
  var largas = columnasLargas || [];

  var tabla = crear('table', 'tabla-informe');
  var thead = crear('thead');
  var filaEnc = crear('tr');
  encabezados.forEach(function (texto, i) {
    filaEnc.appendChild(crear('th', largas.indexOf(i) !== -1 ? 'celda-larga' : null, texto));
  });
  thead.appendChild(filaEnc);
  tabla.appendChild(thead);

  var tbody = crear('tbody');
  filas.forEach(function (fila) {
    var tr = crear('tr');
    fila.forEach(function (celda, i) {
      tr.appendChild(crear('td', largas.indexOf(i) !== -1 ? 'celda-larga' : null,
        celda === '' || celda == null ? '—' : String(celda)));
    });
    tbody.appendChild(tr);
  });
  tabla.appendChild(tbody);

  var caja = crear('div', 'tabla-desplazable');
  caja.appendChild(tabla);
  return caja;
}

/** Rótulo en versalita que estampa a qué momento corresponde un bloque. */
function estampa(texto) { return crear('p', 'estampa', texto); }

function textoPeriodo() {
  var desde = $('informeDesde').value;
  var hasta = $('informeHasta').value;
  if (!desde && !hasta) return 'Todo el historial registrado';
  return 'Movimientos entre ' + (desde || 'el inicio') + ' y ' + (hasta || 'hoy');
}

function pintarTablero(informe) {
  var caja = $('tableroContenido');
  vaciar(caja);

  var resumen = informe.resumen || {};
  var historial = informe.historial || [];
  var registros = informe.registros || [];

  /* --- A. Membrete --------------------------------------------- */
  var membrete = crear('div', 'tarjeta');
  var titulo = crear('h2', 'titulo-vista', 'Informe de gestión');
  titulo.id = 'tableroTitulo';
  membrete.appendChild(titulo);
  membrete.appendChild(crear('p', 'descripcion-vista', APP.auditoria || 'Auditoría documental de docentes'));

  var datos = crear('div', 'informe-membrete');
  [['Generado', informe.generado || ''],
   ['Solicitado por', (APP.perfil && APP.perfil.correo) || ''],
   ['Periodo consultado', textoPeriodo()]].forEach(function (par) {
    var celda = crear('div');
    celda.appendChild(crear('p', 'estampa', par[0]));
    celda.appendChild(crear('p', null, par[1] || '—'));
    datos.appendChild(celda);
  });
  membrete.appendChild(datos);

  membrete.appendChild(crear('p', 'nota-pie',
    'Las cifras de estado corresponden al momento de generar este informe, no al ' +
    'periodo elegido. El periodo solo filtra los movimientos registrados en el ' +
    'historial. Este informe no reconstruye el estado que los registros tenían en ' +
    'una fecha pasada.'));
  caja.appendChild(membrete);

  /* --- B. Estado a hoy ----------------------------------------- */
  var bloqueB = crear('div', 'tarjeta tarjeta-neutra');
  bloqueB.appendChild(crear('p', 'subtitulo', 'Estado de la auditoría'));
  bloqueB.appendChild(estampa('Estado a ' + (informe.generado || 'hoy') + ' · no depende del periodo'));

  var tira = crear('div', 'tira-indicadores tira-informe');
  [['Total docentes', resumen.total, 'total'],
   ['Sin cargar', resumen.pendientesCarga, 'sin-cargar'],
   ['Borradores sin enviar', resumen.porEnviar, 'pendientes'],
   ['En revisión', resumen.enRevision, 'revision'],
   ['Devueltos', resumen.devueltos, 'correccion'],
   ['Aprobados', resumen.aprobados, 'validados'],
   ['Por radicar (MEN)', resumen.menPendientes, 'men-pendiente'],
   ['En subsanación', resumen.menSubsanacion, 'men-subsanacion'],
   ['Listos para radicar', resumen.menListos, 'men-listo'],
   ['Radicados ante el MEN', resumen.menRadicados, 'men-radicado']
  ].forEach(function (item) {
    var celda = crear('div', 'indicador indicador-' + item[2]);
    celda.appendChild(crear('p', null, item[0]));
    celda.appendChild(crear('p', null, item[1] == null ? '—' : String(item[1])));
    tira.appendChild(celda);
  });
  bloqueB.appendChild(tira);
  caja.appendChild(bloqueB);

  /* --- C. Movimientos del periodo ------------------------------ */
  var bloqueC = crear('div', 'tarjeta tarjeta-neutra');
  var cabeceraC = crear('div', 'informe-cabecera');
  var textosC = crear('div');
  textosC.appendChild(crear('p', 'subtitulo', 'Movimientos del periodo'));
  textosC.appendChild(estampa(textoPeriodo()));
  cabeceraC.appendChild(textosC);

  // Los selectores viven aquí, dentro del bloque que gobiernan: quien los
  // mueve ve cambiar este bloque y ve que el de arriba no se inmuta.
  var controles = crear('div', 'informe-controles acciones-tablero');
  var etiquetaDesde = crear('label', null, 'Desde ');
  var campoDesde = document.createElement('input');
  campoDesde.type = 'date';
  campoDesde.value = $('informeDesde').value;
  campoDesde.addEventListener('change', function () { $('informeDesde').value = this.value; });
  etiquetaDesde.appendChild(campoDesde);

  var etiquetaHasta = crear('label', null, 'Hasta ');
  var campoHasta = document.createElement('input');
  campoHasta.type = 'date';
  campoHasta.value = $('informeHasta').value;
  campoHasta.addEventListener('change', function () { $('informeHasta').value = this.value; });
  etiquetaHasta.appendChild(campoHasta);

  var actualizar = crear('button', 'btn-secundario btn-compacto', 'Actualizar');
  actualizar.type = 'button';
  actualizar.addEventListener('click', cargarInforme);

  controles.appendChild(etiquetaDesde);
  controles.appendChild(etiquetaHasta);
  controles.appendChild(actualizar);
  cabeceraC.appendChild(controles);
  bloqueC.appendChild(cabeceraC);

  var porEvento = {};
  historial.forEach(function (h) { porEvento[h.evento] = (porEvento[h.evento] || 0) + 1; });

  var embudo = crear('div', 'informe-embudo');
  ['GUARDADO', 'ENVIADO_A_REVISION', 'APROBADO', 'APROBADO_CON_CORRECCION_REVISOR',
   'DEVUELTO', 'SUBSANACION_MEN', 'RADICADO_MEN'].forEach(function (evento) {
    var celda = crear('div', 'informe-embudo-celda');
    celda.appendChild(crear('p', 'estampa', nombreEvento(evento)));
    celda.appendChild(crear('p', 'informe-cifra', String(porEvento[evento] || 0)));
    embudo.appendChild(celda);
  });
  bloqueC.appendChild(embudo);

  if (!historial.length) {
    bloqueC.appendChild(crear('p', 'nota-pie', 'No hay movimientos registrados en este periodo.'));
  }
  caja.appendChild(bloqueC);

  /* --- D. Actividad por persona -------------------------------- */
  var bloqueD = crear('div', 'tarjeta tarjeta-neutra');
  bloqueD.appendChild(crear('p', 'subtitulo', 'Actividad por persona'));
  bloqueD.appendChild(estampa(textoPeriodo()));

  var usuarios = informe.usuarios || [];
  if (!usuarios.length) {
    bloqueD.appendChild(crear('p', 'nota-pie', 'Ninguna persona registró actividad en este periodo.'));
  } else {
    var eventosUsados = [];
    usuarios.forEach(function (u) {
      Object.keys(u.eventos || {}).forEach(function (e) {
        if (eventosUsados.indexOf(e) === -1) eventosUsados.push(e);
      });
    });
    bloqueD.appendChild(tablaInforme(
      ['Persona', 'Rol', 'Total'].concat(eventosUsados.map(nombreEvento)),
      usuarios.map(function (u) {
        return [u.correo, nombreRol(u.rol), u.total].concat(
          eventosUsados.map(function (e) { return (u.eventos && u.eventos[e]) || 0; }));
      })));
  }
  caja.appendChild(bloqueD);

  /* --- E. Cola que exige acción -------------------------------- */
  caja.appendChild(pintarColas(registros, informe.generado));

  /* --- F. Detalle de movimientos ------------------------------- */
  var bloqueF = crear('div', 'tarjeta tarjeta-neutra');
  bloqueF.appendChild(crear('p', 'subtitulo', 'Detalle de movimientos'));
  bloqueF.appendChild(estampa(textoPeriodo()));

  if (!historial.length) {
    bloqueF.appendChild(crear('p', 'nota-pie', 'Sin movimientos en el periodo.'));
  } else {
    var recientes = historial.slice().reverse().slice(0, 150);
    bloqueF.appendChild(tablaInforme(
      ['Fecha', 'Docente', 'Movimiento', 'Persona', 'Observación'],
      recientes.map(function (h) {
        return [h.fecha, h.docente || h.documento,
          nombreEvento(h.evento), h.correo, h.observacion || ''];
      }), [4]));
    if (historial.length > 150) {
      bloqueF.appendChild(crear('p', 'nota-pie',
        'Se muestran los 150 movimientos más recientes de ' + historial.length +
        '. El detalle completo está en la descarga CSV.'));
    }
  }
  caja.appendChild(bloqueF);

  // Solo visible en papel: repite las dos estampas para que una hoja
  // suelta siga diciendo a qué momento corresponde.
  caja.appendChild(crear('p', 'pie-impreso',
    (APP.auditoria || 'Auditoría documental') +
    ' · Estado a ' + (informe.generado || 'hoy') +
    ' · ' + textoPeriodo() +
    ' · Generado por ' + ((APP.perfil && APP.perfil.correo) || '')));
}

/** Bloque E: lo que espera una acción concreta, con quién la debe hacer. */
function pintarColas(registros, generado) {
  var bloque = crear('div', 'tarjeta');
  bloque.appendChild(crear('p', 'subtitulo', 'Cola que exige acción'));
  bloque.appendChild(estampa('Estado a ' + (generado || 'hoy') + ' · no depende del periodo'));

  var aprobados = registros.filter(function (r) { return r.estadoRevision === REV_APROBADO; });

  var grupos = [
    {
      titulo: 'Listos para radicar ante el MEN',
      responsable: 'Revisor',
      filas: aprobados.filter(function (r) { return r.estadoMen === MEN_LISTO; }),
      columnas: ['Documento', 'Docente', 'Disponible desde'],
      celdas: function (r) { return [r.documento, r.docente, r.fechaDisponibleRadicacion || '']; }
    },
    {
      titulo: 'Por radicar ante el MEN',
      responsable: 'Revisor',
      filas: aprobados.filter(function (r) {
        return !r.estadoMen || r.estadoMen === MEN_PENDIENTE;
      }),
      columnas: ['Documento', 'Docente', 'Aprobado el'],
      celdas: function (r) { return [r.documento, r.docente, r.fechaRevision || '']; }
    },
    {
      titulo: 'En subsanación, esperando fecha',
      responsable: 'Nadie hasta la fecha indicada',
      filas: aprobados.filter(function (r) { return r.estadoMen === MEN_SUBSANACION; }),
      columnas: ['Documento', 'Docente', 'Se libera el', 'Motivo'],
      largas: [3],
      celdas: function (r) {
        return [r.documento, r.docente, r.fechaDisponibleRadicacion || '', r.motivoSubsanacion || ''];
      }
    },
    {
      titulo: 'Devueltos sin reenviar',
      responsable: 'Talento Humano',
      filas: registros.filter(function (r) { return r.estadoRevision === REV_DEVUELTO; }),
      columnas: ['Documento', 'Docente', 'Devuelto el', 'Motivo'],
      largas: [3],
      celdas: function (r) {
        return [r.documento, r.docente, r.fechaRevision || '', r.observacionRevision || ''];
      }
    },
    {
      titulo: 'Esperando decisión del revisor',
      responsable: 'Revisor',
      filas: registros.filter(function (r) { return r.estadoRevision === REV_EN_REVISION; }),
      columnas: ['Documento', 'Docente', 'Enviado el'],
      celdas: function (r) { return [r.documento, r.docente, r.fechaEnvio || '']; }
    }
  ];

  var algo = false;
  grupos.forEach(function (g) {
    if (!g.filas.length) return;
    algo = true;
    var cabecera = crear('div', 'informe-cola-titulo');
    cabecera.appendChild(crear('h3', null, g.titulo + ' (' + g.filas.length + ')'));
    cabecera.appendChild(crear('span', 'insignia insignia-responsable', g.responsable));
    bloque.appendChild(cabecera);
    bloque.appendChild(tablaInforme(g.columnas, g.filas.map(g.celdas), g.largas));
  });

  if (!algo) {
    bloque.appendChild(crear('p', 'nota-pie', 'No hay expedientes esperando acción.'));
  }
  return bloque;
}

    });

      'Estado nuevo', 'Correo', 'Rol', 'Observación'
    ]);
    (informe.historial || []).forEach(function (h) {
      filas.push([h.fecha, h.documento, h.docente, h.evento, h.estadoAnterior,
        h.estadoNuevo, h.correo, h.rol, h.observacion]);
    });
    descargarCsv('informe-auditoria-snies-' + ($('informeHasta').value || fechaIsoLocal(new Date())) + '.csv', filas);
    mostrarAviso($('avisoGeneral'), 'exito', '✓ Informe de gestión descargado.');
  }, function (mensaje) {
    boton.disabled = false;
    boton.textContent = 'Descargar CSV';
    mostrarAviso($('avisoGeneral'), 'error', 'No fue posible generar el informe: ' + mensaje);
  });
}

/** Confirmación en dos pasos para evitar registrar el radicado por accidente. */
function confirmarRadicadoMenDesdeLista(boton) {
  if (!esRevisor() || !boton || boton.disabled) return;

  var doc = boton.getAttribute('data-documento');
  var nombreDocente = (APP.docentes.filter(function (item) {
    return item.documento === doc;
  })[0] || {}).nombreCompleto || doc;

  // Sustituye al doble clic que caducaba a los 8 segundos sin avisar. El
  // diálogo además explica qué significa la marca, que era lo que de
  // verdad faltaba: no radica nada, solo deja constancia.
  confirmar({
    titulo: 'Marcar como radicado ante el MEN',
    cuerpo: 'Confirme que ya cargó a ' + nombreDocente + ' en la plataforma del ' +
            'Ministerio. Esta marca no radica nada por sí sola: solo deja constancia ' +
            'en el sistema de que el trámite externo ya se hizo.',
    textoConfirmar: 'Sí, ya lo radiqué',
    textoCancelar: 'Todavía no',
    alConfirmar: function () { ejecutarRadicadoDesdeLista(boton); }
  });
}

function ejecutarRadicadoDesdeLista(boton) {
  var documento = boton.getAttribute('data-documento');
  var docente = APP.docentes.filter(function (item) { return item.documento === documento; })[0];
  boton.disabled = true;
  boton.textContent = 'Registrando...';
  mostrarCapa('Registrando radicado MEN...');

  servidor('confirmarRadicadoMen', {
    documento: documento,
    version: Number(boton.getAttribute('data-version'))
  }, function (respuesta) {
    ocultarCapa();
    if (docente) {
      docente.version = respuesta.version;
      docente.estadoMen = respuesta.estadoMen || MEN_RADICADO;
      docente.radicadoMen = true;
      docente.radicadoPor = respuesta.radicadoPor;
      docente.fechaRadicacionMen = respuesta.fechaRadicacionMen;
    }
    if (respuesta.resumen) APP.resumen = respuesta.resumen;
    pintarIndicadores();
    pintarLista();
    mostrarAviso($('avisoGeneral'), 'exito',
      '✓ Radicado MEN de ' + (docente && docente.nombreCompleto ? docente.nombreCompleto : documento) + ' confirmado.');
    anunciar('Radicado MEN confirmado.');
  }, function (mensaje) {
    ocultarCapa();
    boton.disabled = false;
    boton.textContent = 'Marcar como radicado';
    mostrarAviso($('avisoGeneral'), 'error', 'No fue posible registrar el radicado MEN: ' + mensaje);
  });
}

/** Refleja el nuevo estado en la lista sin volver a pedirla al servidor. */
function actualizarDocenteEnLista(documento, estado, estadoRevision, version) {
  for (var i = 0; i < APP.docentes.length; i++) {
    if (APP.docentes[i].documento === documento) {
      if (estado) APP.docentes[i].estado = estado;
      if (estado) APP.docentes[i].tieneValidacion = true;
      if (estadoRevision) APP.docentes[i].estadoRevision = estadoRevision;
      if (version) APP.docentes[i].version = version;
      return;
    }
  }
}
</script>
