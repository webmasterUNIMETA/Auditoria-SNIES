/**
 * Comprueba el archivo elegido y lo deja listo en memoria como base64.
 * Solo se sube al servidor cuando la persona guarda la revision.
 */
function recibirArchivo(tipo, input, etiqueta) {
  var caja = $(tipo === 'acta' ? 'soporteActa' : 'soporteDiploma');
  var error = $(tipo === 'acta' ? 'errorActa' : 'errorDiploma');
  var estado = $(tipo === 'acta' ? 'estadoActa' : 'estadoDiploma');

  var fallar = function (mensaje) {
    input.value = '';
    FICHA.archivos[tipo] = null;
    caja.classList.add('con-error');
    error.textContent = mensaje;
    error.hidden = false;
    pintarEstadoSoporte(tipo);
  };

  caja.classList.remove('con-error');
  error.hidden = true;

  var archivo = input.files && input.files[0];
  if (!archivo) {
    FICHA.archivos[tipo] = null;
    pintarEstadoSoporte(tipo);
    return;
  }

  if (!/\.pdf$/i.test(archivo.name) ||
      (archivo.type && archivo.type !== 'application/pdf')) {
    fallar('El ' + etiqueta + ' debe ser un archivo PDF.');
    return;
  }

  if (archivo.size > MAX_BYTES_PDF) {
    fallar('El ' + etiqueta + ' supera el tamaño máximo de 10 MB.');
    return;
  }

  if (archivo.size === 0) {
    fallar('El archivo seleccionado está vacío.');
    return;
  }

  estado.className = 'soporte-estado ausente';
  estado.textContent = 'Leyendo archivo...';

  var lector = new FileReader();

  lector.onload = function () {
    var resultado = String(lector.result || '');
    var coma = resultado.indexOf(',');
    if (coma === -1) {
      fallar('No fue posible leer el archivo. Vuelva a seleccionarlo.');
      return;
    }
    FICHA.archivos[tipo] = {
      nombre: archivo.name,
      tipo: 'application/pdf',
      datos: resultado.slice(coma + 1)
    };
    if (tipo === 'diploma') FICHA.quitarDiploma = false;
    pintarEstadoSoporte(tipo);
  };

  lector.onerror = function () {
    fallar('No fue posible leer el archivo. Vuelva a seleccionarlo.');
  };

  lector.readAsDataURL(archivo);
}

/** Recoge lo que hay en pantalla en la forma que espera el servidor. */
function recolectar() {
  var criterios = {};

  Array.prototype.forEach.call($('listaCriterios').querySelectorAll('.criterio'), function (fila) {
    var clave = fila.getAttribute('data-clave');
    var elegido = fila.querySelector('input[type="radio"]:checked');
    var correccion = fila.querySelector('.campo-correccion');
    criterios[clave] = {
      valor: elegido ? elegido.value : '',
      correccion: correccion ? correccion.value.trim() : ''
    };
  });

  return {
    documento: FICHA.documento,
    version: FICHA.guardado ? FICHA.guardado.version : 0,
    criterios: criterios,
    observaciones: $('observaciones').value.trim(),
    acta: FICHA.archivos.acta,
    diploma: FICHA.archivos.diploma,
    quitarDiploma: FICHA.quitarDiploma === true
  };
}

/**
 * Revisa lo recogido y devuelve la lista de problemas. Ademas senala en
 * pantalla cada campo afectado y deja en .foco el primero, para llevar
 * alli a la persona.
 */
function validar(datos) {
  var problemas = [];
  var foco = null;
  var sinRevisar = 0;

  // Se parte de cero: lo que se corrigio desde el intento anterior
  // debe dejar de aparecer marcado.
  $('soporteActa').classList.remove('con-error');
  $('soporteDiploma').classList.remove('con-error');
  $('errorActa').hidden = true;
  $('errorDiploma').hidden = true;

  Array.prototype.forEach.call($('listaCriterios').querySelectorAll('.criterio'), function (fila) {
    var clave = fila.getAttribute('data-clave');
    var dato = datos.criterios[clave];
    var correccion = fila.querySelector('.correccion');

    fila.classList.remove('sin-responder');
    correccion.classList.remove('con-error');

    if (!dato.valor) {
      sinRevisar++;
      fila.classList.add('sin-responder');
      if (!foco) foco = fila.querySelector('input[type="radio"]');
      return;
    }

    if (dato.valor === NO_COINCIDE && !dato.correccion) {
      correccion.classList.add('con-error');
      problemas.push('Falta el valor correcto de "' + etiquetaDe(clave) + '".');
      if (!foco) foco = correccion.querySelector('.campo-correccion');
    }
  });

  if (sinRevisar) {
    problemas.unshift(sinRevisar === 1
      ? 'Queda 1 criterio sin revisar.'
      : 'Quedan ' + sinRevisar + ' criterios sin revisar.');
  }

  if (APP.requisitos.actaObligatoria && !datos.acta && !urlGuardada('acta')) {
    $('soporteActa').classList.add('con-error');
    $('errorActa').textContent = 'Debe cargar el acta de grado en PDF.';
    $('errorActa').hidden = false;
    problemas.push('Falta cargar el acta de grado.');
    if (!foco) foco = $('archivoActa');
  }

  if (APP.requisitos.diplomaObligatorio && !datos.diploma &&
      (!urlGuardada('diploma') || datos.quitarDiploma)) {
    $('soporteDiploma').classList.add('con-error');
    $('errorDiploma').textContent = 'Debe cargar el diploma de grado en PDF.';
    $('errorDiploma').hidden = false;
    problemas.push('Falta cargar el diploma de grado.');
    if (!foco) foco = $('archivoDiploma');
  }

  return { problemas: problemas, foco: foco };
}

function urlGuardada(tipo) {
  if (!FICHA.guardado) return '';
  return (tipo === 'acta' ? FICHA.guardado.urlActa : FICHA.guardado.urlDiploma) || '';
}

function etiquetaDe(clave) {
  for (var i = 0; i < APP.criterios.length; i++) {
    if (APP.criterios[i].clave === clave) return APP.criterios[i].etiqueta;
  }
  return clave;
}

/**
 * "Enviar al revisor" desde la ficha. Si hay cambios, guarda y envía; si
 * no, envía lo guardado sin crear un guardado vacío en el historial.
 * Valida antes de preguntar, para no confirmar algo que luego falla.
 */
function accionEnviarFicha() {
  if (!FICHA || FICHA.guardando || !esTalentoHumano() || !puedeEditarValidacion()) return;
  var necesitaGuardar = !FICHA.guardado || hayCambiosPendientes();
  if (necesitaGuardar && validar(recolectar()).problemas.length) {
    guardarRevision(true);   // muestra los errores y lleva al primero
    return;
  }

  var nombre = FICHA.docente.nombreCompleto || FICHA.documento;
  confirmar({
    titulo: 'Enviar al revisor',
    cuerpo: nombre + ' pasará al revisor y quedará bloqueado para edición. ' +
            'No podrá modificarlo hasta que lo aprueben o se lo devuelvan.',
    textoConfirmar: 'Enviar al revisor',
    textoCancelar: 'Seguir editando',
    alConfirmar: function () {
      if (necesitaGuardar) guardarRevision(true);
      else enviarRevision();
    }
  });
}

function guardarRevision(enviarDespues) {
  if (!FICHA || FICHA.guardando || !esTalentoHumano() || !puedeEditarValidacion()) return;

  var datos = recolectar();
  var revision = validar(datos);
  var aviso = $('avisoGuardado');

  if (revision.problemas.length) {
    mostrarAviso(aviso, 'error',
      'No fue posible guardar: ' + revision.problemas.join(' '));
    if (revision.foco) {
      revision.foco.focus();
      // El radio esta oculto visualmente: se desplaza el bloque que lo contiene.
      var visible = revision.foco.closest('.criterio, .soporte') || revision.foco;
      visible.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    return;
  }

  ocultarAviso(aviso);

  var boton = $('btnGuardar');
  var botonEnviar = $('btnGuardarEnviar');
  var textoOriginal = boton.textContent;
  var textoOriginalEnviar = botonEnviar.textContent;
  FICHA.guardando = true;
  boton.disabled = true;
  botonEnviar.disabled = true;
  (enviarDespues ? botonEnviar : boton).textContent = 'Guardando...';
  $('btnCancelarEdicion').disabled = true;

  var subeArchivos = !!(datos.acta || datos.diploma);
  mostrarCapa(subeArchivos ? 'Subiendo documentos...' : 'Guardando...');

  var terminar = function () {
    FICHA.guardando = false;
    boton.disabled = false;
    botonEnviar.disabled = false;
    boton.textContent = textoOriginal;
    botonEnviar.textContent = textoOriginalEnviar;
    $('btnCancelarEdicion').disabled = false;
    ocultarCapa();
  };

  servidor('guardarValidacion', datos, function (respuesta) {
    fusionarDocente(respuesta.documento, {
      estado: respuesta.estado,
      tieneValidacion: true,
      estadoRevision: respuesta.validacion.estadoRevision,
      version: respuesta.validacion.version,
      fechaModificacion: respuesta.validacion.fechaModificacion
    });
    var nombreDocente = FICHA.docente.nombreCompleto || FICHA.documento;

    if (enviarDespues) {
      FICHA.guardado = respuesta.validacion;
      mostrarCapa('Enviando al revisor...');
      servidor('enviarARevision', {
        documento: respuesta.documento,
        version: respuesta.validacion.version
      }, function (envio) {
        terminar();
        fusionarDocente(envio.documento, {
          estadoRevision: envio.estadoRevision,
          version: envio.version
        });
        volverAlListado(true);
        mostrarAviso($('avisoGeneral'), 'exito',
          '✓ ' + nombreDocente + ' fue guardado y enviado al revisor. ' +
          'La radicación ante el MEN la hará el revisor: usted ya terminó con este docente.',
          true);
        refrescarEnSilencio();
      }, function (mensajeEnvio) {
        terminar();
        // El borrador SI se guardó: la ficha sigue editable para que pueda
        // reintentar el envío sin volver a capturarlo todo.
        FICHA.guardado = respuesta.validacion;
        FICHA.archivos = { acta: null, diploma: null };
        FICHA.quitarDiploma = false;
        FICHA.modo = 'edicion';
        pintarFicha();
        mostrarAviso($('avisoGuardado'), 'error',
          'El borrador quedó guardado, pero no fue posible enviarlo: ' + mensajeEnvio +
          ' Vuelva a pulsar «Enviar al revisor» cuando quiera reintentarlo.');
      });
      return;
    }

    terminar();

    // Guardar no expulsa a la bandeja: se sigue trabajando en la misma
    // ficha. Los PDF ya subieron, así que se limpian de memoria.
    FICHA.guardado = respuesta.validacion;
    FICHA.archivos = { acta: null, diploma: null };
    FICHA.quitarDiploma = false;
    FICHA.modo = 'edicion';
    pintarFicha();

    // Después de pintarFicha, que termina ocultando este mismo aviso.
    mostrarAviso($('avisoGuardado'), 'exito',
      '✓ Borrador de ' + nombreDocente + ' guardado. Sigue siendo suyo: ' +
      'todavía no lo ha enviado al revisor.', true);
    anunciar('Borrador guardado. Falta enviarlo al revisor.');
    refrescarEnSilencio();

  }, function (mensaje) {
    terminar();
    mostrarAviso($('avisoGuardado'), 'error', 'No fue posible guardar: ' + mensaje);
    $('avisoGuardado').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
}

function enviarRevision() {
  if (!FICHA || !FICHA.guardado || FICHA.guardando || !esTalentoHumano()) return;
  var boton = $('btnGuardarEnviar');
  FICHA.guardando = true;
  boton.disabled = true;
  mostrarCapa('Enviando al revisor...');

  servidor('enviarARevision', {
    documento: FICHA.documento,
    version: FICHA.guardado.version
  }, function (respuesta) {
    FICHA.guardando = false;
    boton.disabled = false;
    ocultarCapa();
    fusionarDocente(respuesta.documento, {
      estadoRevision: respuesta.estadoRevision,
      version: respuesta.version
    });
    var nombre = FICHA.docente.nombreCompleto || FICHA.documento;
    volverAlListado(true);
    mostrarAviso($('avisoGeneral'), 'exito',
      '✓ ' + nombre + ' fue enviado al revisor. El registro quedó bloqueado para edición. ' +
      'La radicación ante el MEN la hará el revisor: usted ya terminó con este docente.', true);
    refrescarEnSilencio();
  }, function (mensaje) {
    FICHA.guardando = false;
    boton.disabled = false;
    ocultarCapa();
    mostrarAviso($('avisoGuardado'), 'error', 'No fue posible enviarlo: ' + mensaje);
  });
}

/* ------------------------------------------------------------
   FICHA: REVISOR

   Una sola tabla comparativa: Campo | Dice SNIES | Talento Humano |
   Su decisión. Diez filas en vez de veinte. Conserva el contrato del
   DOM que lee recolectarDecision(): .criterio-revisor[data-clave],
   radios rev_K y .campo-correccion-revisor.
   ------------------------------------------------------------ */

function celdaDecision(rotulo, contenido, clase) {
  var celda = crear('div', 'celda' + (clase ? ' ' + clase : ''));
  celda.setAttribute('role', 'cell');
  celda.setAttribute('data-rotulo', rotulo);
  celda.appendChild(contenido);
  return celda;
}

function pintarTablaDecision() {
  var panel = $('panelRevisor');
  var contenedor = $('criteriosRevisor');

  if (!FICHA || !FICHA.guardado || !esRevisor()) {
    panel.hidden = true;
    vaciar(contenedor);
    actualizarDisposicionRevision();
    return;
  }

  panel.hidden = false;
  var puedeDecidir = FICHA.guardado.estadoRevision === REV_EN_REVISION;
  $('tituloPanelRevisor').textContent = puedeDecidir ? 'Su decisión' : 'Decisión registrada';
  vaciar(contenedor);

  APP.criterios.forEach(function (criterio) {
    var th = FICHA.guardado.criterios && FICHA.guardado.criterios[criterio.clave];
    var reportado = FICHA.docente.valores ? FICHA.docente.valores[criterio.clave] : '';
    var guardado = FICHA.guardado.revisionCriterios
      ? FICHA.guardado.revisionCriterios[criterio.clave] : '';
    var correccionGuardada = FICHA.guardado.revisionCorrecciones
      ? (FICHA.guardado.revisionCorrecciones[criterio.clave] || '') : '';

    var fila = crear('div', 'criterio-revisor');
    fila.setAttribute('role', 'row');
    fila.setAttribute('data-clave', criterio.clave);

    fila.appendChild(celdaDecision('Campo', crear('span', 'criterio-etiqueta', criterio.etiqueta)));
    fila.appendChild(celdaDecision('Dice SNIES',
      crear('span', 'dato-snies', reportado || '(sin dato)')));

    var datoTH = crear('span', 'dato-th');
    if (th && th.valor === NO_COINCIDE) {
      datoTH.classList.add('corrige');
      datoTH.appendChild(document.createTextNode('✕ Corrige a: '));
      datoTH.appendChild(crear('strong', null, th.correccion || '(sin valor)'));
    } else if (th && th.valor === COINCIDE) {
      datoTH.appendChild(document.createTextNode('✓ Coincide'));
    } else {
      datoTH.appendChild(document.createTextNode('—'));
    }
    fila.appendChild(celdaDecision('Talento Humano', datoTH));

    var decision = crear('div');
    var opciones = crear('div', 'opciones-criterio');
    opciones.appendChild(botonRevision(criterio.clave, REV_CONFORME, '✓', 'Conforme',
      guardado === REV_CONFORME));
    opciones.appendChild(botonRevision(criterio.clave, REV_NO_CONFORME, '✕', 'No conforme',
      guardado === REV_NO_CONFORME));
    decision.appendChild(opciones);

    var correccionRevisor = crear('div', 'correccion-revisor');
    var etiquetaCorreccion = crear('label');
    etiquetaCorreccion.setAttribute('for', 'rev_corr_' + criterio.clave);
    etiquetaCorreccion.appendChild(document.createTextNode('Valor correcto según el soporte '));
    etiquetaCorreccion.appendChild(crear('span', 'obligatorio', '*'));
    correccionRevisor.appendChild(etiquetaCorreccion);

    var campoCorreccion = campoCorreccionRevisor(criterio);
    campoCorreccion.id = 'rev_corr_' + criterio.clave;
    if (criterio.normalizarCorreccion === 'mayusculas') {
      correccionGuardada = correccionGuardada.toUpperCase();
    }
    campoCorreccion.value = criterio.tipoCorreccion === 'fecha'
      ? fechaParaControl(correccionGuardada) : correccionGuardada;
    correccionRevisor.appendChild(campoCorreccion);
    decision.appendChild(correccionRevisor);

    fila.appendChild(celdaDecision('Su decisión', decision, 'celda-decision'));
    contenedor.appendChild(fila);
    refrescarCriterioRevisor(fila);
  });

  $('observacionRevisor').value = FICHA.guardado.observacionRevision || '';
  $('camposRevisor').disabled = !puedeDecidir;
  $('accionesRevisor').hidden = !puedeDecidir;
  // Los botones viven entre aperturas de fichas. Se restablecen aquí para
  // que una decisión anterior no deje deshabilitado el siguiente docente.
  $('btnAprobar').disabled = !puedeDecidir;
  $('btnDevolver').disabled = !puedeDecidir;
  actualizarDisposicionRevision();
}

function botonRevision(clave, valor, simbolo, texto, marcado) {
  var etiqueta = crear('label', 'opcion-criterio');
  var radio = document.createElement('input');
  radio.type = 'radio';
  radio.name = 'rev_' + clave;
  radio.value = valor;
  radio.checked = !!marcado;
  etiqueta.appendChild(radio);
  etiqueta.appendChild(crear('span', 'marca', simbolo));
  etiqueta.appendChild(document.createTextNode(texto));
  if (marcado) etiqueta.classList.add(valor === REV_CONFORME ? 'marcada-si' : 'marcada-no');
  radio.addEventListener('change', function () {
    Array.prototype.forEach.call(etiqueta.parentNode.querySelectorAll('.opcion-criterio'), function (e) {
      var r = e.querySelector('input');
      e.classList.toggle('marcada-si', r.checked && r.value === REV_CONFORME);
      e.classList.toggle('marcada-no', r.checked && r.value === REV_NO_CONFORME);
    });
    refrescarCriterioRevisor(etiqueta.closest('.criterio-revisor'));
  });
  return etiqueta;
}

function campoCorreccionRevisor(criterio) {
  var opciones = criterio.opcionesCorreccion || [];
  var campo;
  if (opciones.length) {
    campo = document.createElement('select');
    var vacia = document.createElement('option');
    vacia.value = '';
    vacia.textContent = 'Seleccione una opción';
    campo.appendChild(vacia);
    opciones.forEach(function (valor) {
      var opcion = document.createElement('option');
      opcion.value = valor;
      opcion.textContent = valor;
      campo.appendChild(opcion);
    });
  } else {
    campo = document.createElement('input');
    campo.type = criterio.tipoCorreccion === 'fecha' ? 'date' : 'text';
    if (campo.type === 'text') {
      campo.maxLength = 500;
      campo.autocomplete = 'off';
      campo.placeholder = 'Escriba el valor correcto según el soporte';
    }
  }
  campo.className = 'campo-correccion-revisor';
  if (criterio.normalizarCorreccion === 'mayusculas') campo.classList.add('campo-mayusculas');
  return campo;
}

function refrescarCriterioRevisor(fila) {
  if (!fila) return;
  var elegido = fila.querySelector('input[type="radio"]:checked');
  var correccion = fila.querySelector('.correccion-revisor');
  if (correccion) {
    correccion.classList.toggle('visible', !!(elegido && elegido.value === REV_NO_CONFORME));
  }
  if (elegido) fila.classList.remove('sin-responder');
}

function recolectarDecision() {
  var criterios = {};
  Array.prototype.forEach.call($('criteriosRevisor').querySelectorAll('.criterio-revisor'), function (fila) {
    var elegido = fila.querySelector('input[type="radio"]:checked');
    var campo = fila.querySelector('.campo-correccion-revisor');
    criterios[fila.getAttribute('data-clave')] = {
      valor: elegido ? elegido.value : '',
      correccion: elegido && elegido.value === REV_NO_CONFORME && campo ? campo.value.trim() : ''
    };
    fila.classList.toggle('sin-responder', !elegido);
  });
  return criterios;
}

function decidirRevision(decision) {
  if (!FICHA || !FICHA.guardado || FICHA.guardando || !esRevisor() ||
      FICHA.guardado.estadoRevision !== REV_EN_REVISION) return;

  var criterios = recolectarDecision();
  var faltantes = Object.keys(criterios).filter(function (clave) { return !criterios[clave].valor; });
  var observacion = $('observacionRevisor').value.trim();
  if (faltantes.length) {
    mostrarAviso($('avisoGuardado'), 'error',
      'Debe revisar todos los campos antes de tomar una decisión.');
    return;
  }
  var correccionesFaltantes = decision === REV_APROBADO && Object.keys(criterios).filter(function (clave) {
    return criterios[clave].valor === REV_NO_CONFORME && !criterios[clave].correccion;
  });
  if (correccionesFaltantes && correccionesFaltantes.length) {
    mostrarAviso($('avisoGuardado'), 'error',
      'Para aprobar, escriba el valor correcto de cada campo marcado como no conforme.');
    var primera = $('criteriosRevisor').querySelector(
      '.criterio-revisor[data-clave="' + correccionesFaltantes[0] + '"] .campo-correccion-revisor');
    if (primera) primera.focus();
    return;
  }
  if (decision === REV_DEVUELTO && !observacion) {
    mostrarAviso($('avisoGuardado'), 'error',
      'Escriba qué debe corregir Talento Humano antes de devolver el expediente.');
    $('observacionRevisor').focus();
    return;
  }

  FICHA.guardando = true;
  $('btnAprobar').disabled = true;
  $('btnDevolver').disabled = true;
  mostrarCapa(decision === REV_APROBADO ? 'Aprobando...' : 'Devolviendo a Talento Humano...');

  servidor('decidirRevision', {
    documento: FICHA.documento,
    version: FICHA.guardado.version,
    decision: decision,
    criterios: criterios,
    observacion: observacion
  }, function (respuesta) {
    FICHA.guardando = false;
    ocultarCapa();
    fusionarDocente(respuesta.documento, {
      estado: respuesta.estado,
      estadoRevision: respuesta.estadoRevision,
      version: respuesta.version,
      estadoMen: respuesta.estadoMen || '',
      decisionRevision: decision,
      observacionRevision: observacion
    });
    var nombre = FICHA.docente.nombreCompleto || FICHA.documento;
    var mensaje;
    if (decision === REV_DEVUELTO) {
      mensaje = '↩ ' + nombre + ' devuelto a Talento Humano para corregir.';
    } else if (respuesta.estadoMen === MEN_SIN_NOVEDAD) {
      mensaje = '✓ ' + nombre + ' aprobado sin novedad: sus datos coinciden con SNIES y el ' +
        'trámite quedó cerrado.';
    } else {
      mensaje = '✓ ' + nombre + ' aprobado. Tiene datos a corregir: ahora está «Por radicar».';
    }
    volverAlListado(true);
    mostrarAviso($('avisoGeneral'), 'exito', mensaje, true);
    refrescarEnSilencio();
  }, function (mensaje) {
    FICHA.guardando = false;
    $('btnAprobar').disabled = false;
    $('btnDevolver').disabled = false;
    ocultarCapa();
    mostrarAviso($('avisoGuardado'), 'error', 'No fue posible registrar la decisión: ' + mensaje);
  });
}

/* ------------------------------------------------------------
   VISOR DE SOPORTES

function pintarPrevisualizacion() {
  var panel = $('previsualizacion');
  var guardado = FICHA && FICHA.guardado;
  var hayActa = !!(guardado && guardado.previewActa);
  var hayDiploma = !!(guardado && guardado.previewDiploma);
  panel.hidden = !hayActa && !hayDiploma;

/** Coloca visor y decisión lado a lado solo cuando ambos están visibles. */

  var hayPanel = !$('panelRevisor').hidden;
  espacio.hidden = !hayVisor && !hayPanel;

}

function mostrarDocumento(tipo) {

/* ------------------------------------------------------------
   INFORME DE GESTIÓN

   Tres secciones:
     1. Estado del reporte      -> foto de hoy
     2. Hallazgos y correcciones -> foto de hoy
     3. Actividad por persona   -> depende del periodo elegido

   El periodo solo filtra el historial: por eso sus selectores viven
   dentro de la sección 3, la única a la que afecta.
   ------------------------------------------------------------ */

function abrirTablero() {
  if (!(esRevisor() || esConsulta())) return;
  if (!PERIODO.hasta) {
    var hoy = new Date();
    PERIODO.hasta = fechaIsoLocal(hoy);
    PERIODO.desde = fechaIsoLocal(new Date(hoy.getFullYear(), hoy.getMonth(), 1));
  }
  mostrarVista('tablero');
  cargarInforme();
}

function cargarInforme() {
  $('tableroCargando').hidden = false;
  $('tableroContenido').hidden = true;
  ocultarAviso($('tableroError'));

  servidor('obtenerInformeGestion', {
    desde: PERIODO.desde,
    hasta: PERIODO.hasta
  }, function (informe) {
    $('tableroCargando').hidden = true;
    pintarTablero(informe);
    $('tableroContenido').hidden = false;
  }, function (mensaje) {
    $('tableroCargando').hidden = true;
    mostrarAviso($('tableroError'), 'error', 'No fue posible generar el informe: ' + mensaje);
  });
}

/**
 * Construye una tabla del informe dentro de un contenedor desplazable.
 *
 * `columnasLargas` son los índices de las columnas con texto libre
 * (motivos, observaciones): solo esas parten en varias líneas. El resto
 * va en una sola línea, porque si el navegador puede partir cualquier
 * celda estrangula la columna más estrecha —"Talento Humano" acababa
 * en seis líneas de tres letras.
 */
function tablaInforme(encabezados, filas, columnasLargas) {
  var largas = columnasLargas || [];

  var tabla = crear('table', 'tabla-informe');
  var thead = crear('thead');
  var filaEnc = crear('tr');
  encabezados.forEach(function (texto, i) {
    filaEnc.appendChild(crear('th', largas.indexOf(i) !== -1 ? 'celda-larga' : null, texto));
  });
  thead.appendChild(filaEnc);
  tabla.appendChild(thead);

  var tbody = crear('tbody');
  filas.forEach(function (fila) {
    var tr = crear('tr');
    fila.forEach(function (celda, i) {
      tr.appendChild(crear('td', largas.indexOf(i) !== -1 ? 'celda-larga' : null,
        celda === '' || celda == null ? '—' : String(celda)));
    });
    tbody.appendChild(tr);
  });
  tabla.appendChild(tbody);

  var caja = crear('div', 'tabla-desplazable');
  caja.appendChild(tabla);
  return caja;
}

/** Rótulo en versalita que estampa a qué momento corresponde un bloque. */
function estampa(texto) { return crear('p', 'estampa', texto); }

function textoPeriodo() {
  if (!PERIODO.desde && !PERIODO.hasta) return 'Todo el historial registrado';
  return 'Movimientos entre ' + (PERIODO.desde || 'el inicio') + ' y ' + (PERIODO.hasta || 'hoy');
}

function seccionInforme(titulo) {
  var s = crear('section', 'tarjeta tarjeta-neutra seccion-informe');
  s.appendChild(crear('h3', 'titulo-seccion', titulo));
  return s;
}

function pintarTablero(informe) {
  var caja = $('tableroContenido');
  vaciar(caja);

  var registros = informe.registros || [];
  var rol = APP.perfil.rol;

  /* --- Cabecera en una línea --- */
  var cabecera = crear('div', 'tarjeta informe-cabecera');
  var titulo = crear('h2', 'titulo-vista', 'Informe de gestión');
  titulo.id = 'tableroTitulo';
  cabecera.appendChild(titulo);
  cabecera.appendChild(crear('p', 'informe-linea',
    (APP.auditoria || 'Auditoría documental') +
    ' · Generado el ' + (informe.generado || '—') +
    ' · Solicitado por ' + ((APP.perfil && APP.perfil.correo) || '—')));
  caja.appendChild(cabecera);

  if (Number(informe.contrato) < CONTRATO_ESPERADO ||
      (registros.length && registros.every(function (r) { return r.hallazgos === undefined; }))) {
    var alerta = crear('div', 'aviso aviso-aviso');
    alerta.appendChild(crear('p', null,
      'El servidor publicado es anterior a esta página: parte del informe no se puede ' +
      'calcular hasta que se publique la versión nueva en Apps Script.'));
    caja.appendChild(alerta);
  }

  var sits = registros.map(function (r) { return situacion(r, rol); });

  caja.appendChild(pintarEstadoReporte(sits, informe.generado));
  caja.appendChild(pintarHallazgos(registros, sits));
  caja.appendChild(pintarActividad(informe));

  // Solo visible en papel: una hoja suelta sigue diciendo de cuándo es.
  caja.appendChild(crear('p', 'pie-impreso',
    (APP.auditoria || 'Auditoría documental') + ' · Generado el ' + (informe.generado || '—') +
    ' · Actividad: ' + textoPeriodo() +
    ' · ' + ((APP.perfil && APP.perfil.correo) || '')));
}

/** Sección 1: la misma barra de la bandeja y quién tiene cada cosa. */
function pintarEstadoReporte(sits, generado) {
  var s = seccionInforme('Estado del reporte');
  s.appendChild(estampa('Estado al ' + (generado || 'día de hoy')));

  var conteo = contarFases(sits);
  var total = crear('p', 'avance-total');
  pintarAvanceTotal(total, conteo.CERRADO, sits.length);
  s.appendChild(total);

  var barra = crear('div', 'barra-fases');
  barra.setAttribute('role', 'img');
  var leyenda = crear('ol', 'barra-fases-leyenda');
  pintarBarraFases(barra, leyenda, conteo, sits.length);
  s.appendChild(barra);
  s.appendChild(leyenda);

  var porClave = contarSituaciones(sits);
  var filas = ORDEN_SITUACION.filter(function (c) { return porClave[c]; }).map(function (c) {
    return [SITUACIONES[c].etiqueta, porClave[c], nombreActor(SITUACIONES[c].actor)];
  });
  if (filas.length) s.appendChild(tablaInforme(['Situación', 'Docentes', 'Le toca a'], filas));
  return s;
}

/** Sección 2: qué hubo que corregir y dónde va cada corrección. */
function pintarHallazgos(registros, sits) {
  var s = seccionInforme('Hallazgos y correcciones');
  var conValores = registros.some(function (r) {
    return (r.hallazgos || []).some(function (h) { return h.reportado !== undefined; });
  });

  var situacionDe = {};
  registros.forEach(function (r, i) { situacionDe[r.documento] = sits[i]; });

  var conHallazgo = registros.filter(function (r) { return (r.hallazgos || []).length; });
  var campos = 0;
  var frecuencia = {};
  conHallazgo.forEach(function (r) {
    r.hallazgos.forEach(function (h) {
      campos++;
      frecuencia[h.etiqueta] = (frecuencia[h.etiqueta] || 0) + 1;
    });
  });

  var cuenta = { confirmados: 0, radicados: 0, sinRadicar: 0 };
  conHallazgo.forEach(function (r) {
    var clave = situacionDe[r.documento].clave;
    if (clave === 'CONFIRMADO') cuenta.confirmados++;
    else if (clave === 'RADICADO') cuenta.radicados++;
    else cuenta.sinRadicar++;
  });

  var validados = registros.filter(function (r) {
    return r.tieneValidacion !== undefined ? r.tieneValidacion : r.revisado;
  }).length;
  var sinCargar = registros.length - validados;

  var masFrecuentes = Object.keys(frecuencia).sort(function (a, b) {
    return frecuencia[b] - frecuencia[a];
  }).slice(0, 3).map(function (e) { return e + ' (' + frecuencia[e] + ')'; });

  var frase = 'De ' + registros.length + ' docentes, ' + validados +
    (validados === 1 ? ' tiene' : ' tienen') + ' la validación cargada. ';
  if (conHallazgo.length) {
    frase += conHallazgo.length + (conHallazgo.length === 1 ? ' tiene' : ' tienen') +
      ' datos a corregir (' + campos + (campos === 1 ? ' campo' : ' campos') + '): ' +
      cuenta.confirmados + ' confirmados en SNIES, ' + cuenta.radicados + ' radicados y ' +
      cuenta.sinRadicar + ' sin radicar.';
    if (masFrecuentes.length) frase += ' Más frecuentes: ' + masFrecuentes.join(', ') + '.';
  } else {
    frase += 'Ninguno tiene datos a corregir.';
  }
  if (sinCargar) frase += ' ' + sinCargar + ' sin cargar.';
  s.appendChild(crear('p', 'informe-frase', frase));

  if (conHallazgo.length) {
    var columnas = ['Documento', 'Docente', 'Campo'];
    if (conValores) columnas.push('Dice SNIES', 'Debe decir');
    columnas.push('Detectado por', 'Situación');

    var filas = [];
    conHallazgo.forEach(function (r) {
      r.hallazgos.forEach(function (h, i) {
        var fila = [i === 0 ? r.documento : '', i === 0 ? r.docente : '', h.etiqueta];
        if (conValores) fila.push(h.reportado, h.correcto);
        fila.push(nombreRol(h.origen), i === 0 ? situacionDe[r.documento].etiqueta : '');
        filas.push(fila);
      });
    });
    s.appendChild(tablaInforme(columnas, filas, conValores ? [3, 4] : []));

    s.appendChild(crear('p', 'nota-pie', conValores
      ? '«Dice SNIES» es el valor de la plantilla oficial; «Debe decir» es el que consta en ' +
        'el acta o el diploma. La hoja Docentes conserva el dato original: esta es la lista ' +
        'de cambios a aplicar en el archivo.'
      : 'Esta cuenta ve qué campos se corrigieron, no los valores.'));
  }
  return s;
}

/** Sección 3: la única que depende del periodo. */
function pintarActividad(informe) {
  var s = seccionInforme('Actividad por persona');

  var cabecera = crear('div', 'informe-periodo');
  cabecera.appendChild(estampa(textoPeriodo()));

  var controles = crear('div', 'informe-controles');
  var campo = function (texto, clave) {
    var etiqueta = crear('label', null, texto + ' ');
    var input = document.createElement('input');
    input.type = 'date';
    input.value = PERIODO[clave];
    input.addEventListener('change', function () { PERIODO[clave] = this.value; });
    etiqueta.appendChild(input);
    return etiqueta;
  };
  controles.appendChild(campo('Desde', 'desde'));
  controles.appendChild(campo('Hasta', 'hasta'));
  var actualizar = crear('button', 'btn-secundario btn-compacto', 'Actualizar');
  actualizar.type = 'button';
  actualizar.addEventListener('click', cargarInforme);
  controles.appendChild(actualizar);
  cabecera.appendChild(controles);
  s.appendChild(cabecera);

  var usuarios = informe.usuarios || [];
  if (!usuarios.length) {
    s.appendChild(crear('p', 'nota-pie', 'Nadie registró actividad en este periodo.'));
    return s;
  }

  var usados = {};
  usuarios.forEach(function (u) { Object.keys(u.eventos || {}).forEach(function (e) { usados[e] = true; }); });
  var eventos = ORDEN_EVENTOS.filter(function (e) { return usados[e]; })
    .concat(Object.keys(usados).filter(function (e) { return ORDEN_EVENTOS.indexOf(e) === -1; }));

  var totales = eventos.map(function () { return 0; });
  var totalGeneral = 0;
  var filas = usuarios.map(function (u) {
    totalGeneral += u.total || 0;
    return [u.correo, nombreRol(u.rol), u.total].concat(eventos.map(function (e, i) {
      var n = (u.eventos && u.eventos[e]) || 0;
      totales[i] += n;
      return n;
    }));
  });
  filas.push(['Total', '', totalGeneral].concat(totales));

  var tabla = tablaInforme(['Persona', 'Rol', 'Total'].concat(eventos.map(nombreEvento)), filas);
  var ultima = tabla.querySelector('tbody tr:last-child');
  if (ultima) ultima.classList.add('fila-total');
  s.appendChild(tabla);
  return s;
}

/* ------------------------------------------------------------
   CSV
   ------------------------------------------------------------ */

function escaparCsv(valor) {
  var texto = String(valor == null ? '' : valor);
  return '"' + texto.replace(/"/g, '""') + '"';
}

function descargarCsv(nombre, filas) {
  var contenido = '\ufeff' + filas.map(function (fila) {
    return fila.map(escaparCsv).join(';');
  }).join('\r\n');
  var enlace = document.createElement('a');
  enlace.href = URL.createObjectURL(new Blob([contenido], { type: 'text/csv;charset=utf-8' }));
  enlace.download = nombre;
  document.body.appendChild(enlace);
  enlace.click();
  setTimeout(function () {
    URL.revokeObjectURL(enlace.href);
    enlace.remove();
  }, 0);
}

function descargarInformeGestion() {
  if (!(esRevisor() || esConsulta())) return;
  var boton = $('btnDescargarInforme');
  boton.disabled = true;
  boton.textContent = 'Generando...';
  servidor('obtenerInformeGestion', {
    desde: PERIODO.desde,
    hasta: PERIODO.hasta
  }, function (informe) {
    boton.disabled = false;
    boton.textContent = 'Descargar CSV';
    var rol = APP.perfil.rol;
    var registros = informe.registros || [];
    var fases = {};
    FASES.forEach(function (f) { fases[f.clave] = f.nombre; });

    var filas = [
      ['INFORME DE GESTIÓN', APP.auditoria],
      ['Generado', informe.generado],
      ['Actividad', textoPeriodo()],
      [],
      ['ESTADO ACTUAL'],
      ['Documento', 'Docente', 'Fase', 'Situación', 'Le toca a', 'Desde',
       'Guardado por', 'Última modificación', 'Enviado por', 'Fecha envío',
       'Revisado por', 'Fecha revisión', 'Subsanación por', 'Fecha subsanación',
       'Disponible para radicar', 'Motivo subsanación', 'Radicado por', 'Fecha radicación MEN',
       'Confirmado en SNIES por', 'Fecha de confirmación']
    ];
    registros.forEach(function (r) {
      var sit = situacion(r, rol);
      filas.push([r.documento, r.docente, fases[sit.fase], sit.etiqueta, nombreActor(sit.actor),
        sit.fechaEntrada, r.guardadoPor, r.fechaModificacion, r.enviadoPor, r.fechaEnvio,
        r.revisadoPor, r.fechaRevision, r.subsanacionPor, r.fechaSubsanacion,
        r.fechaDisponibleRadicacion, r.motivoSubsanacion, r.radicadoPor, r.fechaRadicacionMen,
        r.sincronizadoPor, r.fechaSincronizacion]);
    });

    var conValores = registros.some(function (r) {
      return (r.hallazgos || []).some(function (h) { return h.reportado !== undefined; });
    });
    var cabeceraHallazgos = ['Documento', 'Docente', 'Campo'];
    if (conValores) cabeceraHallazgos.push('Dice SNIES', 'Debe decir');
    cabeceraHallazgos.push('Detectado por', 'Situación');
    filas.push([], ['HALLAZGOS'], cabeceraHallazgos);
    registros.forEach(function (r) {
      var etiqueta = situacion(r, rol).etiqueta;
      (r.hallazgos || []).forEach(function (h) {
        var fila = [r.documento, r.docente, h.etiqueta];
        if (conValores) fila.push(h.reportado, h.correcto);
        fila.push(nombreRol(h.origen), etiqueta);
        filas.push(fila);
      });
    });

    filas.push([], ['RESUMEN POR PERSONA'], ['Correo', 'Rol', 'Total acciones', 'Detalle']);
    (informe.usuarios || []).forEach(function (u) {
      var detalle = Object.keys(u.eventos || {}).map(function (e) {
        return nombreEvento(e) + ': ' + u.eventos[e];
      }).join(' | ');
      filas.push([u.correo, nombreRol(u.rol), u.total, detalle]);
    });

    filas.push([], ['HISTORIAL DEL PERIODO'], [
      'Fecha', 'Documento', 'Docente', 'Movimiento', 'Estado anterior',
      'Estado nuevo', 'Correo', 'Rol', 'Observación'
    ]);
    (informe.historial || []).forEach(function (h) {
      filas.push([h.fecha, h.documento, h.docente, nombreEvento(h.evento), h.estadoAnterior,
        h.estadoNuevo, h.correo, nombreRol(h.rol), h.observacion]);
    });

    descargarCsv('informe-auditoria-snies-' + (PERIODO.hasta || fechaIsoLocal(new Date())) + '.csv', filas);
    mostrarAviso($('avisoGeneral'), 'exito', '✓ Informe de gestión descargado.');
  }, function (mensaje) {
    boton.disabled = false;
    boton.textContent = 'Descargar CSV';
    mostrarAviso($('tableroError'), 'error', 'No fue posible generar el informe: ' + mensaje);
  });
}
