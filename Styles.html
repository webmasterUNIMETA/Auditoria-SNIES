<style>
/* ============================================================
   Styles.html
   Validacion documental de docentes - Auditoria SNIES - UNIMETA

   El sistema visual es el mismo del formulario de actualizacion de
   datos: superficies planas, rojo institucional como unico acento,
   tipografia Archivo y micro-rotulos en versalita. La unica licencia
   que se toma es un radio de 4px en tarjetas, campos y botones.

   TODOS los colores estan centralizados en el bloque :root. Para
   cambiar la identidad visual basta con editar esas variables.
   ============================================================ */

:root {
  /* --- Colores institucionales, tomados del logotipo UNIMETA --- */
  --color-primario:        #D81824;   /* rojo del logotipo */
  --color-primario-oscuro: #A8111B;   /* rojo para estados hover y textos */
  --color-primario-suave:  #FDEEEF;   /* tinte de fondo */
  --color-primario-borde:  #F2C9CC;   /* borde sobre el tinte */
  --color-azul:            #243C84;   /* azul del escudo: foco y notas */
  --color-azul-suave:      #F1F3F9;   /* fondo de las notas informativas */

  /* --- Neutros --- */
  --color-texto:           #1E2024;
  --color-texto-medio:     #3A3E45;
  --color-texto-suave:     #5C6169;
  --color-texto-tenue:     #8A8F96;
  --color-borde:           #E0E2E6;
  --color-borde-fuerte:    #B9BDC4;
  --color-fondo:           #F3F2F2;   /* fondo de pagina */
  --color-superficie:      #FFFFFF;
  --color-superficie-2:    #F8F8F8;   /* bloques embebidos */

  /* --- Estados --- */
  --color-error:           #A8111B;
  --color-error-fondo:     #FDEEEF;
  --color-error-borde:     #F2C9CC;
  --color-exito:           #1B5E20;
  --color-exito-fondo:     #EDF6EE;
  --color-exito-borde:     #C3E0C6;
  --color-aviso:           #8A6100;
  --color-aviso-fondo:     #FFF6E0;
  --color-aviso-borde:     #F0DCA8;

  /* --- Medidas --- */
  --ancho-max:             1140px;
  --relleno-tarjeta:       28px;
  --radio:                 4px;
  --radio-grande:          6px;
  --transicion:            160ms ease;

  /* --- Tipografia --- */
  --tipo: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  padding: 0;
  background: var(--color-fondo);
  color: var(--color-texto);
  font-family: var(--tipo);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--color-primario-oscuro); text-underline-offset: 3px; }
a:hover { color: var(--color-primario); }

::selection { background: var(--color-primario-suave); }

/* Foco visible unico para toda la aplicacion */
a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--color-azul);
  outline-offset: 2px;
}

/* ============================================================
   ENCABEZADO Y AVANCE
   ============================================================ */

/* El encabezado es blanco: el logotipo es rojo sobre transparente y el
   escudo es multicolor, asi que sobre un fondo de color perderia nitidez. */
.encabezado { background: var(--color-superficie); }

.encabezado-interno {
  max-width: var(--ancho-max);
  margin: 0 auto;
  padding: 22px 24px;
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
}

.logo { height: 60px; width: auto; flex: none; }

.encabezado-textos {
  border-left: 1px solid var(--color-borde);
  padding-left: 22px;
  flex: 1 1 260px;
  min-width: 0;
}

.encabezado h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1.1;
  color: var(--color-texto);
}

.encabezado p {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--color-texto-suave);
}

/* Franja institucional bajo el encabezado */
.franja { height: 4px; background: var(--color-primario); }

/* Quien tiene la sesion abierta */
.sesion { text-align: right; flex: none; }

.sesion-correo {
  margin: 0 0 2px;
  font-size: 12.5px;
  color: var(--color-texto-suave);
  overflow-wrap: anywhere;
}
.sesion-rol {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--color-azul);
}

.selector-rol {
  margin: 6px 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
  font-size: 11px;
  font-weight: 700;
  color: var(--color-texto-suave);
}

.selector-rol select {
  width: auto;
  min-width: 150px;
  padding: 6px 30px 6px 9px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--color-texto);
  background-color: var(--color-superficie);
}

/* ============================================================
   PUERTA DE ENTRADA

   Tapa la aplicacion entera hasta que Google confirma la identidad.
   No es decorativa: mientras esta visible no se ha pedido ni un dato
   al servidor.
   ============================================================ */

.puerta {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--color-fondo);
  overflow-y: auto;
}

.puerta[hidden] { display: none !important; }

.puerta-tarjeta {
  width: min(460px, 100%);
  padding: 36px 32px;
  background: var(--color-superficie);
  border: 1px solid var(--color-borde);
  border-top: 3px solid var(--color-primario);
  border-radius: var(--radio);
  text-align: center;
}

.puerta-tarjeta .logo {
  height: 52px;
  margin: 0 auto 22px;
  display: block;
}

.puerta-tarjeta h1 {
  margin: 0 0 10px;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1.15;
  color: var(--color-texto);
}

.puerta-texto {
  margin: 0 0 24px;
  font-size: 14px;
  color: var(--color-texto-suave);
  text-wrap: pretty;
}

/* Aqui dibuja Google su propio boton; solo se le da sitio. */
.puerta-boton {
  display: flex;
  justify-content: center;
  min-height: 44px;
  margin-bottom: 8px;
}

.puerta .aviso { margin: 18px 0 0; text-align: left; }

.puerta-pie {
  margin: 22px 0 0;
  padding-top: 18px;
  border-top: 1px solid var(--color-borde);
  font-size: 12px;
  color: var(--color-texto-tenue);
}

/* ============================================================
   ESTRUCTURA
   ============================================================ */

main {
  max-width: var(--ancho-max);
  margin: 0 auto;
  padding: 28px 24px 80px;
}

.vista { display: none; }
.vista.activa { display: block; animation: aparecer 200ms ease; }

@keyframes aparecer {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* Tarjeta: superficie plana con remate rojo superior */
.tarjeta {
  background: var(--color-superficie);
  border: 1px solid var(--color-borde);
  border-top: 3px solid var(--color-primario);
  border-radius: var(--radio);
  padding: var(--relleno-tarjeta);
  margin-bottom: 18px;
}

/* Variante sin remate, para bloques secundarios */
.tarjeta-simple { border-top: 1px solid var(--color-borde); }

/* Variante neutra: la usa la tarjeta del listado, que queda justo debajo
   del remate rojo del indicador "Con correcciones". Dos rojos seguidos se
   leian como un solo bloque. El gris es el mismo del indicador "Total
   docentes", de modo que el rojo sigue siendo el unico acento. */
.tarjeta-neutra { border-top-color: var(--color-texto-medio); }

.titulo-vista {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1.12;
  color: var(--color-texto);
}

.descripcion-vista {
  margin: 0 0 20px;
  font-size: 15px;
  color: var(--color-texto-suave);
  max-width: 64ch;
  text-wrap: pretty;
}

.subtitulo {
  margin: 28px 0 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--color-texto-suave);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--color-borde);
}

.subtitulo:first-child { margin-top: 0; }

.nota-pie {
  margin: 16px 0 0;
  font-size: 12.5px;
  color: var(--color-texto-suave);
}

/* ============================================================
   INDICADORES (las cuatro tarjetas de avance)

   Misma tira segmentada que usa el formulario de referencia para
   mostrar datos del tramite: un solo bloque blanco dividido por
   filetes, con el rotulo en versalita y la cifra debajo. Cada celda
   lleva un remate superior del color de su estado.
   ============================================================ */

.tira-indicadores {
  display: flex;
  flex-wrap: wrap;
  background: var(--color-superficie);
  border: 1px solid var(--color-borde);
  border-radius: var(--radio);
  margin-bottom: 18px;
  overflow: hidden;
}

/* Cada celda es un boton: al pulsarla filtra el listado por ese estado.
   Hereda del boton general, asi que empieza por deshacer ese estilo. */
.indicador {
  flex: 1 1 180px;
  padding: 16px 18px;
  min-width: 0;
  border: 0;
  border-right: 1px solid var(--color-borde);
  border-top: 3px solid var(--color-borde-fuerte);
  border-radius: 0;
  background: var(--color-superficie);
  font-family: inherit;
  font-weight: 400;
  text-align: left;
  cursor: pointer;
  transition: background var(--transicion);
}

.indicador:last-child { border-right: 0; }

.indicador:hover { background: var(--color-superficie-2); }

/* El filtro activo se tine con el color de su propio estado */
.indicador-total.activo      { background: var(--color-superficie-2); }
.indicador-sin-cargar.activo { background: var(--color-superficie-2); }
.indicador-pendientes.activo { background: var(--color-aviso-fondo); }
.indicador-revision.activo   { background: var(--color-azul-suave); }
.indicador-validados.activo  { background: var(--color-exito-fondo); }
.indicador-correccion.activo { background: var(--color-error-fondo); }

.indicador.activo p:first-child { color: var(--color-texto); }

.indicador-total       { border-top-color: var(--color-texto-medio); }
.indicador-sin-cargar  { border-top-color: var(--color-borde-fuerte); }
.indicador-pendientes  { border-top-color: var(--color-aviso); }
.indicador-revision    { border-top-color: var(--color-azul); }
.indicador-validados   { border-top-color: var(--color-exito); }
.indicador-correccion  { border-top-color: var(--color-primario); }

.indicador p:first-child {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--color-texto-suave);
}

.indicador p:last-child {
  margin: 4px 0 0;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1.1;
  color: var(--color-texto);
  font-variant-numeric: tabular-nums;
}

.indicador-sin-cargar p:last-child { color: var(--color-texto-medio); }
.indicador-pendientes p:last-child { color: var(--color-aviso); }
.indicador-revision p:last-child   { color: var(--color-azul); }
.indicador-validados  p:last-child { color: var(--color-exito); }
.indicador-correccion p:last-child { color: var(--color-error); }
.indicador-men-pendiente { border-top-color: var(--color-aviso); }
.indicador-men-subsanacion { border-top-color: var(--color-primario); }
.indicador-men-listo { border-top-color: var(--color-azul); }
.indicador-men-radicado { border-top-color: var(--color-exito); }
.indicador-men-pendiente p:last-child { color: var(--color-aviso); }
.indicador-men-subsanacion p:last-child { color: var(--color-error); }
.indicador-men-listo p:last-child { color: var(--color-azul); }
.indicador-men-radicado p:last-child { color: var(--color-exito); }
.indicador-men-pendiente.activo { background: var(--color-aviso-fondo); }
.indicador-men-subsanacion.activo { background: var(--color-error-fondo); }
.indicador-men-listo.activo { background: var(--color-azul-suave); }
.indicador-men-radicado.activo { background: var(--color-exito-fondo); }

/* ============================================================
   BUSCADOR
   ============================================================ */

/* Campo llano, como el resto de los campos del sistema: sin icono
   decorativo encima del texto. */
.buscador input[type="search"] { font-size: 15px; }

.conteo-resultados {
  margin: 12px 0 0;
  font-size: 12.5px;
  color: var(--color-texto-suave);
}

.panel-informe {
  display: flex;
  align-items: end;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid var(--color-borde);
}
.panel-informe > div { flex: 1 1 320px; }
.panel-informe h3 { margin: 0 0 4px; font-size: 15px; }
.panel-informe p { margin: 0; color: var(--color-texto-suave); font-size: 12.5px; }
.panel-informe label { margin: 0; min-width: 145px; }
.panel-informe input { margin-top: 6px; }

/* ============================================================
   PANEL DE ETAPA

   Dónde está el expediente, qué significa y qué toca hacer. Va arriba
   del todo en la ficha. El tono da el color del filete izquierdo:

     accion   -> le toca a quien mira (rojo institucional)
     atencion -> hay algo que corregir (rojo suave)
     espera   -> no hay nada que hacer todavía (azul)
     cerrado  -> el trámite terminó (verde)
   ============================================================ */

.panel-etapa {
  margin: 0 0 18px;
  padding: 18px 20px;
  background: var(--color-superficie);
  border: 1px solid var(--color-borde);
  border-left: 3px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
}

.panel-etapa h3 {
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -.01em;
  color: var(--color-texto);
}

.panel-etapa p {
  margin: 0 0 8px;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--color-texto-medio);
  max-width: 78ch;
  text-wrap: pretty;
}

.panel-etapa p:last-child { margin-bottom: 0; }

.panel-etapa-accion   { border-left-color: var(--color-primario); }
.panel-etapa-atencion { border-left-color: var(--color-primario); background: var(--color-error-fondo); }
.panel-etapa-espera   { border-left-color: var(--color-azul);   background: var(--color-azul-suave); }
.panel-etapa-cerrado  { border-left-color: var(--color-exito);  background: var(--color-exito-fondo); }

.panel-etapa-accion h3   { color: var(--color-error); }
.panel-etapa-atencion h3 { color: var(--color-error); }
.panel-etapa-cerrado h3  { color: var(--color-exito); }

/* La cita recoge el texto que escribió una persona: motivo de devolución
   o de subsanación. Se distingue del texto del sistema. */
.panel-etapa-cita {
  margin: 12px 0 0;
  padding: 12px 16px;
  background: var(--color-superficie);
  border: 1px solid var(--color-borde);
  border-radius: var(--radio);
}

.panel-etapa-cita p {
  margin: 0;
  font-size: 14px;
  color: var(--color-texto);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.panel-etapa-cita footer {
  margin-top: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--color-texto-tenue);
}

.panel-etapa-lista {
  margin: 12px 0 0;
  padding-left: 20px;
  font-size: 13.5px;
  color: var(--color-texto-medio);
}

.panel-etapa-lista li { margin-bottom: 3px; }
.panel-etapa-lista li:first-child { list-style: none; margin-left: -20px; font-weight: 600; }

/* Rótulo que desambigua una insignia cuyo significado cambia */
.par-insignias {
  display: inline-flex;
  flex-direction: column;
  gap: 3px;
  margin-right: 12px;
  vertical-align: top;
}

.micro-rotulo {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--color-texto-tenue);
}

/* Nota en una tarjeta que no ofrece acción, en lugar de un botón muerto */
.nota-accion {
  font-size: 12.5px;
  color: var(--color-texto-suave);
  font-style: italic;
  white-space: nowrap;
}

/* Botón de cerrar dentro de un aviso persistente */
.aviso-cerrar { margin-left: 10px; color: inherit; }

/* Los tres pasos del trámite, en el listado de Talento Humano */
.guia-flujo {
  margin: 18px 0 0;
  padding: 14px 18px;
  background: var(--color-azul-suave);
  border-left: 3px solid var(--color-azul);
  border-radius: 0 var(--radio) var(--radio) 0;
}

.guia-flujo-titulo {
  margin: 0 0 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--color-texto-suave);
}

.guia-flujo ol {
  margin: 0;
  padding-left: 20px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--color-texto-medio);
}

/* ============================================================
   LISTADO DE DOCENTES
   ============================================================ */

.lista-docentes { display: flex; flex-direction: column; gap: 10px; }

.docente {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 16px 18px;
  background: var(--color-superficie);
  border: 1px solid var(--color-borde);
  border-left: 3px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
  transition: border-color var(--transicion);
}

.docente:hover { border-color: var(--color-borde-fuerte); }

.docente-PENDIENTE            { border-left-color: var(--color-aviso); }
.docente-PENDIENTE_CARGA      { border-left-color: var(--color-borde-fuerte); }
.docente-VALIDADO             { border-left-color: var(--color-exito); }
.docente-REQUIERE_CORRECCION  { border-left-color: var(--color-primario); }
.docente-POR_ENVIAR           { border-left-color: var(--color-aviso); }
.docente-EN_REVISION          { border-left-color: var(--color-azul); }
.docente-DEVUELTO             { border-left-color: var(--color-primario); }
.docente-APROBADO             { border-left-color: var(--color-exito); }

.docente-datos { flex: 1 1 280px; min-width: 0; }

.docente-nombre {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--color-texto);
  overflow-wrap: anywhere;
}

.docente-documento {
  margin: 3px 0 0;
  font-size: 12.5px;
  color: var(--color-texto-suave);
  font-variant-numeric: tabular-nums;
}

.docente-acciones {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}


/* Insignia de estado */
.insignia {
  display: inline-block;
  padding: 5px 10px;
  border: 1px solid;
  border-radius: var(--radio);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.insignia-PENDIENTE {
  color: var(--color-aviso);
  background: var(--color-aviso-fondo);
  border-color: var(--color-aviso-borde);
}

.insignia-PENDIENTE_CARGA {
  color: var(--color-texto-medio);
  background: var(--color-superficie-2);
  border-color: var(--color-borde-fuerte);
}

.insignia-VALIDADO {
  color: var(--color-exito);
  background: var(--color-exito-fondo);
  border-color: var(--color-exito-borde);
}

.insignia-REQUIERE_CORRECCION {
  color: var(--color-error);
  background: var(--color-error-fondo);
  border-color: var(--color-error-borde);
}

.insignia-POR_ENVIAR {
  color: var(--color-aviso);
  background: var(--color-aviso-fondo);
  border-color: var(--color-aviso-borde);
}

.insignia-EN_REVISION {
  color: var(--color-azul);
  background: var(--color-azul-suave);
  border-color: #C9D1EA;
}

.insignia-DEVUELTO {
  color: var(--color-error);
  background: var(--color-error-fondo);
  border-color: var(--color-error-borde);
}

.insignia-APROBADO {
  color: var(--color-exito);
  background: var(--color-exito-fondo);
  border-color: var(--color-exito-borde);
}

.insignia-men-pendiente {
  color: var(--color-aviso);
  background: var(--color-aviso-fondo);
  border-color: var(--color-aviso-borde);
}
.insignia-men-subsanacion {
  color: var(--color-error);
  background: var(--color-error-fondo);
  border-color: var(--color-error-borde);
}
.insignia-men-listo {
  color: var(--color-azul);
  background: var(--color-azul-suave);
  border-color: #C9D1EA;
}
.insignia-ajuste {
  color: var(--color-texto-medio);
  background: var(--color-superficie-2);
  border-color: var(--color-borde-fuerte);
}
.docente-meta-operativa {
  margin: 5px 0 0;
  font-size: 12px;
  color: var(--color-texto-suave);
}

/* ============================================================
   CABECERA DE LA FICHA
   ============================================================ */

.ficha-cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--color-borde);
  margin-bottom: 4px;
}

.ficha-identidad { flex: 1 1 320px; min-width: 0; }

.ficha-identidad h2 {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1.12;
  color: var(--color-texto);
  overflow-wrap: anywhere;
}

.ficha-documento {
  margin: 0 0 12px;
  font-size: 14px;
  color: var(--color-texto-suave);
  font-variant-numeric: tabular-nums;
}

.ficha-identidad .insignia + .insignia { margin-left: 6px; }

.ficha-acciones-cabecera {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

/* Datos de la revision guardada */
.ficha-marcas {
  display: block;
  border: 1px solid var(--color-borde);
  border-radius: var(--radio);
  background: var(--color-superficie);
  margin: 18px 0 0;
  padding: 18px;
}

.ficha-marcas-cabecera {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 14px;
}

.ficha-marcas-titulo {
  margin: 0;
  font-size: 14px;
  font-weight: 800;
  color: var(--color-texto);
}

.ficha-marcas-nota {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--color-texto-suave);
}

.ficha-trazabilidad {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

.insignia-radicado-men {
  color: #14532d;
  background: #dcfce7;
  border-color: #86efac;
}

.btn-radicado-men {
  color: #fff;
  background: #1f6f43;
  border-color: #1f6f43;
}

.btn-radicado-men:hover { background: #185a36; }


.ficha-paso {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  gap: 10px;
  min-width: 0;
  padding: 13px;
  border: 1px solid var(--color-borde);
  border-radius: 8px;
  background: var(--color-superficie-2);
}

.ficha-paso-numero {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--color-borde-fuerte);
  border-radius: 50%;
  font-size: 12px;
  font-weight: 800;
  color: var(--color-texto-suave);
  background: var(--color-superficie);
}

.ficha-paso.completo .ficha-paso-numero {
  color: var(--color-exito);
  border-color: var(--color-exito-borde);
  background: var(--color-exito-fondo);
}

.ficha-paso-titulo {
  margin: 0 0 5px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--color-texto-suave);
}

.ficha-paso-valor {
  margin: 0;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--color-texto);
  overflow-wrap: anywhere;
}

.ficha-paso-detalle {
  margin: 4px 0 0;
  font-size: 11.5px;
  line-height: 1.35;
  color: var(--color-texto-suave);
  overflow-wrap: anywhere;
}

.ficha-paso.pendiente .ficha-paso-valor,
.ficha-paso.pendiente .ficha-paso-detalle { color: var(--color-texto-tenue); }

/* ============================================================
   CRITERIOS DE VERIFICACION
   ============================================================ */

.criterios { display: flex; flex-direction: column; }

.criterio {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px 24px;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--color-borde);
}

.criterio:last-child { border-bottom: 0; }

.criterio-etiqueta {
  margin: 0 0 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-texto);
}

.criterio-valor {
  margin: 0;
  font-size: 15px;
  font-weight: 400;
  color: var(--color-texto-medio);
  overflow-wrap: anywhere;
}

.criterio-valor.vacio {
  color: var(--color-texto-tenue);
  font-style: italic;
}

/* Par de botones Coincide / No coincide */
.opciones-criterio {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-self: end;
}

.opcion-criterio {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border: 1px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
  background: var(--color-superficie);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--color-texto-medio);
  cursor: pointer;
  white-space: nowrap;
  transition: border-color var(--transicion), background var(--transicion), color var(--transicion);
}

.opcion-criterio input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.opcion-criterio .marca { font-size: 13px; line-height: 1; }

.opcion-criterio:hover { border-color: var(--color-texto); }

/* El radio esta oculto: el foco lo muestra la etiqueta que lo envuelve. */
.opcion-criterio:focus-within {
  outline: 2px solid var(--color-azul);
  outline-offset: 2px;
}

/* El borde interior simula 2px sin desplazar el contenido */
.opcion-criterio.marcada-si {
  color: var(--color-exito);
  background: var(--color-exito-fondo);
  border-color: var(--color-exito);
  box-shadow: inset 0 0 0 1px var(--color-exito);
}

.opcion-criterio.marcada-no {
  color: var(--color-error);
  background: var(--color-error-fondo);
  border-color: var(--color-primario);
  box-shadow: inset 0 0 0 1px var(--color-primario);
}

/* Criterio sin responder al intentar guardar */
.criterio.sin-responder .opciones-criterio .opcion-criterio {
  border-color: var(--color-primario);
}

/* Campo de correccion: ocupa el ancho completo de la fila */
.correccion {
  grid-column: 1 / -1;
  display: none;
  padding: 14px 16px;
  background: var(--color-error-fondo);
  border: 1px solid var(--color-error-borde);
  border-left: 3px solid var(--color-primario);
  border-radius: var(--radio);
  animation: desplegar 180ms ease;
}

.correccion.visible { display: block; }

@keyframes desplegar {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.correccion label {
  display: block;
  margin-bottom: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--color-error);
}

.correccion .comparacion {
  margin: 0 0 10px;
  font-size: 12.5px;
  color: var(--color-texto-suave);
}

.correccion input,
.correccion select { background: var(--color-superficie); }

.correccion .campo-mayusculas { text-transform: uppercase; }

.correccion.con-error input,
.correccion.con-error select { border-color: var(--color-primario); }

.correccion .mensaje-error { display: none; }
.correccion.con-error .mensaje-error { display: block; }

/* ============================================================
   SOPORTES DOCUMENTALES
   ============================================================ */

.soportes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

.soporte {
  border: 1px solid var(--color-borde);
  border-radius: var(--radio);
  padding: 18px;
  background: var(--color-superficie-2);
}

.soporte.con-error { border-color: var(--color-primario); background: var(--color-error-fondo); }

.soporte-titulo {
  margin: 0 0 2px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--color-texto);
}

.soporte-nota {
  margin: 0 0 12px;
  font-size: 12.5px;
  color: var(--color-texto-suave);
}

.soporte input[type="file"] {
  width: 100%;
  font-size: 13px;
  font-family: inherit;
  color: var(--color-texto-medio);
  background: var(--color-superficie);
  border: 1px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
  padding: 9px 10px;
}

.soporte input[type="file"]::file-selector-button {
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--color-texto);
  background: var(--color-superficie-2);
  border: 1px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
  padding: 6px 12px;
  margin-right: 12px;
  cursor: pointer;
}

.soporte input[type="file"]::file-selector-button:hover {
  border-color: var(--color-primario);
  color: var(--color-error);
}

.soporte input[type="file"]:disabled { background: var(--color-superficie-2); cursor: not-allowed; }

/* Estado del archivo: ya cargado, recien elegido o ausente */
.soporte-estado {
  margin: 10px 0 0;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.soporte-estado.cargado { color: var(--color-exito); font-weight: 600; }
.soporte-estado.nuevo   { color: var(--color-azul);  font-weight: 600; }
.soporte-estado.ausente { color: var(--color-texto-suave); }
.soporte-estado.fallo   { color: var(--color-error); font-weight: 600; }

.soporte-estado a { font-weight: 600; }

/* Enlace a la carpeta del docente en Drive */
.carpeta-docente { margin: 14px 0 0; font-size: 13px; }

.carpeta-docente a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border: 1px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
  background: var(--color-superficie);
  color: var(--color-texto);
  font-weight: 600;
  text-decoration: none;
  transition: border-color var(--transicion), color var(--transicion);
}

.carpeta-docente a:hover {
  border-color: var(--color-primario);
  color: var(--color-error);
}

/* Visor embebido para el acta y el diploma. Drive conserva el control de acceso. */
.espacio-revision { margin-top: 28px; }
.espacio-revision.dos-columnas {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(390px, .85fr);
  gap: 20px;
  align-items: start;
}
.previsualizacion { margin-top: 0; min-width: 0; }
.pestanas-documentos { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.pestanas-documentos .activo {
  color: var(--color-superficie);
  background: var(--color-azul);
  border-color: var(--color-azul);
}
.visor-documento {
  position: relative;
  min-height: 560px;
  border: 1px solid var(--color-borde);
  background: var(--color-superficie-2);
}
.visor-documento iframe { display: block; width: 100%; height: 560px; border: 0; }
.abrir-drive {
  display: inline-block;
  position: absolute;
  right: 12px;
  top: 12px;
  padding: 8px 12px;
  border-radius: var(--radio);
  background: var(--color-superficie);
  border: 1px solid var(--color-borde-fuerte);
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
}

.panel-revisor {
  margin-top: 0;
  padding: 22px;
  border: 1px solid var(--color-borde);
  border-left: 3px solid var(--color-azul);
  background: var(--color-azul-suave);
}
.espacio-revision.dos-columnas .panel-revisor {
  display: flex;
  flex-direction: column;
  height: 650px;
  max-height: calc(100vh - 90px);
  min-height: 520px;
  position: sticky;
  top: 18px;
}
.espacio-revision.dos-columnas .panel-revisor > .descripcion-vista { flex: none; }
.espacio-revision.dos-columnas #camposRevisor {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding-right: 8px;
  scrollbar-gutter: stable;
}
.espacio-revision.dos-columnas .criterio-revisor {
  grid-template-columns: 1fr;
  gap: 10px;
}
.espacio-revision.dos-columnas .opciones-criterio {
  justify-self: stretch;
}
.espacio-revision.dos-columnas .opcion-criterio {
  flex: 1 1 0;
  justify-content: center;
}
.criterios-revisor { margin-bottom: 20px; }
.criterio-revisor {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid var(--color-borde);
}
.criterio-revisor.sin-responder { border-left: 3px solid var(--color-error); padding-left: 12px; }
.correccion-revisor {
  display: none;
  grid-column: 1 / -1;
  padding: 12px;
  background: var(--color-error-fondo);
  border-left: 3px solid var(--color-error);
}
.correccion-revisor.visible { display: block; }
.correccion-revisor label { margin-bottom: 7px; }
.ayuda-correccion-revisor {
  margin: 7px 0 0;
  color: var(--color-texto-medio);
  font-size: 12px;
  line-height: 1.4;
}
.revision-original, .revision-final { margin: 3px 0 0; font-size: 13px; }
.revision-original { color: var(--color-texto-suave); }
.revision-final { color: var(--color-texto); font-weight: 600; }
.acciones-revisor {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.espacio-revision.dos-columnas .acciones-revisor {
  flex: none;
  padding-top: 14px;
  border-top: 1px solid var(--color-borde);
  background: var(--color-azul-suave);
}

/* ============================================================
   CAMPOS
   ============================================================ */

label, .etiqueta {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--color-texto);
}

.obligatorio { color: var(--color-primario); margin-left: 2px; }

.opcional {
  color: var(--color-texto-suave);
  font-weight: 400;
  font-size: 12.5px;
  margin-left: 4px;
}

input[type="text"],
input[type="search"],
input[type="date"],
select,
textarea {
  width: 100%;
  padding: 11px 12px;
  font-family: inherit;
  font-size: 14px;
  color: var(--color-texto);
  background: var(--color-superficie);
  border: 1px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
  transition: border-color var(--transicion), box-shadow var(--transicion);
}

input[type="search"]::-webkit-search-cancel-button { cursor: pointer; }

textarea { resize: vertical; min-height: 110px; line-height: 1.55; }

.dialogo {
  width: min(560px, calc(100% - 32px));
  color: var(--color-texto);
  background: var(--color-superficie);
  border: 1px solid var(--color-borde-fuerte);
  border-top: 4px solid var(--color-primario);
  border-radius: var(--radio);
  padding: 24px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .22);
}
.dialogo::backdrop { background: rgba(0, 0, 0, .48); }
.dialogo h2 { margin: 0 0 8px; font-size: 22px; }
.dialogo label { margin-top: 16px; }
.dialogo-acciones {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}

input:hover:not(:disabled),
select:hover:not(:disabled),
textarea:hover:not(:disabled) { border-color: var(--color-texto); }

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--color-azul);
  box-shadow: inset 0 0 0 1px var(--color-azul);
}

input:disabled, select:disabled, textarea:disabled {
  background: var(--color-superficie-2);
  color: var(--color-texto-medio);
  cursor: not-allowed;
  border-color: var(--color-borde);
}

.mensaje-error {
  color: var(--color-error);
  font-size: 12.5px;
  margin-top: 6px;
  font-weight: 600;
}

/* En modo consulta los controles no deben parecer editables */
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

fieldset:disabled .opcion-criterio { cursor: default; opacity: .85; }
fieldset:disabled .opcion-criterio:hover { border-color: var(--color-borde-fuerte); }
fieldset:disabled .opcion-criterio.marcada-si:hover { border-color: var(--color-exito); }
fieldset:disabled .opcion-criterio.marcada-no:hover { border-color: var(--color-primario); }

/* ============================================================
   BOTONES
   ============================================================ */

button {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  border-radius: var(--radio);
  border: 1px solid transparent;
  padding: 12px 22px;
  cursor: pointer;
  transition: background var(--transicion), border-color var(--transicion), color var(--transicion);
}

button:disabled { opacity: .5; cursor: not-allowed; }

.btn-primario {
  background: var(--color-primario);
  color: var(--color-superficie);
  border-color: var(--color-primario);
  font-weight: 800;
  letter-spacing: .01em;
}
.btn-primario:hover:not(:disabled) {
  background: var(--color-primario-oscuro);
  border-color: var(--color-primario-oscuro);
}

.btn-secundario {
  background: var(--color-superficie);
  color: var(--color-texto);
  border-color: var(--color-borde-fuerte);
}
.btn-secundario:hover:not(:disabled) { border-color: var(--color-texto); }

.btn-texto {
  background: transparent;
  color: var(--color-texto-suave);
  border-color: transparent;
  padding: 10px 12px;
}
.btn-texto:hover:not(:disabled) { color: var(--color-error); }

/* Botones compactos del listado */
.btn-compacto {
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: .04em;
  padding: 9px 16px;
}

.btn-volver {
  margin-bottom: 14px;
  padding-left: 0;
}

/* Accion menor dentro del estado de un soporte: quitar o conservar */
.btn-mini {
  background: transparent;
  border: 0;
  padding: 2px 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--color-texto-suave);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn-mini:hover:not(:disabled) { color: var(--color-error); }

.navegacion {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 26px;
  padding-top: 20px;
  border-top: 2px solid var(--color-borde);
}

.navegacion-derecha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ============================================================
   AVISOS
   ============================================================ */

.aviso {
  padding: 12px 15px;
  font-size: 13.5px;
  color: var(--color-texto-medio);
  margin-bottom: 18px;
  border-left: 3px solid;
  border-radius: 0 var(--radio) var(--radio) 0;
}

.aviso-info    { background: var(--color-azul-suave);  border-color: var(--color-azul); }
.aviso-alerta  { background: var(--color-aviso-fondo); border-color: var(--color-aviso); color: var(--color-aviso); }
.aviso-error   { background: var(--color-error-fondo); border-color: var(--color-error); color: var(--color-error); }
.aviso-exito   { background: var(--color-exito-fondo); border-color: var(--color-exito); color: var(--color-exito); }
.aviso-aviso   { background: var(--color-aviso-fondo); border-color: var(--color-aviso); color: #6B4A00; }

/* Cinta de modo edicion sobre la ficha */
.cinta-modo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin: 0 0 18px;
  padding: 12px 16px;
  font-size: 13.5px;
  border-left: 3px solid var(--color-azul);
  border-radius: 0 var(--radio) var(--radio) 0;
  background: var(--color-azul-suave);
  color: var(--color-texto-medio);
}

.vacio {
  padding: 34px 20px;
  color: var(--color-texto-suave);
  font-size: 13.5px;
  border: 1px dashed var(--color-borde-fuerte);
  border-radius: var(--radio);
  background: var(--color-superficie-2);
  text-align: center;
}

/* ============================================================
   CARGA
   ============================================================ */

.capa-carga {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(243, 242, 242, .94);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
  text-align: center;
  padding: 24px;
}

.capa-carga.visible { display: flex; }

.girador {
  width: 44px;
  height: 44px;
  border: 3px solid var(--color-borde);
  border-top-color: var(--color-primario);
  border-radius: 50%;
  animation: girar 800ms linear infinite;
}

@keyframes girar { to { transform: rotate(360deg); } }

.capa-carga p { color: var(--color-texto-suave); font-size: 14px; margin: 0; }

/* Bloque de carga dentro de la propia vista */
.cargando-bloque {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 26px 20px;
  color: var(--color-texto-suave);
  font-size: 13.5px;
}

.cargando-bloque .girador { width: 22px; height: 22px; border-width: 2px; }

/* ============================================================
   ACCESIBILIDAD
   ============================================================ */

.solo-lectores {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
