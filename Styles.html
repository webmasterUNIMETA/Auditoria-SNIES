<style>
/* ============================================================
   Styles.html
   Validacion documental de docentes - Auditoria SNIES - UNIMETA

   El sistema visual es el mismo del formulario de actualizacion de
   datos: superficies planas, rojo institucional como unico acento,
   tipografia Archivo y micro-rotulos en versalita. La unica licencia
   que se toma es un radio de 4px en tarjetas, campos y botones.

   TODOS los colores estan centralizados en el bloque :root. Para
   cambiar la identidad visual basta con editar esas variables.
   ============================================================ */

:root {
  /* --- Colores institucionales, tomados del logotipo UNIMETA --- */
  --color-primario:        #D81824;   /* rojo del logotipo */
  --color-primario-oscuro: #A8111B;   /* rojo para estados hover y textos */
  --color-primario-suave:  #FDEEEF;   /* tinte de fondo */
  --color-primario-borde:  #F2C9CC;   /* borde sobre el tinte */
  --color-azul:            #243C84;   /* azul del escudo: foco y notas */
  --color-azul-suave:      #F1F3F9;   /* fondo de las notas informativas */

  /* --- Neutros --- */
  --color-texto:           #1E2024;
  --color-texto-medio:     #3A3E45;
  --color-texto-suave:     #5C6169;
  --color-texto-tenue:     #8A8F96;
  --color-borde:           #E0E2E6;
  --color-borde-fuerte:    #B9BDC4;
  --color-fondo:           #F3F2F2;   /* fondo de pagina */
  --color-superficie:      #FFFFFF;
  --color-superficie-2:    #F8F8F8;   /* bloques embebidos */

  /* --- Estados --- */
  --color-error:           #A8111B;
  --color-error-fondo:     #FDEEEF;
  --color-error-borde:     #F2C9CC;
  --color-exito:           #1B5E20;
  --color-exito-fondo:     #EDF6EE;
  --color-exito-borde:     #C3E0C6;
  --color-aviso:           #8A6100;
  --color-aviso-fondo:     #FFF6E0;
  --color-aviso-borde:     #F0DCA8;

  /* --- Cinco fases del tramite --- */
  --fase-captura:           #8A6100;
  --fase-captura-fondo:     #FFF6E0;
  --fase-revision:          #243C84;
  --fase-revision-fondo:    #F1F3F9;
  --fase-men:               #A8111B;
  --fase-men-fondo:         #FDEEEF;
  --fase-snies:             #65508F;
  --fase-snies-fondo:       #F3F0F8;
  --fase-cerrado:           #1B5E20;
  --fase-cerrado-fondo:     #EDF6EE;

  /* --- Medidas --- */
  --ancho-max:             1140px;
  --relleno-tarjeta:       28px;
  --radio:                 4px;
  --radio-grande:          6px;
  --transicion:            160ms ease;

  /* --- Tipografia --- */
  --tipo: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  padding: 0;
  background: var(--color-fondo);
  color: var(--color-texto);
  font-family: var(--tipo);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--color-primario-oscuro); text-underline-offset: 3px; }
a:hover { color: var(--color-primario); }

::selection { background: var(--color-primario-suave); }

/* Foco visible unico para toda la aplicacion */
a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--color-azul);
  outline-offset: 2px;
}

/* ============================================================
   ENCABEZADO Y AVANCE
   ============================================================ */

/* El encabezado es blanco: el logotipo es rojo sobre transparente y el
   escudo es multicolor, asi que sobre un fondo de color perderia nitidez. */
.encabezado { background: var(--color-superficie); }

.encabezado-interno {
  max-width: var(--ancho-max);
  margin: 0 auto;
  padding: 22px 24px;
  display: flex;
  align-items: center;
  gap: 22px;
  flex-wrap: wrap;
}

.logo { height: 60px; width: auto; flex: none; }

.encabezado-textos {
  border-left: 1px solid var(--color-borde);
  padding-left: 22px;
  flex: 1 1 260px;
  min-width: 0;
}

.encabezado h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1.1;
  color: var(--color-texto);
}

.encabezado p {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--color-texto-suave);
}

/* Franja institucional bajo el encabezado */
.franja { height: 4px; background: var(--color-primario); }

/* Quien tiene la sesion abierta */
.sesion { text-align: right; flex: none; }

.sesion-correo {
  margin: 0 0 2px;
  font-size: 12.5px;
  color: var(--color-texto-suave);
  overflow-wrap: anywhere;
}
.sesion-rol {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--color-azul);
}

.selector-rol {
  margin: 6px 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
  font-size: 11px;
  font-weight: 700;
  color: var(--color-texto-suave);
}

.selector-rol select {
  width: auto;
  min-width: 150px;
  padding: 6px 30px 6px 9px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--color-texto);
  background-color: var(--color-superficie);
}

/* ============================================================
   PUERTA DE ENTRADA

   Tapa la aplicacion entera hasta que Google confirma la identidad.
   No es decorativa: mientras esta visible no se ha pedido ni un dato
   al servidor.
   ============================================================ */

.puerta {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--color-fondo);
  overflow-y: auto;
}

.puerta[hidden] { display: none !important; }

.puerta-tarjeta {
  width: min(460px, 100%);
  padding: 36px 32px;
  background: var(--color-superficie);
  border: 1px solid var(--color-borde);
  border-top: 3px solid var(--color-primario);
  border-radius: var(--radio);
  text-align: center;
}

.puerta-tarjeta .logo {
  height: 52px;
  margin: 0 auto 22px;
  display: block;
}

.puerta-tarjeta h1 {
  margin: 0 0 10px;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1.15;
  color: var(--color-texto);
}

.puerta-texto {
  margin: 0 0 24px;
  font-size: 14px;
  color: var(--color-texto-suave);
  text-wrap: pretty;
}

/* Aqui dibuja Google su propio boton; solo se le da sitio. */
.puerta-boton {
  display: flex;
  justify-content: center;
  min-height: 44px;
  margin-bottom: 8px;
}

.puerta .aviso { margin: 18px 0 0; text-align: left; }

.puerta-pie {
  margin: 22px 0 0;
  padding-top: 18px;
  border-top: 1px solid var(--color-borde);
  font-size: 12px;
  color: var(--color-texto-tenue);
}

/* ============================================================
   ESTRUCTURA
   ============================================================ */

main {
  max-width: var(--ancho-max);
  margin: 0 auto;
  padding: 28px 24px 80px;
}

.vista { display: none; }
.vista.activa { display: block; animation: aparecer 200ms ease; }

@keyframes aparecer {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}

/* Tarjeta: superficie plana con remate rojo superior */
.tarjeta {
  background: var(--color-superficie);
  border: 1px solid var(--color-borde);
  border-top: 3px solid var(--color-primario);
  border-radius: var(--radio);
  padding: var(--relleno-tarjeta);
  margin-bottom: 18px;
}

/* Variante sin remate, para bloques secundarios */
.tarjeta-simple { border-top: 1px solid var(--color-borde); }

/* Variante neutra para cabeceras y secciones informativas. */
.tarjeta-neutra { border-top-color: var(--color-texto-medio); }

.titulo-vista {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1.12;
  color: var(--color-texto);
}

.descripcion-vista {
  margin: 0 0 20px;
  font-size: 15px;
  color: var(--color-texto-suave);
  max-width: 64ch;
  text-wrap: pretty;
}

.subtitulo {
  margin: 28px 0 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--color-texto-suave);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--color-borde);
}

.subtitulo:first-child { margin-top: 0; }

.nota-pie {
  margin: 16px 0 0;
  font-size: 12.5px;
  color: var(--color-texto-suave);
}

/* ============================================================
   BANDEJA: AVANCE Y PESTANAS

   La barra resume el recorrido completo; las pestanas separan el
   trabajo propio, lo que esta en otras manos y lo ya cerrado.
   ============================================================ */

.bandeja-cabecera { padding-bottom: 22px; }

.bandeja-titulos {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
}

.bandeja-titulos > div { min-width: 0; }
.bandeja-titulos .descripcion-vista { margin-bottom: 0; }

.avance {
  display: grid;
  grid-template-columns: auto minmax(240px, 1fr);
  align-items: center;
  gap: 10px 22px;
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--color-borde);
}

.avance-total {
  grid-row: 1 / span 2;
  margin: 0;
  color: var(--color-texto-suave);
  font-size: 13px;
  white-space: nowrap;
}

.avance-total strong {
  display: block;
  color: var(--color-texto);
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.barra-fases {
  display: flex;
  width: 100%;
  height: 12px;
  overflow: hidden;
  background: var(--color-superficie-2);
  border: 1px solid var(--color-borde);
  border-radius: 999px;
}

.segmento { min-width: 5px; }
.segmento + .segmento { border-left: 2px solid var(--color-superficie); }

.barra-fases-leyenda {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 16px;
  margin: 0;
  padding: 0;
  list-style: none;
  color: var(--color-texto-suave);
  font-size: 11.5px;
}

.barra-fases-leyenda li { white-space: nowrap; }
.barra-fases-leyenda strong { color: var(--color-texto); font-variant-numeric: tabular-nums; }

.muestra-fase {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 5px;
  border-radius: 50%;
  background: currentColor;
}

.fase-captura { --fase-color: var(--fase-captura); --fase-fondo: var(--fase-captura-fondo); }
.fase-revision { --fase-color: var(--fase-revision); --fase-fondo: var(--fase-revision-fondo); }
.fase-men { --fase-color: var(--fase-men); --fase-fondo: var(--fase-men-fondo); }
.fase-snies { --fase-color: var(--fase-snies); --fase-fondo: var(--fase-snies-fondo); }
.fase-cerrado { --fase-color: var(--fase-cerrado); --fase-fondo: var(--fase-cerrado-fondo); }

.segmento.fase-captura,
.segmento.fase-revision,
.segmento.fase-men,
.segmento.fase-snies,
.segmento.fase-cerrado { background: var(--fase-color); }

.barra-fases-leyenda .fase-captura,
.barra-fases-leyenda .fase-revision,
.barra-fases-leyenda .fase-men,
.barra-fases-leyenda .fase-snies,
.barra-fases-leyenda .fase-cerrado { color: var(--fase-color); }

.pestanas {
  display: flex;
  gap: 2px;
  margin: 0 0 16px;
  border-bottom: 1px solid var(--color-borde-fuerte);
}

.pestana {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: -1px;
  padding: 11px 16px;
  color: var(--color-texto-suave);
  background: transparent;
  border: 0;
  border-bottom: 3px solid transparent;
  border-radius: 0;
}

.pestana:hover { color: var(--color-texto); background: var(--color-superficie-2); }
.pestana.activa { color: var(--color-primario-oscuro); border-bottom-color: var(--color-primario); }
.pestana-rotulo { font-size: 13.5px; }
.pestana-cifra {
  min-width: 24px;
  padding: 1px 7px;
  border-radius: 999px;
  color: var(--color-texto-medio);
  background: var(--color-superficie-2);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.pestana.activa .pestana-cifra { color: var(--color-primario-oscuro); background: var(--color-primario-suave); }

/* ============================================================
   BUSCADOR
   ============================================================ */

/* Campo llano, como el resto de los campos del sistema: sin icono
   decorativo encima del texto. */
.buscador input[type="search"] { font-size: 15px; }

.buscador { max-width: 620px; }

.conteo-resultados {
  margin: 12px 0 0;
  font-size: 12.5px;
  color: var(--color-texto-suave);
}

/* ============================================================
   SITUACION DEL EXPEDIENTE
   ============================================================ */

.panel-situacion {
  margin: 0 0 18px;
  padding: 18px 20px;
  background: var(--fase-fondo, var(--color-superficie-2));
  border: 1px solid var(--color-borde);
  border-left: 4px solid var(--fase-color, var(--color-borde-fuerte));
  border-radius: var(--radio);
}

.panel-situacion.le-toca { box-shadow: inset 0 0 0 1px var(--fase-color); }

.panel-situacion h3 {
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -.01em;
  color: var(--fase-color, var(--color-texto));
}

.panel-situacion > p {
  margin: 0 0 8px;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--color-texto-medio);
  max-width: 78ch;
  text-wrap: pretty;
}

.panel-situacion > p:last-child { margin-bottom: 0; }

/* La cita recoge el texto que escribió una persona: motivo de devolución
   o de subsanación. Se distingue del texto del sistema. */
.situacion-cita {
  margin: 12px 0 0;
  padding: 12px 16px;
  background: var(--color-superficie);
  border: 1px solid var(--color-borde);
  border-radius: var(--radio);
}

.situacion-cita p {
  margin: 0;
  font-size: 14px;
  color: var(--color-texto);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.situacion-cita footer {
  margin-top: 8px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--color-texto-tenue);
}

.situacion-lista-titulo { margin-top: 14px !important; font-weight: 700; }

.situacion-lista {
  margin: 12px 0 0;
  padding-left: 20px;
  font-size: 13.5px;
  color: var(--color-texto-medio);
}

.situacion-lista li { margin-bottom: 3px; }

.situacion-acciones {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--color-borde);
  flex-wrap: wrap;
}

/* Botón de cerrar dentro de un aviso persistente */
.aviso-cerrar { margin-left: 10px; color: inherit; }

/* ============================================================
   LISTADO DE DOCENTES
   ============================================================ */

.lista-docentes { display: flex; flex-direction: column; gap: 10px; }

.docente {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 16px 18px;
  background: var(--color-superficie);
  border: 1px solid var(--color-borde);
  border-left: 4px solid var(--fase-color, var(--color-borde-fuerte));
  border-radius: var(--radio);
  transition: border-color var(--transicion), background var(--transicion);
}

.docente:hover { border-color: var(--color-borde-fuerte); background: #FFFEFE; }

.docente-datos { flex: 1 1 280px; min-width: 0; }

.docente-nombre {
  display: block;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--color-texto);
  text-align: left;
  overflow-wrap: anywhere;
}

button.docente-nombre { text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
button.docente-nombre:hover { color: var(--color-primario-oscuro); text-decoration-color: currentColor; }

.docente-documento {
  margin: 3px 0 0;
  font-size: 12.5px;
  color: var(--color-texto-suave);
  font-variant-numeric: tabular-nums;
}

.docente-meta {
  margin: 4px 0 0;
  color: var(--color-texto-suave);
  font-size: 12px;
}

.docente-motivo {
  max-width: 68ch;
  margin: 10px 0 0;
  padding: 8px 12px;
  color: var(--color-texto-medio);
  background: var(--color-error-fondo);
  border-left: 3px solid var(--color-error);
  font-size: 12.5px;
  line-height: 1.45;
}

.docente-acciones {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}


/* Una sola insignia: el color indica fase y el texto la situacion exacta. */
.insignia {
  display: inline-flex;
  align-items: center;
  padding: 5px 10px;
  border: 1px solid;
  border-radius: var(--radio);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.insignia-fase {
  color: var(--fase-color);
  background: var(--fase-fondo);
  border-color: var(--fase-color);
}

.insignia-fase .muestra-fase { width: 7px; height: 7px; }

/* ============================================================
   CABECERA DE LA FICHA
   ============================================================ */

.ficha-cabecera {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--color-borde);
  margin-bottom: 18px;
}

.ficha-identidad { flex: 1 1 320px; min-width: 0; }

.ficha-identidad h2 {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -.02em;
  line-height: 1.12;
  color: var(--color-texto);
  overflow-wrap: anywhere;
}

.ficha-documento {
  margin: 0;
  font-size: 14px;
  color: var(--color-texto-suave);
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   CRITERIOS DE VERIFICACION
   ============================================================ */

.criterios { display: flex; flex-direction: column; }

.criterio {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px 24px;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--color-borde);
}

.criterio:last-child { border-bottom: 0; }

.criterio-etiqueta {
  margin: 0 0 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-texto);
}

.criterio-valor {
  margin: 0;
  font-size: 15px;
  font-weight: 400;
  color: var(--color-texto-medio);
  overflow-wrap: anywhere;
}

.criterio-valor.vacio {
  color: var(--color-texto-tenue);
  font-style: italic;
}

/* Par de botones Coincide / No coincide */
.opciones-criterio {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-self: end;
}

.opcion-criterio {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border: 1px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
  background: var(--color-superficie);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--color-texto-medio);
  cursor: pointer;
  white-space: nowrap;
  transition: border-color var(--transicion), background var(--transicion), color var(--transicion);
}

.opcion-criterio input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.opcion-criterio .marca { font-size: 13px; line-height: 1; }

.opcion-criterio:hover { border-color: var(--color-texto); }

/* El radio esta oculto: el foco lo muestra la etiqueta que lo envuelve. */
.opcion-criterio:focus-within {
  outline: 2px solid var(--color-azul);
  outline-offset: 2px;
}

/* El borde interior simula 2px sin desplazar el contenido */
.opcion-criterio.marcada-si {
  color: var(--color-exito);
  background: var(--color-exito-fondo);
  border-color: var(--color-exito);
  box-shadow: inset 0 0 0 1px var(--color-exito);
}

.opcion-criterio.marcada-no {
  color: var(--color-error);
  background: var(--color-error-fondo);
  border-color: var(--color-primario);
  box-shadow: inset 0 0 0 1px var(--color-primario);
}

/* Criterio sin responder al intentar guardar */
.criterio.sin-responder .opciones-criterio .opcion-criterio {
  border-color: var(--color-primario);
}

/* Campo de correccion: ocupa el ancho completo de la fila */
.correccion {
  grid-column: 1 / -1;
  display: none;
  padding: 14px 16px;
  background: var(--color-error-fondo);
  border: 1px solid var(--color-error-borde);
  border-left: 3px solid var(--color-primario);
  border-radius: var(--radio);
  animation: desplegar 180ms ease;
}

.correccion.visible { display: block; }

@keyframes desplegar {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.correccion label {
  display: block;
  margin-bottom: 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--color-error);
}

.correccion .comparacion {
  margin: 0 0 10px;
  font-size: 12.5px;
  color: var(--color-texto-suave);
}

.correccion input,
.correccion select { background: var(--color-superficie); }

.correccion .campo-mayusculas { text-transform: uppercase; }

.correccion.con-error input,
.correccion.con-error select { border-color: var(--color-primario); }

.correccion .mensaje-error { display: none; }
.correccion.con-error .mensaje-error { display: block; }

/* ============================================================
   SOPORTES DOCUMENTALES
   ============================================================ */

.soportes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

.soporte {
  border: 1px solid var(--color-borde);
  border-radius: var(--radio);
  padding: 18px;
  background: var(--color-superficie-2);
}

.soporte.con-error { border-color: var(--color-primario); background: var(--color-error-fondo); }

.soporte-titulo {
  margin: 0 0 2px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--color-texto);
}

.soporte-nota {
  margin: 0 0 12px;
  font-size: 12.5px;
  color: var(--color-texto-suave);
}

.soporte input[type="file"] {
  width: 100%;
  font-size: 13px;
  font-family: inherit;
  color: var(--color-texto-medio);
  background: var(--color-superficie);
  border: 1px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
  padding: 9px 10px;
}

.soporte input[type="file"]::file-selector-button {
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--color-texto);
  background: var(--color-superficie-2);
  border: 1px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
  padding: 6px 12px;
  margin-right: 12px;
  cursor: pointer;
}

.soporte input[type="file"]::file-selector-button:hover {
  border-color: var(--color-primario);
  color: var(--color-error);
}

.soporte input[type="file"]:disabled { background: var(--color-superficie-2); cursor: not-allowed; }

/* Estado del archivo: ya cargado, recien elegido o ausente */
.soporte-estado {
  margin: 10px 0 0;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.soporte-estado.cargado { color: var(--color-exito); font-weight: 600; }
.soporte-estado.nuevo   { color: var(--color-azul);  font-weight: 600; }
.soporte-estado.ausente { color: var(--color-texto-suave); }
.soporte-estado.fallo   { color: var(--color-error); font-weight: 600; }

.soporte-estado a { font-weight: 600; }

/* Enlace a la carpeta del docente en Drive */
.carpeta-docente { margin: 14px 0 0; font-size: 13px; }

.carpeta-docente a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border: 1px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
  background: var(--color-superficie);
  color: var(--color-texto);
  font-weight: 600;
  text-decoration: none;
  transition: border-color var(--transicion), color var(--transicion);
}

.carpeta-docente a:hover {
  border-color: var(--color-primario);
  color: var(--color-error);
}

/* Decisión y visor. Drive conserva el control de acceso de cada soporte. */
.espacio-revision { margin-top: 28px; }
.espacio-revision.dos-columnas {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(320px, .75fr);
  gap: 20px;
  align-items: start;
}
.previsualizacion { margin-top: 0; min-width: 0; }
.pestanas-documentos { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.pestanas-documentos .activo {
  color: var(--color-superficie);
  background: var(--color-azul);
  border-color: var(--color-azul);
}
.visor-documento {
  position: relative;
  min-height: 560px;
  border: 1px solid var(--color-borde);
  background: var(--color-superficie-2);
}
.visor-documento iframe { display: block; width: 100%; height: 560px; border: 0; }
.abrir-drive {
  display: inline-block;
  position: absolute;
  right: 12px;
  top: 12px;
  padding: 8px 12px;
  border-radius: var(--radio);
  background: var(--color-superficie);
  border: 1px solid var(--color-borde-fuerte);
  font-size: 12px;
  font-weight: 700;
  text-decoration: none;
}

.panel-revisor {
  margin-top: 0;
  min-width: 0;
  padding: 20px;
  border: 1px solid var(--color-borde);
  border-top: 3px solid var(--color-azul);
  border-radius: var(--radio);
  background: var(--color-superficie);
}

.tabla-decision {
  overflow-x: auto;
  border: 1px solid var(--color-borde);
  border-radius: var(--radio);
  -webkit-overflow-scrolling: touch;
}

.tabla-decision-cabecera,
.criterio-revisor {
  display: grid;
  grid-template-columns: minmax(105px, .8fr) minmax(110px, .95fr) minmax(125px, 1fr) minmax(190px, 1.35fr);
  min-width: 600px;
}

.tabla-decision-cabecera {
  color: var(--color-texto-suave);
  background: var(--color-superficie-2);
  border-bottom: 1px solid var(--color-borde);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
}

.tabla-decision-cabecera > span,
.criterio-revisor > .celda {
  min-width: 0;
  padding: 12px;
  border-right: 1px solid var(--color-borde);
}

.tabla-decision-cabecera > span:last-child,
.criterio-revisor > .celda:last-child { border-right: 0; }

.criterio-revisor { align-items: stretch; border-bottom: 1px solid var(--color-borde); }
.criterio-revisor:last-child { border-bottom: 0; }
.criterio-revisor > .celda { display: flex; align-items: center; font-size: 12.5px; overflow-wrap: anywhere; }
.criterio-revisor .criterio-etiqueta { margin: 0; }
.dato-snies { color: var(--color-texto-medio); }
.dato-th { color: var(--color-exito); font-weight: 600; }
.dato-th.corrige { color: var(--color-error); }
.celda-decision > div { width: 100%; }

.criterio-revisor.sin-responder { box-shadow: inset 4px 0 0 var(--color-error); }
.criterio-revisor.sin-responder .celda-decision { background: var(--color-error-fondo); }
.criterio-revisor .opciones-criterio { justify-self: stretch; gap: 6px; }
.criterio-revisor .opcion-criterio {
  flex: 1 1 0;
  justify-content: center;
  padding: 8px 9px;
  font-size: 12px;
}

.correccion-revisor {
  display: none;
  margin-top: 9px;
  padding: 10px;
  background: var(--color-error-fondo);
  border-left: 3px solid var(--color-error);
}
.correccion-revisor.visible { display: block; }
.correccion-revisor label { margin-bottom: 7px; }
.acciones-revisor {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}

/* ============================================================
   CAMPOS
   ============================================================ */

label, .etiqueta {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--color-texto);
}

.obligatorio { color: var(--color-primario); margin-left: 2px; }

.opcional {
  color: var(--color-texto-suave);
  font-weight: 400;
  font-size: 12.5px;
  margin-left: 4px;
}

input[type="text"],
input[type="search"],
input[type="date"],
select,
textarea {
  width: 100%;
  padding: 11px 12px;
  font-family: inherit;
  font-size: 14px;
  color: var(--color-texto);
  background: var(--color-superficie);
  border: 1px solid var(--color-borde-fuerte);
  border-radius: var(--radio);
  transition: border-color var(--transicion), box-shadow var(--transicion);
}

input[type="search"]::-webkit-search-cancel-button { cursor: pointer; }

textarea { resize: vertical; min-height: 110px; line-height: 1.55; }

.dialogo {
  width: min(560px, calc(100% - 32px));
  color: var(--color-texto);
  background: var(--color-superficie);
  border: 1px solid var(--color-borde-fuerte);
  border-top: 4px solid var(--color-primario);
  border-radius: var(--radio);
  padding: 24px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .22);
}
.dialogo::backdrop { background: rgba(0, 0, 0, .48); }
.dialogo h2 { margin: 0 0 8px; font-size: 22px; }
.dialogo label { margin-top: 16px; }
.dialogo-acciones {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}

input:hover:not(:disabled),
select:hover:not(:disabled),
textarea:hover:not(:disabled) { border-color: var(--color-texto); }

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--color-azul);
  box-shadow: inset 0 0 0 1px var(--color-azul);
}

input:disabled, select:disabled, textarea:disabled {
  background: var(--color-superficie-2);
  color: var(--color-texto-medio);
  cursor: not-allowed;
  border-color: var(--color-borde);
}

.mensaje-error {
  color: var(--color-error);
  font-size: 12.5px;
  margin-top: 6px;
  font-weight: 600;
}

/* En modo consulta los controles no deben parecer editables */
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

fieldset:disabled .opcion-criterio { cursor: default; opacity: .85; }
fieldset:disabled .opcion-criterio:hover { border-color: var(--color-borde-fuerte); }
fieldset:disabled .opcion-criterio.marcada-si:hover { border-color: var(--color-exito); }
fieldset:disabled .opcion-criterio.marcada-no:hover { border-color: var(--color-primario); }

/* ============================================================
   BOTONES
   ============================================================ */

button {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  border-radius: var(--radio);
  border: 1px solid transparent;
  padding: 12px 22px;
  cursor: pointer;
  transition: background var(--transicion), border-color var(--transicion), color var(--transicion);
}

button:disabled { opacity: .5; cursor: not-allowed; }

.btn-primario {
  background: var(--color-primario);
  color: var(--color-superficie);
  border-color: var(--color-primario);
  font-weight: 800;
  letter-spacing: .01em;
}
.btn-primario:hover:not(:disabled) {
  background: var(--color-primario-oscuro);
  border-color: var(--color-primario-oscuro);
}

.btn-secundario {
  background: var(--color-superficie);
  color: var(--color-texto);
  border-color: var(--color-borde-fuerte);
}
.btn-secundario:hover:not(:disabled) { border-color: var(--color-texto); }

.btn-texto {
  background: transparent;
  color: var(--color-texto-suave);
  border-color: transparent;
  padding: 10px 12px;
}
.btn-texto:hover:not(:disabled) { color: var(--color-error); }

/* Botones compactos del listado */
.btn-compacto {
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: .04em;
  padding: 9px 16px;
}

.btn-volver {
  margin-bottom: 14px;
  padding-left: 0;
}

/* Accion menor dentro del estado de un soporte: quitar o conservar */
.btn-mini {
  background: transparent;
  border: 0;
  padding: 2px 6px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--color-texto-suave);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn-mini:hover:not(:disabled) { color: var(--color-error); }

.barra-acciones {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 26px;
  padding-top: 20px;
  border-top: 2px solid var(--color-borde);
}

.barra-acciones-derecha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* Historial secundario: permanece plegado hasta que alguien necesita auditarlo. */
.historial-expediente {
  margin-top: 26px;
  padding-top: 18px;
  border-top: 1px solid var(--color-borde);
}

.historial-expediente summary {
  color: var(--color-texto-medio);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

.historial-expediente[open] summary { margin-bottom: 16px; }

.historial-pasos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.historial-paso {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  gap: 10px;
  min-width: 0;
  padding: 12px;
  border: 1px solid var(--color-borde);
  border-radius: var(--radio);
  background: var(--color-superficie-2);
}

.historial-numero {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--color-borde-fuerte);
  border-radius: 50%;
  color: var(--color-texto-suave);
  background: var(--color-superficie);
  font-size: 12px;
  font-weight: 800;
}

.historial-paso.completo .historial-numero {
  color: var(--color-exito);
  border-color: var(--color-exito-borde);
  background: var(--color-exito-fondo);
}

.historial-titulo { margin: 0 0 4px; color: var(--color-texto); font-size: 12.5px; font-weight: 700; }
.historial-detalle { margin: 0; color: var(--color-texto-suave); font-size: 11.5px; overflow-wrap: anywhere; }
.historial-paso.sin-registrar .historial-titulo,
.historial-paso.sin-registrar .historial-detalle { color: var(--color-texto-tenue); }

/* ============================================================
   AVISOS
   ============================================================ */

.aviso {
  padding: 12px 15px;
  font-size: 13.5px;
  color: var(--color-texto-medio);
  margin-bottom: 18px;
  border-left: 3px solid;
  border-radius: 0 var(--radio) var(--radio) 0;
}

.aviso-info    { background: var(--color-azul-suave);  border-color: var(--color-azul); }
.aviso-alerta  { background: var(--color-aviso-fondo); border-color: var(--color-aviso); color: var(--color-aviso); }
.aviso-error   { background: var(--color-error-fondo); border-color: var(--color-error); color: var(--color-error); }
.aviso-exito   { background: var(--color-exito-fondo); border-color: var(--color-exito); color: var(--color-exito); }
.aviso-aviso   { background: var(--color-aviso-fondo); border-color: var(--color-aviso); color: #6B4A00; }

.vacio {
  padding: 34px 20px;
  color: var(--color-texto-suave);
  font-size: 13.5px;
  border: 1px dashed var(--color-borde-fuerte);
  border-radius: var(--radio);
  background: var(--color-superficie-2);
  text-align: center;
}

/* ============================================================
   CARGA
   ============================================================ */

.capa-carga {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(243, 242, 242, .94);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 18px;
  text-align: center;
  padding: 24px;
}

.capa-carga.visible { display: flex; }

.girador {
  width: 44px;
  height: 44px;
  border: 3px solid var(--color-borde);
  border-top-color: var(--color-primario);
  border-radius: 50%;
  animation: girar 800ms linear infinite;
}

@keyframes girar { to { transform: rotate(360deg); } }

.capa-carga p { color: var(--color-texto-suave); font-size: 14px; margin: 0; }

/* Bloque de carga dentro de la propia vista */
.cargando-bloque {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 26px 20px;
  color: var(--color-texto-suave);
  font-size: 13.5px;
}

.cargando-bloque .girador { width: 22px; height: 22px; border-width: 2px; }

/* ============================================================
   ACCESIBILIDAD
   ============================================================ */

.solo-lectores {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.saltar-al-contenido {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--color-primario);
  color: var(--color-superficie);
  padding: 10px 18px;
  z-index: 1100;
  font-weight: 600;
  text-decoration: none;
}
.saltar-al-contenido:focus { left: 0; color: var(--color-superficie); }

/* ============================================================
   RESPONSIVO
   ============================================================ */

@media (max-width: 1000px) {
  .espacio-revision.dos-columnas { display: block; }
  .espacio-revision.dos-columnas .previsualizacion { margin-top: 28px; }
}

@media (max-width: 860px) {
  .criterio { grid-template-columns: 1fr; gap: 12px; }
  .opciones-criterio { justify-self: stretch; }
  .opcion-criterio { flex: 1 1 0; justify-content: center; }
}

@media (max-width: 720px) {
  :root { --relleno-tarjeta: 20px; }
  main { padding: 18px 14px 72px; }
  .encabezado-interno { padding: 16px 14px; gap: 12px; }
  .logo { height: 40px; max-width: 140px; }
  .encabezado-textos { padding-left: 12px; }
  .encabezado h1 { font-size: 18px; overflow-wrap: anywhere; }
  .titulo-vista, .ficha-identidad h2 { font-size: 21px; }
  .descripcion-vista { font-size: 14px; }
  .bandeja-titulos { display: block; }
  .bandeja-titulos .btn-compacto { margin-top: 14px; }
  .avance { grid-template-columns: 1fr; }
  .avance-total { grid-row: auto; }
  .avance-total strong { display: inline; margin-right: 4px; font-size: 23px; }
  .pestanas { gap: 0; }
  .pestana { flex: 1 1 0; justify-content: center; padding: 10px 7px; }
  .pestana-rotulo { font-size: 12px; }
  .tabla-decision { overflow: visible; }
  .tabla-decision-cabecera { display: none; }
  .criterio-revisor { display: block; min-width: 0; padding: 7px 0; }
  .criterio-revisor > .celda {
    display: grid;
    grid-template-columns: 105px minmax(0, 1fr);
    gap: 10px;
    padding: 8px 12px;
    border: 0;
  }
  .criterio-revisor > .celda::before {
    content: attr(data-rotulo);
    color: var(--color-texto-tenue);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .criterio-revisor .opciones-criterio { display: grid; grid-template-columns: 1fr; }
  .visor-documento, .visor-documento iframe { min-height: 430px; height: 430px; }
  .docente { align-items: flex-start; }
  .docente-acciones { width: 100%; justify-content: space-between; }
  .barra-acciones { flex-direction: column-reverse; align-items: stretch; }
  .barra-acciones-derecha { flex-direction: column-reverse; }
  .barra-acciones button { width: 100%; }
  .acciones-tablero { align-items: stretch; }
  .acciones-tablero-derecha { margin-left: 0; }
}

@media (max-width: 420px) {
  .pestana { flex-direction: column; gap: 3px; }
  .docente-acciones { align-items: stretch; flex-direction: column; }
  .docente-acciones .btn-compacto { width: 100%; }
  .situacion-acciones { flex-direction: column-reverse; }
  .situacion-acciones button { width: 100%; }
}

/* ============================================================
   TABLERO DE GESTIÓN
   ============================================================ */

.acciones-tablero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.acciones-tablero .btn-volver { margin-bottom: 0; }
.acciones-tablero-derecha { display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap; }

/* Rótulo en versalita que estampa a qué momento corresponde un bloque.
   Es la pieza que impide confundir "estado a hoy" con "movimientos del
   periodo": cada bloque dice el suyo. */
.estampa {
  margin: 0 0 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--color-texto-tenue);
}

.informe-cabecera {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.informe-cabecera .titulo-vista { margin: 0; }
.informe-linea {
  margin: 0;
  color: var(--color-texto-suave);
  font-size: 12.5px;
  overflow-wrap: anywhere;
}

.seccion-informe .titulo-seccion {
  margin: 0 0 14px;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -.01em;
}

.seccion-informe > .avance-total { margin-bottom: 10px; }
.seccion-informe > .barra-fases { margin-bottom: 9px; }
.seccion-informe > .barra-fases-leyenda { margin-bottom: 20px; }

.informe-frase {
  max-width: 90ch;
  margin: 0 0 18px;
